versao_schema: 1
trilha:
  id: trilha:programacao/linguagem-c-ansi
  titulo: Linguagem C, do tutorial à interface com o UNIX
  # rev 2: passou a referenciar `etapa:so/linha-de-comando`, obrigatória, que esta
  # trilha pressupunha sem declarar — incluir etapa obrigatória é substantivo
  # (docs/catalogo.md §4, ADR-0010).
  rev: 2
  status: ativo
  objetivo_declarado:
    - competencia: comp:programacao/c-apontadores
      nivel: intermediario
    - competencia: comp:programacao/c-estruturas
      nivel: intermediario
    - competencia: comp:programacao/c-entrada-saida-e-biblioteca
      nivel: intermediario
    - competencia: comp:programacao/c-interface-unix
      nivel: intermediario

  # Segue a espinha de Kernighan & Ritchie, *C: A Linguagem de Programação — Padrão
  # ANSI* (a tradução da 2ª edição americana): um tutorial que percorre a linguagem
  # inteira por alto, depois a mesma linguagem em profundidade, capítulo a capítulo.
  # Os exercícios do livro são a verificação natural de cada etapa.
  #
  # Depois de apontadores, estruturas e E/S são independentes e podem ser cursadas
  # em paralelo; a interface com o UNIX volta a juntar as duas — é o grafo, não uma
  # lista (ADR-0002).
  etapas:
    # --- Fundamento ---------------------------------------------------------
    - id: etapa:programacao/c-introducao-em-tutorial
      titulo: Uma introdução em tutorial — a linguagem inteira por alto
      rev: 1
      status: ativo
      descricao: >
        A linguagem inteira por alto, pelo capítulo 1 do K&R: o bastante para escrever
        programas úteis antes de ver cada parte com rigor.
      esforco_estimado_min: 600
      opcional: false
      requires: []
      teaches:
        - competencia: comp:programacao/c-fundamentos
          nivel_resultante: iniciante

    - id: etapa:programacao/c-tipos-operadores-e-controle-de-fluxo
      titulo: Tipos, operadores, expressões e controle de fluxo
      rev: 1
      status: ativo
      descricao: >
        Tipos, operadores e expressões, com as conversões implícitas que surpreendem; e
        o controle de fluxo da linguagem, agora com rigor.
      esforco_estimado_min: 540
      opcional: false
      requires:
        - competencia: comp:programacao/c-fundamentos
          nivel_minimo: iniciante
      teaches:
        - competencia: comp:programacao/c-fundamentos
          nivel_resultante: intermediario

    # rev 2: `comp:so/linha-de-comando` entrou nos `requires`. É aqui que a casca
    # deixa de ser dispensável: a verificação da competência pede dividir o programa
    # em três arquivos-fonte e "compilar e ligar à mão", e daqui em diante a trilha
    # supõe compilação separada e `make`. O cap. 1 ainda se faz com um `cc` só, e por
    # isso a etapa de tutorial segue com `requires: []` (ADR-0010). As etapas
    # seguintes herdam o pré-requisito por dependerem desta.
    - id: etapa:programacao/c-funcoes-e-estrutura-de-programa
      titulo: Funções e estrutura de programa — escopo, compilação separada e pré-processador
      rev: 2
      status: ativo
      descricao: >
        Como um programa em C se organiza: função, escopo, ligação, compilação separada
        e pré-processador — a partir de onde um arquivo só deixa de bastar.
      esforco_estimado_min: 540
      opcional: false
      requires:
        - competencia: comp:so/linha-de-comando
          nivel_minimo: intermediario
        - competencia: comp:programacao/c-fundamentos
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:programacao/c-funcoes-e-estrutura-de-programa
          nivel_resultante: intermediario

    # --- Memória ------------------------------------------------------------
    - id: etapa:programacao/c-apontadores-e-vetores
      titulo: Apontadores e vetores
      rev: 1
      status: ativo
      descricao: >
        Apontador e vetor como a mesma aritmética vista de dois lados: endereço,
        indireção, apontador para função e a relação com os argumentos de linha de
        comando.
      esforco_estimado_min: 900
      opcional: false
      requires:
        - competencia: comp:programacao/c-funcoes-e-estrutura-de-programa
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:programacao/c-apontadores
          nivel_resultante: intermediario

    - id: etapa:programacao/c-estruturas
      titulo: Estruturas — listas, árvores, tabelas de dispersão e uniões
      rev: 1
      status: ativo
      descricao: >
        Estrutura, união e estrutura autorreferente aplicadas às estruturas de dados
        clássicas: lista, árvore e tabela de dispersão, com a alocação feita à mão.
      esforco_estimado_min: 720
      opcional: false
      requires:
        - competencia: comp:programacao/c-apontadores
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:programacao/c-estruturas
          nivel_resultante: intermediario

    - id: etapa:programacao/c-entrada-e-saida
      titulo: Entrada e saída e a biblioteca padrão
      rev: 1
      status: ativo
      descricao: >
        Entrada e saída pela biblioteca padrão: fluxo, formatação, acesso a arquivo e
        tratamento de erro — com o apêndice da biblioteca usado como referência de
        trabalho.
      esforco_estimado_min: 540
      opcional: false
      requires:
        - competencia: comp:programacao/c-apontadores
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:programacao/c-entrada-saida-e-biblioteca
          nivel_resultante: intermediario

    # --- Sistema ------------------------------------------------------------
    # rev 2: passou a ensinar também `comp:programacao/programacao-de-sistemas`, a
    # competência da etapa avulsa de ADR-0018. Não é cortesia: sem isso, quem cursa
    # esta trilha inteira chegaria à trilha de emulador sem a competência e seria
    # mandado a uma etapa avulsa de 25 h que ele já ultrapassou. O que esta etapa
    # verifica — `fopen`/`getc` sobre `read`, um alocador com lista livre, num
    # programa de vários arquivos — é estritamente mais do que a avulsa cobra, e por
    # isso concede. Efeito no percurso: `teaches` que concede **mais** não retroage —
    # quem já concluiu esta etapa não ganha a competência nova
    # (docs/catalogo.md §4).
    - id: etapa:programacao/c-interface-com-o-unix
      titulo: A interface com o sistema UNIX — descritores, diretórios e um alocador
      rev: 2
      status: ativo
      descricao: >
        A camada abaixo da biblioteca padrão: descritor de arquivo, chamada de sistema,
        leitura de diretório e um alocador de memória escrito do zero.
      esforco_estimado_min: 720
      opcional: false
      requires:
        - competencia: comp:programacao/c-estruturas
          nivel_minimo: intermediario
        - competencia: comp:programacao/c-entrada-saida-e-biblioteca
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:programacao/c-interface-unix
          nivel_resultante: intermediario
        - competencia: comp:programacao/programacao-de-sistemas
          nivel_resultante: intermediario


    # --- Ofício (aprofundamento, fora do objetivo declarado) ----------------
    # Kernighan & Pike, *The Practice of Programming*, é a continuação natural do
    # K&R: a mesma dupla de autores tratando do que vem depois de a linguagem já
    # ser conhecida. Opcional porque o objetivo desta trilha é a linguagem e a
    # interface com o UNIX, não o ofício em volta — e etapa opcional não altera a
    # `rev` da trilha (docs/catalogo.md §4).
    - id: etapa:programacao/pratica-da-programacao
      titulo: A prática da programação — estilo, depuração, teste e desempenho
      rev: 1
      status: ativo
      descricao: >
        O ofício em volta da linguagem: estilo, escolha de algoritmo, interface,
        depuração, teste, desempenho e portabilidade — com a regra de medir antes de
        otimizar. Ramo opcional.
      esforco_estimado_min: 900
      opcional: true
      requires:
        - competencia: comp:programacao/c-estruturas
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:programacao/pratica-da-programacao
          nivel_resultante: intermediario

  # Definida em catalogo/etapas/avulsas.yaml, junto com outras duas que esta trilha
  # **não** referencia. A de script shell, porque escrever script não é pré-requisito
  # de compilar C, e referenciá-la aqui a incluiria na trilha sem razão
  # (docs/catalogo.md §1). A de programação de sistemas, porque esta trilha a
  # **ensina** — `etapa:programacao/c-interface-com-o-unix` concede a competência
  # (ADR-0018) —, e uma trilha não referencia a avulsa de uma competência que ela
  # própria entrega.
  etapas_referenciadas:
    - etapa:so/linha-de-comando
