versao_schema: 1
trilha:
  id: trilha:ia/claude-do-chat-ao-agente
  titulo: Do chat ao agente em produção com Claude
  rev: 1
  status: ativo
  objetivo_declarado:
    - competencia: comp:ia/ferramentas-e-mcp
      nivel: intermediario
    - competencia: comp:ia/desenvolvimento-assistido-por-ia
      nivel: intermediario
    - competencia: comp:ia/agentes-llm
      nivel: avancado

  # Esta trilha é de *aplicação*: trata de operar um modelo hospedado, estendê-lo com
  # ferramentas e transformá-lo em agente. Não reensina transformer nem RAG — para o
  # fundamento e a recuperação, ver trilha:ia/llm-transformer-rag, que compartilha as
  # competências comp:ia/uso-de-llm-por-api e comp:ia/engenharia-de-prompt.
  etapas:
    # --- Entrada ------------------------------------------------------------
    - id: etapa:ia/claude-modelos-e-chat
      titulo: Modelos, janela de contexto e a conversa como ferramenta de trabalho
      rev: 1
      status: ativo
      descricao: >
        Entrada da trilha: que modelos existem, o que a janela de contexto limita, e a
        conversa usada como ferramenta de trabalho em vez de curiosidade.
      esforco_estimado_min: 300
      opcional: false
      requires: []
      teaches:
        - competencia: comp:ia/uso-de-llm-por-api
          nivel_resultante: iniciante

    - id: etapa:ia/claude-prompt-e-saida-estruturada
      titulo: Prompt, contexto e saída estruturada
      rev: 1
      status: ativo
      descricao: >
        Prompt como interface: instrução, exemplo e contexto; e a saída estruturada que
        deixa o programa consumir a resposta sem adivinhar formato.
      esforco_estimado_min: 420
      opcional: false
      requires:
        - competencia: comp:ia/uso-de-llm-por-api
          nivel_minimo: iniciante
      teaches:
        - competencia: comp:ia/engenharia-de-prompt
          nivel_resultante: iniciante
        - competencia: comp:ia/uso-de-llm-por-api
          nivel_resultante: intermediario

    # --- Integração ---------------------------------------------------------
    - id: etapa:ia/claude-api-e-sdk
      titulo: A API por dentro — mensagens, streaming, cache e custo
      rev: 1
      status: ativo
      descricao: >
        A API vista de dentro: formato de mensagens, streaming, cache de prompt e
        contagem de tokens, com o custo como consequência direta de cada escolha.
      esforco_estimado_min: 600
      opcional: false
      requires:
        - competencia: comp:ia/uso-de-llm-por-api
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:ia/uso-de-llm-por-api
          nivel_resultante: avancado

    # Ramo: onde o modelo é hospedado. Não é exigido por nenhum dos três objetivos
    # declarados da trilha — quem leva o agente ao fim pela API da Anthropic não passa
    # por aqui —, então `opcional: true` e a `rev` da trilha fica em 1
    # (docs/catalogo.md §4). Decidido em
    # docs/adr/0013-hospedagem-do-modelo-como-ramo-da-trilha-de-claude.md.
    - id: etapa:ia/claude-em-plataforma-de-nuvem
      titulo: Onde o modelo roda — Bedrock, Google Cloud e Claude Platform on AWS
      rev: 1
      status: ativo
      descricao: >
        Onde o modelo roda além da API própria: Bedrock, Google Cloud e a plataforma na
        AWS — autenticação, id de modelo, região, cota e retenção de dado. Ramo opcional
        da trilha (ADR-0013).
      esforco_estimado_min: 300
      opcional: true
      requires:
        - competencia: comp:ia/uso-de-llm-por-api
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:ia/hospedagem-de-modelo-em-nuvem
          nivel_resultante: intermediario

    - id: etapa:ia/tool-use-e-mcp
      titulo: Tool use e MCP — dar mãos ao modelo
      rev: 1
      status: ativo
      descricao: >
        Dar mãos ao modelo: definição de ferramenta, o laço de chamada e resultado, e o
        MCP como protocolo para conectar dados e sistemas sem acoplar ao cliente.
      esforco_estimado_min: 900
      opcional: false
      requires:
        - competencia: comp:ia/uso-de-llm-por-api
          nivel_minimo: intermediario
        - competencia: comp:ia/engenharia-de-prompt
          nivel_minimo: iniciante
      teaches:
        - competencia: comp:ia/ferramentas-e-mcp
          nivel_resultante: intermediario

    # --- Trabalho assistido (paralelo à construção de agentes) --------------
    - id: etapa:ia/claude-code-e-skills
      titulo: Claude Code e Skills — o agente dentro do repositório
      rev: 1
      status: ativo
      descricao: >
        O agente operando dentro de um repositório: configuração, skills, subagentes e
        hooks — e a especificação escrita antes de gerar código, não depois.
      esforco_estimado_min: 720
      opcional: false
      requires:
        - competencia: comp:ia/ferramentas-e-mcp
          nivel_minimo: iniciante
        - competencia: comp:ia/engenharia-de-prompt
          nivel_minimo: iniciante
      teaches:
        - competencia: comp:ia/desenvolvimento-assistido-por-ia
          nivel_resultante: intermediario

    # --- Agentes ------------------------------------------------------------
    - id: etapa:ia/agentes-com-claude
      titulo: Construir um agente — laço, memória, subagentes e parada
      rev: 1
      status: ativo
      descricao: >
        O laço do agente construído peça por peça: decisão de ferramenta, memória entre
        passos, subagentes e — o mais fácil de errar — o critério de parada.
      esforco_estimado_min: 1200
      opcional: false
      requires:
        - competencia: comp:ia/ferramentas-e-mcp
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:ia/agentes-llm
          nivel_resultante: intermediario

    - id: etapa:ia/agente-em-producao
      titulo: Agente em produção — salvaguardas, avaliação, custo e latência
      rev: 1
      status: ativo
      descricao: >
        O que separa um protótipo de um serviço: salvaguarda e limite de ação, avaliação
        automática do comportamento, observabilidade, e o custo e a latência da
        inferência tratados como requisito.
      esforco_estimado_min: 900
      opcional: false
      requires:
        - competencia: comp:ia/agentes-llm
          nivel_minimo: intermediario
        - competencia: comp:ia/uso-de-llm-por-api
          nivel_minimo: avancado
      teaches:
        - competencia: comp:ia/agentes-llm
          nivel_resultante: avancado
        - competencia: comp:ia/operacao-de-aplicacoes-llm
          nivel_resultante: iniciante

    - id: etapa:ia/projeto-agente-claude
      titulo: Projeto — agente próprio em serviço
      rev: 1
      status: ativo
      descricao: >
        Um agente próprio servido de ponta a ponta com o Agent SDK: ferramentas, estado,
        limites — e o que falta para outra pessoa conseguir usá-lo.
      esforco_estimado_min: 1800
      opcional: false
      requires:
        - competencia: comp:ia/agentes-llm
          nivel_minimo: avancado
        - competencia: comp:ia/desenvolvimento-assistido-por-ia
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:ia/operacao-de-aplicacoes-llm
          nivel_resultante: intermediario

  # Aprofundamentos definidos na outra trilha. Não são redefinidos aqui (catalogo.md §1).
  etapas_referenciadas:
    - etapa:ia/panorama-llm-transformer-rag
    - etapa:ia/engenharia-de-prompt
