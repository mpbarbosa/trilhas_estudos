versao_schema: 1
trilha:
  id: trilha:so/projeto-e-implementacao
  titulo: Sistemas operacionais, do conceito ao núcleo
  # rev 2: passou a referenciar `etapa:so/linha-de-comando`, obrigatória, que esta
  # trilha pressupunha sem declarar — incluir etapa obrigatória é substantivo
  # (docs/catalogo.md §4). `etapa:so/script-shell` veio junto, opcional, e essa parte
  # seria cosmética.
  # rev 3: a mesma coisa de novo, com o outro pré-requisito que a trilha pressupunha
  # sem declarar — `etapa:programacao/programacao-de-sistemas`, obrigatória
  # (ADR-0018).
  rev: 3
  status: ativo
  objetivo_declarado:
    - competencia: comp:so/processos-e-concorrencia
      nivel: intermediario
    - competencia: comp:so/gerenciamento-de-memoria
      nivel: intermediario
    - competencia: comp:so/sistemas-de-arquivos
      nivel: intermediario
    - competencia: comp:so/nucleo-na-pratica
      nivel: intermediario

  # Segue a espinha de Tanenbaum & Woodhull, *Sistemas Operacionais: Projeto e
  # Implementação*: cada capítulo é conceito e, em seguida, a implementação no
  # MINIX. Depois de processos, memória e E/S são independentes e podem ser
  # cursadas em paralelo — é o grafo, não uma lista (ADR-0002).
  etapas:
    # --- Fundamento ---------------------------------------------------------
    - id: etapa:so/visao-geral-e-chamadas-de-sistema
      titulo: Visão geral — o que é um SO, chamadas de sistema e estrutura do núcleo
      rev: 1
      status: ativo
      descricao: >
        Abre a trilha: o que um sistema operacional é, a chamada de sistema como
        fronteira, e as formas de estruturar o núcleo — monolítico, em camadas,
        micronúcleo.
      esforco_estimado_min: 480
      opcional: false
      requires: []
      teaches:
        - competencia: comp:so/estrutura-e-chamadas-de-sistema
          nivel_resultante: intermediario

    - id: etapa:so/processos-e-concorrencia
      titulo: Processos, threads e comunicação entre processos
      rev: 1
      status: ativo
      descricao: >
        Processo, thread e comunicação entre processos; e a concorrência que vem com
        eles: trava, variável de condição e semáforo, cada um com a corrida que resolve.
      esforco_estimado_min: 900
      opcional: false
      requires:
        - competencia: comp:so/estrutura-e-chamadas-de-sistema
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:so/processos-e-concorrencia
          nivel_resultante: intermediario

    - id: etapa:so/escalonamento-de-processos
      titulo: Escalonamento — políticas e o escalonador do MINIX
      rev: 1
      status: ativo
      descricao: >
        Quem roda agora, e por quanto tempo: política de escalonamento, fila multinível
        e sorteio, com o escalonador do MINIX como caso concreto e simuladores para ver
        cada política decidir.
      esforco_estimado_min: 420
      opcional: false
      requires:
        - competencia: comp:so/processos-e-concorrencia
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:so/escalonamento
          nivel_resultante: intermediario

    # --- Recursos -----------------------------------------------------------
    - id: etapa:so/entrada-saida-e-impasses
      titulo: Entrada/saída, drivers e impasses
      rev: 1
      status: ativo
      descricao: >
        Como o núcleo fala com o hardware: camadas de entrada/saída, driver e
        interrupção — e os impasses que a disputa por dispositivo provoca, com detecção,
        prevenção e evitação.
      esforco_estimado_min: 900
      opcional: false
      requires:
        - competencia: comp:so/processos-e-concorrencia
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:so/entrada-saida-e-impasses
          nivel_resultante: intermediario

    - id: etapa:so/gerenciamento-de-memoria
      titulo: Gerenciamento de memória — paginação, substituição e segmentação
      rev: 1
      status: ativo
      descricao: >
        Espaço de endereçamento, paginação, TLB, política de substituição e segmentação
        — o que o núcleo faz para que todo processo pense ter a máquina inteira.
      esforco_estimado_min: 900
      opcional: false
      requires:
        - competencia: comp:so/processos-e-concorrencia
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:so/gerenciamento-de-memoria
          nivel_resultante: intermediario

    - id: etapa:so/sistemas-de-arquivos
      titulo: Sistemas de arquivos — i-nodes, cache, consistência e proteção
      rev: 1
      status: ativo
      descricao: >
        Como o arquivo existe no disco: i-node, diretório, cache de bloco, consistência
        depois de uma falha e proteção, com FFS e journaling do lado da implementação
        atual.
      esforco_estimado_min: 900
      opcional: false
      requires:
        - competencia: comp:so/entrada-saida-e-impasses
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:so/sistemas-de-arquivos
          nivel_resultante: intermediario

    # --- Prática ------------------------------------------------------------
    # rev 2: `comp:so/linha-de-comando` entrou nos `requires`. O projeto manda
    # compilar o MINIX em máquina virtual (`rec:so/minix3-projeto`) — sem a casca
    # não se chega ao `make`. Antes disso nenhum `requires` barrava quem não
    # dominasse shell: a pessoa simplesmente travava aqui (ADR-0010). Efeito no
    # percurso: etapa `nao_iniciada` volta a travar, que é o comportamento correto
    # da tabela de docs/catalogo.md §4.
    #
    # rev 3: `comp:programacao/programacao-de-sistemas`, pelo mesmo raciocínio e com
    # o mesmo efeito. Chegar ao `make` era metade do que faltava; a outra metade é
    # que a verificação de `comp:so/nucleo-na-pratica` manda **introduzir** uma
    # chamada de sistema nova ou mexer no escalonador e "demonstrar o efeito por um
    # programa de usuário" — ler e modificar código em módulos, estrutura em memória,
    # e um programa que exercita a chamada por um descritor. É o recorte da avulsa,
    # inteiro (ADR-0018).
    #
    # O que **continua** por declarar: que esse código é em C, especificamente. A
    # avulsa é independente de linguagem, e exigir C aqui traria a cascata de sete
    # etapas que ADR-0017 recusou. O piso declarado é verdadeiro e é menor que o
    # pré-requisito real; fica dito, não escondido.
    - id: etapa:so/projeto-modificar-o-minix
      titulo: Projeto — compilar e modificar o MINIX
      rev: 3
      status: ativo
      descricao: >
        O MINIX 3 compilado em máquina virtual, com uma chamada de sistema acrescentada
        e o escalonador alterado — onde o núcleo deixa de ser leitura.
      esforco_estimado_min: 1500
      opcional: false
      requires:
        - competencia: comp:programacao/programacao-de-sistemas
          nivel_minimo: intermediario
        - competencia: comp:so/linha-de-comando
          nivel_minimo: intermediario
        - competencia: comp:so/escalonamento
          nivel_minimo: intermediario
        - competencia: comp:so/gerenciamento-de-memoria
          nivel_minimo: intermediario
        - competencia: comp:so/sistemas-de-arquivos
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:so/nucleo-na-pratica
          nivel_resultante: intermediario

  # Definidas em catalogo/etapas/avulsas.yaml, porque outras trilhas também as
  # pressupõem e uma etapa é definida em um arquivo só (docs/catalogo.md §1): as duas
  # de shell com trilha:programacao/linguagem-c-ansi, a de programação de sistemas com
  # trilha:terminal/emulador. Referenciar é o que as torna alcançáveis: sem isso o
  # motor não as geraria como `proxima_etapa` (só as etapas da trilha matriculada
  # entram), e o estudante ficaria travado no projeto sem nada que o destravasse.
  etapas_referenciadas:
    - etapa:so/linha-de-comando
    - etapa:so/script-shell
    - etapa:programacao/programacao-de-sistemas
