versao_schema: 1
trilha:
  id: trilha:terminal/emulador
  titulo: Emulador de terminal, do protocolo à tela
  # rev 2: passou a referenciar `etapa:programacao/programacao-de-sistemas`,
  # obrigatória — incluir etapa obrigatória é substantivo (docs/catalogo.md §4).
  rev: 2
  status: ativo
  objetivo_declarado:
    - competencia: comp:terminal/analisador-de-sequencias
      nivel: intermediario
    - competencia: comp:terminal/modelo-de-tela
      nivel: intermediario
    - competencia: comp:terminal/pty-e-controle-de-trabalho
      nivel: intermediario
    - competencia: comp:terminal/codificacao-de-entrada
      nivel: intermediario
    - competencia: comp:terminal/conformidade-de-emulador
      nivel: intermediario
    - competencia: comp:terminal/arquitetura-de-emulador
      nivel: intermediario

  # A espinha é a de um emulador real, nas bordas que ele tem: o que vem do programa
  # (sequências de controle), o que vai para o programa (teclado, mouse, método de
  # entrada e o pseudoterminal), o que mora no meio (a grade de células), o que sai na
  # tela (glifos) e o que sai dela para quem não a vê (a árvore de acessibilidade).
  # Nenhuma é pré-requisito das outras, e por isso a trilha é um grafo (ADR-0002):
  # depois da especificação e do analisador, a tela, o pseudoterminal, o Unicode, a
  # renderização e a acessibilidade abrem em frentes que se cursam em paralelo e só
  # voltam a juntar no projeto.
  #
  # **Linguagem de implementação: nenhuma, de propósito — mas programar, sim.** Os
  # recursos são em Rust (`vte`, `alacritty_terminal`, `portable-pty`, `cosmic-text`,
  # `wgpu`), em C (`libvterm`, páginas de manual) e em JavaScript (`xterm.js`,
  # `node-pty`), porque é assim que a literatura do assunto existe. Declarar uma
  # linguagem em `requires` arrastaria uma trilha inteira para dentro desta — a
  # validação 6 só conta as etapas da própria trilha
  # (src/trilhas/catalogo/validar.py, `_v6_objetivo_alcancavel`), então exigir
  # `comp:programacao/c-interface-unix` obrigaria a referenciar as sete etapas da
  # trilha de C para o objetivo continuar alcançável. Seria honesto e seria
  # arbitrário: nenhuma das três pilhas acima é a certa
  # (docs/adr/0017-trilha-de-emulador-sem-linguagem-declarada.md).
  #
  # O que ADR-0017 deixou em aberto, e ADR-0018 fechou, é que *não declarar
  # linguagem* havia virado *não declarar programação*: a trilha mandava escrever um
  # emulador sem exigir saber escrever programa nenhum. `comp:programacao/programacao-de-sistemas`
  # é o que as três pilhas cobram em comum — descritor, estrutura em memória e
  # programa em módulos — numa etapa avulsa com `requires: []`, e por isso cabe aqui
  # sem a cascata de sete.
  #
  # O que **é** pré-requisito declarado é a linha de comando, pelo mesmo motivo e na
  # mesma forma de ADR-0010: a etapa do pseudoterminal começa onde a competência de
  # casca termina — quem cria cada processo e para onde vai cada descritor.
  etapas:
    # --- O que é a coisa -----------------------------------------------------
    - id: etapa:terminal/o-que-e-um-terminal
      titulo: O que é um terminal — do teletipo ao emulador, e por que há um protocolo no meio
      rev: 1
      status: ativo
      descricao: >
        Entrada da trilha: do teletipo ao emulador, quem é terminal, shell e TTY, e por
        que existe um protocolo de bytes no meio.
      esforco_estimado_min: 180
      opcional: false
      requires: []
      teaches:
        - competencia: comp:terminal/protocolo-de-controle
          nivel_resultante: iniciante

    - id: etapa:terminal/arquiteturas-e-motores
      titulo: Arquiteturas e motores VT — reaproveitar um motor pronto ou escrever o próprio
      rev: 1
      status: ativo
      descricao: >
        A decisão de arquitetura antes do código: reaproveitar um motor VT pronto —
        alacritty_terminal, libvterm, xterm.js — ou escrever o próprio, e o que cada via
        cobra.
      esforco_estimado_min: 300
      opcional: false
      requires:
        - competencia: comp:terminal/protocolo-de-controle
          nivel_minimo: iniciante
      teaches:
        - competencia: comp:terminal/arquitetura-de-emulador
          nivel_resultante: iniciante

    # --- O que vem do programa ----------------------------------------------
    - id: etapa:terminal/especificacao-de-sequencias
      titulo: A especificação — ECMA-48, a linhagem DEC e as convenções do xterm
      rev: 1
      status: ativo
      descricao: >
        A norma e a prática: ECMA-35 e ECMA-48 por baixo, a linhagem DEC do VT100 ao
        VT510, as extensões do xterm que viraram especificação de fato, e as
        divergências do console do Linux e do Windows.
      esforco_estimado_min: 480
      opcional: false
      requires:
        - competencia: comp:terminal/protocolo-de-controle
          nivel_minimo: iniciante
      teaches:
        - competencia: comp:terminal/protocolo-de-controle
          nivel_resultante: intermediario

    # rev 2: `comp:programacao/programacao-de-sistemas` entrou nos `requires`. É aqui
    # que a trilha deixa de ser leitura: a verificação da competência pede
    # **implementar** a máquina de estados e hostilizá-la com três entradas, e uma
    # delas é a sequência cortada no meio — que é o caso que a competência de
    # programação de sistemas verifica em abstrato (ADR-0018).
    - id: etapa:terminal/analisador-de-estados
      titulo: O analisador — a máquina de estados DEC/ANSI, implementada e hostilizada
      rev: 2
      status: ativo
      descricao: >
        A máquina de estados de Williams implementada estado por estado e depois
        hostilizada: parâmetro fora de faixa, sequência truncada e entrada malformada,
        com uma implementação real ao lado.
      esforco_estimado_min: 600
      opcional: false
      requires:
        - competencia: comp:programacao/programacao-de-sistemas
          nivel_minimo: intermediario
        - competencia: comp:terminal/protocolo-de-controle
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:terminal/analisador-de-sequencias
          nivel_resultante: intermediario

    # --- O que mora no meio --------------------------------------------------
    - id: etapa:terminal/modelo-de-tela-e-rolagem
      titulo: A grade — células, atributos, histórico, tela alternativa e redimensionamento
      rev: 1
      status: ativo
      descricao: >
        A grade como estrutura de dados: célula e atributo, histórico, região de rolagem
        e tela alternativa — e o que o redimensionamento faz com a linha já escrita.
      esforco_estimado_min: 480
      opcional: false
      requires:
        - competencia: comp:terminal/analisador-de-sequencias
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:terminal/modelo-de-tela
          nivel_resultante: intermediario

    # --- O que vai para o programa ------------------------------------------
    # `comp:so/linha-de-comando` vem de etapa:so/linha-de-comando, referenciada no fim
    # deste arquivo (ADR-0010). É o único pré-requisito desta trilha que não nasce
    # dentro dela, e entra aqui porque é aqui que ele é cobrado: sinal, grupo de
    # processos e descritor do lado de dentro só se estudam depois de vistos do lado de
    # fora.
    # rev 2: também aqui, e não só no analisador. As duas são as **duas** entradas de
    # código da trilha e nenhuma depende da outra — abrir um pseudoterminal e rodar um
    # shell nele não passa pelo analisador, então declarar o pré-requisito só lá
    # deixaria este caminho aberto a quem não programa. As demais etapas de código
    # (grade, Unicode, renderização, conformidade, acessibilidade e o projeto) herdam o
    # pré-requisito por dependerem de uma destas duas, e por isso **não** o repetem.
    - id: etapa:terminal/pseudoterminal-e-sinais
      titulo: O pseudoterminal — par mestre/escravo, disciplina de linha, sinais e SIGWINCH
      rev: 2
      status: ativo
      descricao: >
        O par mestre/escravo aberto de forma portável, a disciplina de linha entre modo
        canônico e cru, o grupo de processos em primeiro plano, os sinais e o SIGWINCH
        do redimensionamento.
      esforco_estimado_min: 420
      opcional: false
      requires:
        - competencia: comp:programacao/programacao-de-sistemas
          nivel_minimo: intermediario
        - competencia: comp:so/linha-de-comando
          nivel_minimo: intermediario
        - competencia: comp:terminal/protocolo-de-controle
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:terminal/pty-e-controle-de-trabalho
          nivel_resultante: intermediario

    - id: etapa:terminal/entrada-de-teclado-e-mouse
      titulo: Teclado, mouse e método de entrada — codificação legada, `modifyOtherKeys`, CSI-u, protocolo do kitty e composição
      rev: 1
      status: ativo
      descricao: >
        Do evento de tecla ao byte que o shell recebe: codificação legada,
        modifyOtherKeys, CSI-u e o protocolo do kitty; relato de mouse do X10 ao SGR; e
        o método de entrada, com pré-edição e tecla morta.
      esforco_estimado_min: 480
      opcional: false
      requires:
        - competencia: comp:terminal/modelo-de-tela
          nivel_minimo: intermediario
        - competencia: comp:terminal/pty-e-controle-de-trabalho
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:terminal/codificacao-de-entrada
          nivel_resultante: intermediario

    # --- O que sai na tela ---------------------------------------------------
    - id: etapa:terminal/texto-unicode-em-grade
      titulo: Unicode numa grade de largura fixa — largura, grafema, emoji e substituição de fonte
      rev: 1
      status: ativo
      descricao: >
        O choque entre Unicode e a grade de largura fixa: largura leste-asiática,
        agrupamento de grafemas, emoji e substituição de fonte, com a especificação para
        a qual os emuladores estão convergindo.
      esforco_estimado_min: 480
      opcional: false
      requires:
        - competencia: comp:terminal/modelo-de-tela
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:terminal/texto-em-celulas
          nivel_resultante: intermediario

    - id: etapa:terminal/renderizacao-e-latencia
      titulo: Renderização — atlas de glifos, desenho em lote, dano e a tecla até o pixel
      rev: 1
      status: ativo
      descricao: >
        Da fonte ao pixel: rasterização de glifo, atlas em textura, desenho em lote e
        rastreio de dano — com a latência de tecla a pixel medida por instrumento, não
        estimada.
      esforco_estimado_min: 600
      opcional: false
      requires:
        - competencia: comp:terminal/texto-em-celulas
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:terminal/renderizacao-de-terminal
          nivel_resultante: intermediario

    # --- O terminal como parte do ambiente ----------------------------------
    - id: etapa:terminal/integracao-com-o-shell
      titulo: Integração — OSC 7, 8, 52 e 133, `TERM`, terminfo e o terminal padrão do sistema
      rev: 1
      status: ativo
      descricao: >
        O que o emulador combina com o shell e com o sistema: OSC 7, 8, 52 e 133, o TERM
        e as capacidades que ele precisa declarar no terminfo, e a disputa por ser o
        terminal padrão do ambiente.
      esforco_estimado_min: 300
      opcional: false
      requires:
        - competencia: comp:terminal/modelo-de-tela
          nivel_minimo: intermediario
        - competencia: comp:terminal/pty-e-controle-de-trabalho
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:terminal/integracao-com-o-shell
          nivel_resultante: intermediario

    # --- O terminal lido por quem não o vê -----------------------------------
    # Obrigatória, e exigida pelo projeto final. Um emulador que desenha a própria
    # janela não tem árvore de acessibilidade até construí-la — ao contrário de um
    # embutido em webview, que a recebe pronta. É uma borda do mesmo nível das outras
    # quatro, e deixá-la opcional diria o contrário.
    - id: etapa:terminal/acessibilidade-e-arvore
      titulo: Acessibilidade — a árvore que o leitor de tela lê, construída à mão
      rev: 1
      status: ativo
      descricao: >
        O emulador tem de publicar à mão a árvore que o leitor de tela lê: nós, papéis e
        propriedades pelo AccessKit, o adaptador entre janela e árvore, o AT-SPI do
        outro lado — e a verificação feita no Orca.
      esforco_estimado_min: 360
      opcional: false
      requires:
        - competencia: comp:terminal/modelo-de-tela
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:terminal/acessibilidade-de-terminal
          nivel_resultante: intermediario

    # --- Prova ---------------------------------------------------------------
    - id: etapa:terminal/conformidade-por-suite
      titulo: Conformidade — `vttest`, `esctest` e o que fazer quando o teste e a especificação discordam
      rev: 1
      status: ativo
      descricao: >
        Demonstrar conformidade por teste: o vttest menu a menu e o esctest em
        integração contínua — e o que fazer quando a suíte e a especificação discordam.
      esforco_estimado_min: 360
      opcional: false
      requires:
        - competencia: comp:terminal/analisador-de-sequencias
          nivel_minimo: intermediario
        - competencia: comp:terminal/modelo-de-tela
          nivel_minimo: intermediario
        - competencia: comp:terminal/codificacao-de-entrada
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:terminal/conformidade-de-emulador
          nivel_resultante: intermediario

    - id: etapa:terminal/projeto-emulador-minimo
      titulo: Projeto — um emulador mínimo que roda um shell, passa um subconjunto do `esctest`, mostra sua latência e é lido por um leitor de tela
      rev: 1
      status: ativo
      descricao: >
        O emulador mínimo de ponta a ponta: pseudoterminal, analisador, grade e tela até
        rodar um shell, passar um subconjunto do esctest, mostrar a própria latência e
        ser lido por um leitor de tela.
      esforco_estimado_min: 1800
      opcional: false
      requires:
        - competencia: comp:terminal/acessibilidade-de-terminal
          nivel_minimo: intermediario
        - competencia: comp:terminal/arquitetura-de-emulador
          nivel_minimo: iniciante
        - competencia: comp:terminal/renderizacao-de-terminal
          nivel_minimo: intermediario
        - competencia: comp:terminal/integracao-com-o-shell
          nivel_minimo: intermediario
        - competencia: comp:terminal/conformidade-de-emulador
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:terminal/arquitetura-de-emulador
          nivel_resultante: intermediario

    # --- Aprofundamento (fora do objetivo declarado) ------------------------
    # "Prior art to read" é leitura de código de emulador pronto, e só rende depois de
    # ter escrito um: antes disso, o código responde perguntas que o estudante ainda não
    # fez. Opcional porque o objetivo da trilha é o emulador do estudante, não o dos
    # outros — e etapa opcional não altera a `rev` da trilha (docs/catalogo.md §4).
    - id: etapa:terminal/leitura-de-emuladores-reais
      titulo: Leitura de emuladores reais — Alacritty, kitty, foot, WezTerm e Rio, lado a lado
      rev: 1
      status: ativo
      descricao: >
        Cinco emuladores lidos lado a lado — Alacritty, kitty, foot, WezTerm e Rio —
        para ver as mesmas decisões tomadas de formas diferentes. Ramo opcional da
        trilha.
      esforco_estimado_min: 900
      opcional: true
      requires:
        - competencia: comp:terminal/arquitetura-de-emulador
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:terminal/arquitetura-de-emulador
          nivel_resultante: avancado

  # Definidas em catalogo/etapas/avulsas.yaml. A de linha de comando já era
  # referenciada pelas trilhas de C e de SO (ADR-0010); a de programação de sistemas é
  # compartilhada com a de SO (ADR-0018). A terceira avulsa, de script shell, **não**
  # entra: escrever script não é pré-requisito de escrever emulador, e referenciá-la
  # aqui a incluiria na trilha sem razão.
  etapas_referenciadas:
    - etapa:so/linha-de-comando
    - etapa:programacao/programacao-de-sistemas
