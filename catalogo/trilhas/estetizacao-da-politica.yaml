versao_schema: 1
trilha:
  id: trilha:cinema/estetizacao-da-politica
  titulo: Estetização da política — da reprodutibilidade técnica ao comício filmado
  rev: 1
  status: ativo
  objetivo_declarado:
    - competencia: comp:cinema/reprodutibilidade-e-aura
      nivel: intermediario
    - competencia: comp:cinema/estetizacao-da-politica
      nivel: avancado
    - competencia: comp:cinema/critica-do-espetaculo-de-massa
      nivel: intermediario
    - competencia: comp:cinema/filme-de-encomenda-politica
      nivel: intermediario
    - competencia: comp:cinema/leitura-de-memoria-de-implicado
      nivel: intermediario

  # Segunda trilha da área de cinema. Nasce de uma bibliografia de cinco itens trazida
  # pelo estudante (2026-11-05) — Benjamin, Kracauer, Sontag, Speer e *O triunfo da
  # vontade* —, e o recorte é o da lista: a estetização da política, de Benjamin ao
  # comício de Nuremberg filmado. Não é uma trilha de história do nazismo, nem de
  # história do documentário.
  #
  # Por que na área `cinema` e não numa área nova: quatro dos cinco itens são cinema
  # ou crítica de cinema — Benjamin e Kracauer são bibliografia corrente de teoria do
  # filme (a edição brasileira de Kracauer saiu na coleção *Cinema, Teatro e
  # Modernidade*), Sontag escreve sobre um filme e o quinto item é o filme. Falta a
  # memória de Speer, que é crítica de fonte; `area` é organizacional e não semântica
  # (docs/catalogo.md §3), e o acoplamento real está em `requires`/`teaches`.
  #
  # A trilha não reabre o vocabulário: ela **referencia**
  # etapa:cinema/o-que-e-cinema, de trilha:cinema/primeiro-cinema-e-vida-moderna, que
  # é onde plano, decupagem, montagem e ponto de vista se aprendem, e de onde vem
  # também a desconfiança da tela como janela. É o caminho que a nota daquela trilha
  # previa para o próximo título da área: etapa nova ou trilha própria que referencie
  # as etapas de lá, sem reescrever competência.
  #
  # **O aparato crítico vem antes do objeto, de propósito.** Benjamin e Kracauer são
  # pré-requisito do filme, não leitura complementar: assistir ao comício de Nuremberg
  # sem a tese da estetização e sem a leitura da massa como forma é assistir ao
  # espetáculo nos termos em que ele foi montado. Por isso o grafo tem dois ramos
  # paralelos que só convergem na etapa do filme, e por isso Sontag vem **depois** —
  # o ensaio dela discute a recepção do filme e a reabilitação de Riefenstahl como
  # formalista pura, e lido antes entregaria mastigada a conclusão que a etapa do
  # filme cobra.
  etapas:
    # --- O conceito ----------------------------------------------------------
    - id: etapa:cinema/reprodutibilidade-tecnica
      titulo: A obra de arte na era de sua reprodutibilidade técnica
      rev: 1
      status: ativo
      descricao: >
        O ensaio de Benjamin, lido inteiro e não só pelo epílogo: o que a reprodução
        técnica faz com o aqui-e-agora da obra, a troca do valor de culto pelo valor de
        exposição, o ator diante do aparelho em vez do público, o público que examina
        sem se concentrar. O corte é ler a tese como argumento datado sobre técnica —
        e chegar ao epílogo, onde a estetização da política aparece como consequência
        dele, com a tese já na mão em vez de como palavra de ordem.
      esforco_estimado_min: 300
      opcional: false
      requires:
        - competencia: comp:cinema/leitura-do-filme
          nivel_minimo: iniciante
      teaches:
        - competencia: comp:cinema/reprodutibilidade-e-aura
          nivel_resultante: intermediario
        - competencia: comp:cinema/estetizacao-da-politica
          nivel_resultante: iniciante

    # --- A massa como forma --------------------------------------------------
    - id: etapa:cinema/ornamento-da-massa
      titulo: O ornamento da massa — a multidão como material de forma
      rev: 1
      status: ativo
      descricao: >
        Os ensaios de Kracauer para o *Frankfurter Zeitung*, com o do título no centro:
        as pernas alinhadas da revista de music-hall lidas como a esteira da fábrica, a
        massa que comparece não como povo nem como classe, mas como material de uma
        figura geométrica que o próprio público admira. Estuda-se a Alemanha de Weimar
        dos anos 1920 — antes do regime, e é isso que importa: o ornamento de massa já
        estava montado quando o comício o herdou.
      esforco_estimado_min: 420
      opcional: false
      requires:
        - competencia: comp:cinema/cinema-como-industria-e-ideologia
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:cinema/critica-do-espetaculo-de-massa
          nivel_resultante: intermediario

    # --- O objeto ------------------------------------------------------------
    - id: etapa:cinema/triunfo-da-vontade
      titulo: O triunfo da vontade — o comício como filme
      rev: 1
      status: ativo
      descricao: >
        O filme de Riefenstahl sobre o congresso do partido nazista em Nuremberg, 1934,
        visto como objeto e não como ilustração: o que ali é registro e o que foi
        encenado para a câmera, como a massa é enquadrada para compor figura, o lugar
        reservado ao chefe no quadro, a ausência de contraplano, o que a montagem e a
        música produzem onde não há discurso. O corte é a terceira saída, nem descarte
        como mera propaganda nem elogio da forma separado da função — e a conclusão
        pedida é a de quem olhou, com Benjamin e Kracauer já lidos.
      esforco_estimado_min: 300
      opcional: false
      requires:
        - competencia: comp:cinema/leitura-do-filme
          nivel_minimo: iniciante
        - competencia: comp:cinema/estetizacao-da-politica
          nivel_minimo: iniciante
        - competencia: comp:cinema/critica-do-espetaculo-de-massa
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:cinema/filme-de-encomenda-politica
          nivel_resultante: intermediario
        - competencia: comp:cinema/estetizacao-da-politica
          nivel_resultante: intermediario

    # --- A crítica, depois do filme ------------------------------------------
    - id: etapa:cinema/fascinante-fascismo
      titulo: Fascinante fascismo — a sobrevida de uma estética
      rev: 1
      status: ativo
      descricao: >
        O ensaio de Susan Sontag de 1975, que é de uma vez leitura do filme e recusa da
        defesa que o absolvia: Riefenstahl reabilitada como formalista pura, o
        documentário tratado como registro de um evento que só existiu para ser
        filmado, e a estética fascista sobrevivendo ao regime em lugares que não se
        apresentam como políticos. A etapa cobra confrontar a própria leitura da etapa
        anterior com a dela, e dizer onde discorda — não resumi-la.
      esforco_estimado_min: 180
      opcional: false
      requires:
        - competencia: comp:cinema/filme-de-encomenda-politica
          nivel_minimo: intermediario
        - competencia: comp:cinema/estetizacao-da-politica
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:cinema/estetizacao-da-politica
          nivel_resultante: avancado

    # --- Visto de dentro do aparato ------------------------------------------
    - id: etapa:cinema/testemunho-do-arquiteto
      titulo: Por dentro do Terceiro Reich — o espetáculo visto por quem o construiu
      rev: 1
      status: ativo
      descricao: >
        A memória de Albert Speer, arquiteto do regime e depois seu ministro de
        armamentos, lida como fonte e como peça de defesa no mesmo volume: a arquitetura
        de Nuremberg e a catedral de luz descritas por quem as projetou, o espetáculo
        contado do lado de dentro — e, no mesmo texto, o técnico que apenas executava, a
        responsabilidade deslocada para um ausente, a ignorância alegada. O corte não é
        o livro de cabo a rabo: são os capítulos do espetáculo e da arquitetura, mais as
        operações com que o autor se separa do que descreve.
      esforco_estimado_min: 900
      opcional: false
      requires:
        - competencia: comp:cinema/estetizacao-da-politica
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:cinema/leitura-de-memoria-de-implicado
          nivel_resultante: intermediario

    # --- Opcional: o esteticismo antes do regime -----------------------------
    # Acrescentada em 2026-11-10, do item que sobrou da bibliografia de monografia que o
    # estudante colou naquele dia: as outras vinte e cinco referências sem casa foram para
    # trilha:cinema/analise-filmica-de-uma-saga e trilha:politica/desinformacao-e-resistencia,
    # e o D'Annunzio é desta trilha, porque é aqui que o esteticismo se discute.
    #
    # **É opcional de propósito, e isso tem efeito de catálogo**: incluir etapa opcional
    # não é mudança substantiva (docs/catalogo.md §4), então a `rev` da trilha não sobe e
    # nenhum percurso já concluído reabre. Opcional também pelo recorte — a trilha fecha
    # sem ela, e a competência que ela desenvolve não entra no `objetivo_declarado`
    # (acrescentar objetivo **seria** substantivo).
    #
    # Vem depois do filme, não antes, pelo mesmo motivo que a Sontag: lido antes, o
    # romance entregaria mastigada a genealogia que as etapas anteriores constroem a
    # partir do material. E a etapa cobra explicitamente a recusa da leitura retrospectiva
    # — o esteta de 1889 não é o anúncio necessário do regime de 1934, e D'Annunzio ter
    # terminado em Fiume não é argumento sobre o livro.
    - id: etapa:cinema/o-esteta-e-o-culto-da-beleza
      titulo: O prazer — o esteticismo como programa, antes de ser traço de regime
      rev: 1
      status: ativo
      descricao: >
        O romance de D'Annunzio de 1889, lido como documento de um programa: a existência
        conduzida como composição, o gosto promovido a critério último, a indiferença
        moral apresentada como refinamento e não como falha — e o que isso reserva às
        outras pessoas do livro, que a narrativa mostra sem comentar. O corte é descrever
        o programa pelas passagens em que ele se professa, dizer onde o próprio texto lhe
        cobra o preço, e separar o parentesco com a política estetizada da leitura
        retrospectiva que faz de todo esteta um fascista em potencial.
      esforco_estimado_min: 900
      opcional: true
      requires:
        - competencia: comp:cinema/estetizacao-da-politica
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:cinema/esteticismo-como-programa
          nivel_resultante: intermediario

  # etapa:cinema/o-que-e-cinema é de trilha:cinema/primeiro-cinema-e-vida-moderna e
  # está aqui por referência, nunca redefinida (docs/catalogo.md §1): é ela que dá
  # comp:cinema/leitura-do-filme e comp:cinema/cinema-como-industria-e-ideologia, que
  # as duas etapas de abertura exigem, e é por ela que a trilha parte de perfil vazio.
  etapas_referenciadas:
    - etapa:cinema/o-que-e-cinema
