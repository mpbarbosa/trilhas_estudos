versao_schema: 1
trilha:
  id: trilha:dados/analise-de-dados-com-python
  titulo: Análise de dados com Python
  rev: 1
  status: ativo
  objetivo_declarado:
    - competencia: comp:dados/analise-exploratoria
      nivel: avancado
    - competencia: comp:dados/inferencia-estatistica
      nivel: intermediario
    - competencia: comp:dados/enquadramento-analitico
      nivel: intermediario

  # A entrada em Python não é redefinida aqui: etapa:programacao/python-para-ia já
  # existe e desenvolve comp:programacao/python-dados (catalogo.md §1). Quem já a
  # concluiu em trilha:ia/llm-transformer-rag entra direto em numpy-e-pandas.
  etapas:
    # --- Base de manipulação ------------------------------------------------
    - id: etapa:dados/numpy-e-pandas
      titulo: NumPy e pandas — a tabela como estrutura de trabalho
      rev: 1
      status: ativo
      descricao: >
        A tabela como estrutura de trabalho: array e dataframe, tipos, índice, valores
        ausentes, junção, agrupamento e reformatação entre formato largo e longo — com
        exercícios resolvidos ao lado da referência oficial.
      esforco_estimado_min: 1200
      opcional: false
      requires:
        - competencia: comp:programacao/python-dados
          nivel_minimo: iniciante
      teaches:
        - competencia: comp:dados/manipulacao-tabular
          nivel_resultante: intermediario
        - competencia: comp:programacao/python-dados
          nivel_resultante: intermediario

    # --- Caminho da exploração ----------------------------------------------
    - id: etapa:dados/analise-exploratoria
      titulo: Análise exploratória — interrogar um conjunto desconhecido
      rev: 1
      status: ativo
      descricao: >
        Interrogar um conjunto que você não escolheu até saber o que ele mede:
        distribuição, dispersão, correlação, valor atípico e dado faltante, com o
        gráfico ainda a serviço da própria exploração.
      esforco_estimado_min: 900
      opcional: false
      requires:
        - competencia: comp:dados/manipulacao-tabular
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:dados/analise-exploratoria
          nivel_resultante: intermediario
        - competencia: comp:dados/visualizacao-de-dados
          nivel_resultante: iniciante

    - id: etapa:dados/visualizacao-para-analise
      titulo: Visualização a serviço da pergunta
      rev: 1
      status: ativo
      descricao: >
        Escolher forma, escala e agregação a partir da pergunta, e ler criticamente o
        gráfico alheio: data-ink, chartjunk e fator de mentira. A prática de forma vem
        dos tutoriais de matplotlib e seaborn.
      esforco_estimado_min: 600
      opcional: false
      requires:
        - competencia: comp:dados/visualizacao-de-dados
          nivel_minimo: iniciante
      teaches:
        - competencia: comp:dados/visualizacao-de-dados
          nivel_resultante: intermediario

    # --- Caminho do fundamento (paralelo à exploração) ----------------------
    - id: etapa:dados/matematica-para-dados
      titulo: Álgebra linear e cálculo na medida do método
      rev: 1
      status: ativo
      descricao: >
        A álgebra linear e o cálculo que os métodos de dados realmente usam: vetor,
        matriz, projeção e decomposição; derivada, gradiente e otimização. Medida pelo
        método, não pelo currículo de matemática.
      esforco_estimado_min: 1800
      opcional: false
      requires:
        - competencia: comp:programacao/python-dados
          nivel_minimo: iniciante
      teaches:
        - competencia: comp:dados/matematica-para-dados
          nivel_resultante: intermediario

    - id: etapa:dados/estatistica-aplicada
      titulo: Da amostra à afirmação — inferência aplicada
      rev: 1
      status: ativo
      descricao: >
        Da amostra à afirmação: estimativa, intervalo, teste e tamanho de efeito, feitos
        por simulação em Python antes da fórmula fechada — e o que uma afirmação
        estatística não autoriza dizer.
      esforco_estimado_min: 1200
      opcional: false
      requires:
        - competencia: comp:dados/manipulacao-tabular
          nivel_minimo: intermediario
        - competencia: comp:dados/matematica-para-dados
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:dados/inferencia-estatistica
          nivel_resultante: intermediario

    # --- Enquadramento e fechamento -----------------------------------------
    - id: etapa:dados/enquadramento-de-problema
      titulo: Enquadrar o problema antes de analisar
      rev: 1
      status: ativo
      descricao: >
        Traduzir a pergunta de negócio em pergunta analítica: qual decisão depende dela,
        o que serviria de evidência, qual dado existe e quanto custa o erro. Antes do
        método, o enquadramento.
      esforco_estimado_min: 900
      opcional: false
      requires:
        - competencia: comp:dados/analise-exploratoria
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:dados/enquadramento-analitico
          nivel_resultante: intermediario

    - id: etapa:dados/modelagem-preditiva-inicial
      titulo: Primeiro modelo preditivo — linha de base, vazamento e métrica
      rev: 1
      status: ativo
      descricao: >
        O primeiro modelo preditivo feito com honestidade: linha de base trivial,
        separação de treino e teste, vazamento de dado e métrica coerente com a decisão
        que o modelo apoia. Ramo opcional da trilha.
      esforco_estimado_min: 1200
      opcional: true          # aprofundamento: o objetivo da trilha é análise, não predição
      requires:
        - competencia: comp:dados/inferencia-estatistica
          nivel_minimo: intermediario
        - competencia: comp:dados/enquadramento-analitico
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:dados/modelagem-preditiva
          nivel_resultante: iniciante

    - id: etapa:dados/projeto-analise-ponta-a-ponta
      titulo: Projeto — análise ponta a ponta sobre dado real e sujo
      rev: 1
      status: ativo
      descricao: >
        Uma análise inteira sobre microdado público brasileiro, do dado sujo à afirmação
        defensável: limpeza documentada, exploração, inferência e um gráfico que
        sustenta a conclusão.
      esforco_estimado_min: 1800
      opcional: false
      requires:
        - competencia: comp:dados/enquadramento-analitico
          nivel_minimo: intermediario
        - competencia: comp:dados/visualizacao-de-dados
          nivel_minimo: intermediario
        - competencia: comp:dados/inferencia-estatistica
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:dados/analise-exploratoria
          nivel_resultante: avancado

  etapas_referenciadas:
    - etapa:programacao/python-para-ia
