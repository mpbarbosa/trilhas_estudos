versao_schema: 1
trilha:
  id: trilha:dados/bancos-de-dados-relacionais
  titulo: Bancos de dados relacionais, do modelo à transação
  rev: 1
  status: ativo
  objetivo_declarado:
    - competencia: comp:dados/modelo-relacional
      nivel: avancado
    - competencia: comp:dados/sql-consultas
      nivel: intermediario
    - competencia: comp:dados/projeto-de-esquema
      nivel: intermediario
    - competencia: comp:dados/transacoes-e-concorrencia
      nivel: intermediario

  # Segue a espinha de C. J. Date, *An Introduction to Database Systems*, vol. I:
  # arquitetura antes de modelo, modelo antes de linguagem, linguagem antes de
  # proteção. O corte do livro é deliberado — ele trata SQL depois da álgebra, e não
  # antes, para que a linguagem seja lida como implementação (parcial) do modelo.
  #
  # Depois do modelo relacional, projeto de esquema e armazenamento são
  # independentes e podem ser cursados em paralelo — é o grafo, não uma lista
  # (ADR-0002).
  etapas:
    # --- Fundamento ---------------------------------------------------------
    - id: etapa:dados/arquitetura-de-sgbd
      titulo: O que um SGBD faz — os três níveis e a independência de dados
      rev: 1
      status: ativo
      descricao: >
        O que um SGBD faz antes de qualquer consulta: os três níveis da arquitetura
        ANSI/SPARC, a independência de dados que eles compram, e as peças internas —
        catálogo, otimizador, gerenciador de buffer e de transação.
      esforco_estimado_min: 480
      opcional: false
      requires: []
      teaches:
        - competencia: comp:dados/arquitetura-de-sgbd
          nivel_resultante: intermediario

    - id: etapa:dados/modelo-relacional
      titulo: O modelo relacional — domínios, relações, chaves e integridade
      rev: 1
      status: ativo
      descricao: >
        Domínio, relação, tupla e chave; integridade de entidade e referencial; e o
        tratamento do nulo. O artigo de Codd é lido ao lado do livro para separar o que
        o modelo garante do que ele deixa para o SGBD.
      esforco_estimado_min: 720
      opcional: false
      requires:
        - competencia: comp:dados/arquitetura-de-sgbd
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:dados/modelo-relacional
          nivel_resultante: intermediario

    # --- Linguagem ----------------------------------------------------------
    - id: etapa:dados/algebra-e-calculo-relacional
      titulo: Álgebra e cálculo relacional — duas formas de dizer a mesma consulta
      rev: 1
      status: ativo
      descricao: >
        As duas linguagens formais do modelo: seleção, projeção, junção e divisão na
        álgebra, e a mesma consulta escrita como predicado no cálculo. Fecha na
        equivalência entre as duas e no que significa ser relacionalmente completa.
      esforco_estimado_min: 720
      opcional: false
      requires:
        - competencia: comp:dados/modelo-relacional
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:dados/algebra-relacional
          nivel_resultante: intermediario

    - id: etapa:dados/sql-contra-o-modelo
      titulo: SQL lido contra o modelo — o que a linguagem cumpre e onde diverge
      rev: 1
      status: ativo
      descricao: >
        SQL lida contra a álgebra que ela deveria implementar: o que a linguagem cumpre,
        onde divergiu — duplicata, nulo de três valores, ordem de coluna — e o que disso
        é decisão de padrão. Com exercícios de junção, agregação e subconsulta.
      esforco_estimado_min: 900
      opcional: false
      requires:
        - competencia: comp:dados/algebra-relacional
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:dados/sql-consultas
          nivel_resultante: intermediario

    # --- Projeto de esquema (paralelo ao armazenamento) ---------------------
    - id: etapa:dados/dependencia-e-normalizacao
      titulo: Dependência funcional e normalização até a FNBC
      rev: 1
      status: ativo
      descricao: >
        Dependência funcional como fato do domínio, decomposição sem perda de informação
        e as formas normais até a FNBC. O critério é a anomalia que cada forma elimina,
        não a forma pela forma.
      esforco_estimado_min: 900
      opcional: false
      requires:
        - competencia: comp:dados/modelo-relacional
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:dados/projeto-de-esquema
          nivel_resultante: intermediario

    - id: etapa:dados/normalizacao-superior
      titulo: 4FN, 5FN e os limites da decomposição
      rev: 1
      status: ativo
      descricao: >
        Onde a dependência funcional não alcança: dependência multivalorada e de junção,
        4FN e 5FN — e por que a decomposição para antes de destruir a consulta.
        Aprofundamento opcional do projeto de esquema.
      esforco_estimado_min: 480
      opcional: true          # aprofundamento: o objetivo da trilha para em FNBC
      requires:
        - competencia: comp:dados/projeto-de-esquema
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:dados/projeto-de-esquema
          nivel_resultante: avancado

    # --- Armazenamento (paralelo ao projeto de esquema) ---------------------
    - id: etapa:dados/armazenamento-e-indices
      titulo: Armazenamento e acesso — páginas, árvore B e hashing
      rev: 1
      status: ativo
      descricao: >
        Como a relação chega ao disco: página, registro, árvore B, hashing e índice
        secundário — e o que cada estrutura cobra em leitura, escrita e espaço. O índice
        aparece também pelo plano de execução, não só pela definição.
      esforco_estimado_min: 600
      opcional: false
      requires:
        - competencia: comp:dados/arquitetura-de-sgbd
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:dados/armazenamento-e-indexacao
          nivel_resultante: intermediario

    # --- Proteção -----------------------------------------------------------
    - id: etapa:dados/transacao-recuperacao-concorrencia
      titulo: Transação, recuperação e concorrência — o que protege o dado
      rev: 1
      status: ativo
      descricao: >
        O que protege o dado quando algo falha ou quando dois clientes escrevem juntos:
        transação e ACID, recuperação por log, bloqueio e impasse — e os níveis de
        isolamento e o MVCC que os SGBDs atuais oferecem no lugar.
      esforco_estimado_min: 900
      opcional: false
      requires:
        - competencia: comp:dados/sql-consultas
          nivel_minimo: intermediario
        - competencia: comp:dados/armazenamento-e-indexacao
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:dados/transacoes-e-concorrencia
          nivel_resultante: intermediario

    # --- Prática ------------------------------------------------------------
    - id: etapa:dados/projeto-esquema-ponta-a-ponta
      titulo: Projeto — de requisito em texto a esquema normalizado sob concorrência
      rev: 1
      status: ativo
      descricao: >
        Um requisito em texto corrido virando esquema normalizado em SQLite, com
        consultas, índices escolhidos pelo plano e duas sessões concorrentes disputando
        as mesmas linhas. É onde modelo, linguagem e proteção aparecem juntos.
      esforco_estimado_min: 1500
      opcional: false
      requires:
        - competencia: comp:dados/projeto-de-esquema
          nivel_minimo: intermediario
        - competencia: comp:dados/sql-consultas
          nivel_minimo: intermediario
        - competencia: comp:dados/transacoes-e-concorrencia
          nivel_minimo: intermediario
      teaches:
        - competencia: comp:dados/modelo-relacional
          nivel_resultante: avancado

  etapas_referenciadas: []
