versao_schema: 1
competencias:
# -------------------------------------------------------------------------
# trilha:ihc/captologia
#
# Área nova em 2026-11-14: interação humano-computador. A captologia — o estudo do
# computador como tecnologia persuasiva — foi nomeada por B.J. Fogg como subcampo da
# IHC, e é por isso que a área se chama `ihc` e não `captologia`: o próximo livro de
# IHC que não seja de persuasão cabe aqui sem área nova.
#
# Mesmo critério das outras áreas de leitura: a `verificacao` se cobra **fora** do
# corpus da trilha — qualquer aplicativo, qualquer notificação, qualquer modelo de
# pontuação. Os cinco livros são só onde a trilha as exercita.
#
# As sete competências se dividem em três famílias, e a divisão é o que a trilha
# quer ensinar: **descrever** a persuasão (tríade funcional, credibilidade, modelo de
# comportamento), **projetá-la** (o ciclo do gancho) e **julgá-la** (vício por
# design, dano algorítmico em escala, ética). Ler Fogg e Eyal sem a terceira família
# é manual de engajamento; lê-los com ela é captologia.
# -------------------------------------------------------------------------

  - id: comp:ihc/triade-funcional-da-persuasao
    titulo: Classificar uma tecnologia persuasiva pelo papel que o computador assume
    rev: 1
    status: ativo
    descricao: >
      A tríade funcional de Fogg: o computador persuade como ferramenta (torna o
      comportamento mais fácil — redução, encadeamento, sugestão no momento certo,
      automonitoramento), como mídia (deixa ensaiar a causa e o efeito numa simulação)
      ou como ator social (elogia, retribui, parece alguém). A competência é decompor um
      produto real por esses papéis e pelo princípio que cada recurso dele aciona, em
      vez de chamá-lo de "viciante" ou "intuitivo".
    verificacao: >
      Dado um produto digital que não os do livro — aplicativo de exercício, de banco,
      de idiomas, rede social, painel de carro: listar três recursos dele e dizer, para
      cada um, se o computador atua como ferramenta, mídia ou ator social, nomeando o
      princípio acionado (redução, encadeamento, sugestão, automonitoramento,
      vigilância, condicionamento, simulação, elogio, reciprocidade); apontar um recurso
      que acumula dois papéis e dizer qual deles faz o trabalho persuasivo; e dizer que
      comportamento-alvo o produto quer mudar, distinguindo-o do que ele declara.

  - id: comp:ihc/credibilidade-de-sistema-computacional
    titulo: Avaliar de onde vem a credibilidade que um sistema computacional obtém
    rev: 1
    status: ativo
    descricao: >
      Persuasão depende de ser acreditado, e Fogg separa a credibilidade em
      confiabilidade e competência percebidas, e quatro origens: presumida (o que se
      supõe de antemão), por reputação (o que terceiros dizem), superficial (a
      aparência) e conquistada (a experiência de uso). A competência é dizer de qual
      dessas origens um sistema tira a credibilidade que tem, e que erro do sistema a
      destruiria.
    verificacao: >
      Dado um site, assistente ou aplicativo real: dizer que credibilidade ele tem para
      um usuário novo e para um usuário de um ano, atribuindo cada uma a uma das quatro
      origens (presumida, reputada, superficial, conquistada) com o elemento concreto que
      a produz; apontar um elemento superficial que produz credibilidade sem relação
      com a competência real do sistema; e dizer que erro, e de que tamanho, o usuário
      perdoaria e qual não perdoaria, justificando pela origem da confiança.

  - id: comp:ihc/modelo-de-comportamento-de-fogg
    titulo: Diagnosticar e projetar um comportamento pelo modelo B=MAP
    rev: 1
    status: ativo
    descricao: >
      Comportamento acontece quando motivação, capacidade e um gatilho (prompt)
      coincidem no mesmo instante; faltando o gatilho, nada acontece, e com motivação
      baixa só o comportamento muito fácil passa da linha de ação. A competência é usar
      o modelo nos dois sentidos — explicar por que um comportamento desejado não
      ocorre, e desenhar um hábito novo por âncora, versão mínima e celebração em vez de
      força de vontade.
    verificacao: >
      Dado um comportamento que alguém quer e não faz — o próprio estudante ou um caso
      descrito: dizer qual dos três elementos (motivação, capacidade, gatilho) falta e
      por que evidência se sabe; propor um micro-hábito na forma "depois que eu [âncora],
      vou [versão mínima]", justificando a âncora pela regularidade e a versão mínima
      pela capacidade; dizer por que aumentar a motivação é a intervenção menos
      confiável naquele caso; e aplicar o mesmo diagnóstico a um gatilho de produto
      digital, dizendo se ele é faísca, facilitador ou sinal.

  - id: comp:ihc/ciclo-do-gancho
    titulo: Decompor um produto formador de hábito pelo ciclo gatilho, ação, recompensa e investimento
    rev: 1
    status: ativo
    descricao: >
      O modelo de Eyal para o produto usado sem que se decida usá-lo: gatilho externo
      que vira interno (uma emoção, um tédio), ação simples, recompensa variável — da
      tribo, da caça ou do eu — e investimento que carrega o próximo gatilho e aumenta o
      custo de sair. A competência é ler um produto por esse ciclo com precisão, e
      também o teste que o próprio Eyal propõe: se quem desenha usaria o produto e se
      ele melhora a vida de quem o usa.
    verificacao: >
      Dado um produto digital de uso diário que não os do livro: identificar o gatilho
      externo e o interno que ele pretende criar, a ação mínima, o tipo de recompensa
      variável (tribo, caça, eu) e o investimento que o usuário deixa nele; dizer que
      parte do ciclo, se removida, mais reduziria o uso, e por quê; e classificar o
      produto pela matriz de manipulação de Eyal (facilitador, vendedor, artista,
      traficante), dizendo que evidência faltaria para firmar a classificação.

  - id: comp:ihc/vicio-comportamental-por-design
    titulo: Identificar os ingredientes de dependência comportamental num produto
    rev: 1
    status: ativo
    descricao: >
      Alter trata o uso compulsivo de tecnologia como vício comportamental e o
      decompõe nos ingredientes que o design pode dosar: meta sempre um pouco além,
      retorno imprevisível, sensação de progresso, dificuldade que escala, tensão não
      resolvida (o episódio seguinte começa sozinho) e conexão social. A competência é
      encontrar esses ingredientes num produto e separar o que neles é escolha de
      design — reversível — do que é a disposição de quem usa.
    verificacao: >
      Dado um produto que um grupo de usuários diz não conseguir largar — jogo,
      plataforma de vídeo, rede social, aplicativo de apostas: apontar quais dos seis
      ingredientes de Alter ele contém, com o recurso concreto que realiza cada um;
      dizer qual é escolha de design que poderia ser retirada sem destruir o produto e
      o que se perderia; distinguir uso intenso de dependência, nomeando o critério e o
      dado que o mediria; e dizer que intervenção — de design, de ambiente ou de regra —
      atacaria o ingrediente mais forte.

  - id: comp:ihc/dano-algoritmico-em-escala
    titulo: Reconhecer quando um modelo de pontuação vira arma de destruição matemática
    rev: 1
    status: ativo
    descricao: >
      O'Neil chama de arma de destruição matemática o modelo que reúne três traços:
      opacidade (quem é pontuado não vê nem contesta), escala (decide sobre milhões) e
      dano (piora a vida de quem pontua mal), quase sempre com um laço de
      retroalimentação que confirma o próprio erro. A competência é aplicar os três
      critérios a um modelo real, achar o substituto (proxy) que ele mede no lugar do
      que diz medir, e dizer que mudança o desarmaria.
    verificacao: >
      Dado um modelo de decisão automatizada real e não estudado no livro — análise de
      crédito, triagem de currículo, ranqueamento de feed, policiamento preditivo,
      precificação de seguro: dizer se ele é opaco, se opera em escala e que dano
      produz, com evidência para cada um; nomear o proxy que ele usa e a divergência
      entre o proxy e o objetivo declarado; descrever o laço de retroalimentação, se
      houver, como sequência de passos; e propor uma mudança — de transparência, de
      contestação, de dado, de objetivo — dizendo a que custo ela viria e para quem.

  - id: comp:ihc/etica-da-tecnologia-persuasiva
    titulo: Julgar eticamente uma tecnologia persuasiva por intenção, método e resultado
    rev: 1
    status: ativo
    descricao: >
      Fogg propõe julgar a persuasão por três lados — a intenção de quem desenha, os
      métodos (há engano, coerção, exploração de vulnerabilidade?) e os resultados,
      previstos ou não — e acrescenta o que o computador muda: persiste sem cansar, não
      precisa ser honesto sobre ser máquina, opera em escala e dilui a
      responsabilidade. A competência cresce na trilha: aplicar o esquema a um produto,
      depois a um vício projetado, depois a um modelo que decide sobre milhões sem
      persuadir ninguém.
    verificacao: >
      Dado um caso real de tecnologia que muda comportamento ou decide sobre pessoas:
      julgar separadamente intenção, método e resultado, dizendo onde o julgamento
      diverge entre os três; nomear o que no caso o computador torna diferente de um
      persuasor humano fazendo o mesmo; dizer quem é responsável por um resultado não
      previsto e por que via essa responsabilidade se cobraria; e defender uma regra —
      de produto, de plataforma ou de lei — que mudaria o caso, com a objeção mais forte
      a ela.

# -------------------------------------------------------------------------
# trilha:ihc/computacao-afetiva
#
# Segunda trilha da área, pedida pelo estudante em 2026-11-14 a partir de uma lista
# de sugestões de leitura sobre computação afetiva. Fica em `ihc` pelo mesmo motivo
# que a captologia: o campo foi fundado por Rosalind Picard no MIT Media Lab como
# problema de interação, não de aprendizado de máquina — e a parte que é de
# aprendizado de máquina (o canal textual) já tem casa em `ia`, e é referenciada de
# lá em vez de reescrita aqui.
#
# As oito competências se dividem em quatro famílias, e a divisão é a tese da trilha:
# **descrever** o campo e o que nele é afeto (as três capacidades, o afeto na
# decisão), **reconhecer** (afeto por sinal), **produzir** (emoção sintética em
# agente, resposta social à máquina, design emocional em três níveis) e **duvidar**
# (validade de construto, crítica política). A quarta família não é apêndice: sem
# ela, ler Picard e o Oxford Handbook em 2026 é aprender a construir um detector cuja
# premissa — a de que existe emoção básica com assinatura facial estável — a
# psicologia da emoção já não sustenta.
#
# Mesmo critério das outras áreas de leitura: a `verificacao` se cobra **fora** do
# corpus da trilha — qualquer produto, qualquer artigo, qualquer sistema em uso. Os
# nove livros são só onde a trilha as exercita.
# -------------------------------------------------------------------------

  - id: comp:ihc/tres-capacidades-da-computacao-afetiva
    titulo: Distinguir, num sistema, reconhecer afeto, expressar afeto e ter afeto
    rev: 1
    status: ativo
    descricao: >
      Picard separa três capacidades que a palavra "afetivo" junta e que não se
      implicam: reconhecer o afeto de quem usa, expressar afeto para quem usa (com ou
      sem estado interno correspondente) e ter um estado afetivo que altere o próprio
      processamento. A competência é dizer qual delas um sistema concreto tem,
      distinguir expressão de posse, e dizer para que serve a que ele tem — porque é
      aí que a maior parte das promessas de produto se desfaz.
    verificacao: >
      Dado um produto ou um artigo que se anuncie como afetivo, emocional ou empático
      e não os do corpus: dizer qual das três capacidades ele realmente tem e por que
      evidência; apontar onde a descrição confunde expressar com ter, ou reconhecer
      com inferir corretamente; dizer que decisão do sistema muda por causa do afeto
      detectado, nomeando a decisão, e se ela mudaria igualmente com uma heurística
      sem afeto nenhum; e dizer qual das três capacidades o caso dispensaria sem
      perder a função declarada.

  - id: comp:ihc/emocao-na-decisao
    titulo: Explicar o papel do afeto numa decisão que se apresenta como racional
    rev: 1
    status: ativo
    descricao: >
      Damásio argumenta, a partir de lesão pré-frontal ventromedial, que o afeto não é
      ruído sobre a razão: pacientes com raciocínio e memória preservados e marcação
      emocional destruída decidem mal a vida prática, e a hipótese do marcador
      somático explica por quê — o corpo pré-seleciona opções antes da deliberação. A
      competência é usar isso para ler uma decisão real, e também para dizer o que
      daqui **não** se segue, que é a parte normalmente atropelada quando o argumento
      chega à computação afetiva.
    verificacao: >
      Dado um caso de decisão documentado — clínico, profissional, de consumo ou de
      política pública: separar o que no caso é deliberação explícita do que é
      pré-seleção afetiva, dizendo por que indício; descrever a hipótese do marcador
      somático como mecanismo, em passos, e dizer que observação a falsificaria;
      apontar um erro de decisão do caso que a leitura puramente racional não explica;
      e dizer, explicitamente, por que "afeto participa da decisão" não autoriza
      concluir "medir afeto melhora a decisão", nomeando o salto.

  - id: comp:ihc/reconhecimento-de-afeto-por-sinal
    titulo: Projetar e criticar um reconhecedor de afeto a partir de sinal observável
    rev: 1
    status: ativo
    descricao: >
      O lado de engenharia do campo: escolher a modalidade (face, voz, fisiologia,
      postura, interação), extrair atributos, treinar e avaliar, e decidir como
      combinar modalidades — fusão no nível do atributo ou no da decisão. A competência
      inclui o que costuma afundar esses sistemas antes do algoritmo: de onde veio o
      rótulo, se a avaliação é dependente ou independente de sujeito, e o que o sinal
      mede quando o contexto muda.
    verificacao: >
      Dado um objetivo de reconhecimento afetivo e um orçamento de sensores: escolher
      a modalidade e justificar pela razão sinal-ruído e pela intrusividade, não pela
      disponibilidade de biblioteca; dizer como os rótulos de treino seriam obtidos e
      que viés cada via de rotulagem (autorrelato, anotador externo, situação
      induzida) introduz; descrever o protocolo de avaliação separando sujeito,
      sessão e contexto, e dizer qual separação o sistema provavelmente não respeita;
      escolher entre fusão precoce e tardia com um motivo que não seja de moda; e
      nomear uma confusão sistemática esperada — um estado que o sinal escolhido não
      distingue de outro.

  - id: comp:ihc/emocao-sintetica-em-agente
    titulo: Projetar o estado afetivo de um agente e dizer o que ele muda no comportamento
    rev: 1
    status: ativo
    descricao: >
      O lado da geração: fazer um agente expressar afeto de modo legível e, mais
      difícil, ter um estado interno que altere a própria deliberação. Minsky
      oferece o enquadramento forte — emoção como "maneira de pensar", um recurso que
      desliga outros recursos, e não um verniz sobre a cognição —, e a literatura de
      avaliação (appraisal) oferece as arquiteturas que transformam isso em regra
      executável. A competência é desenhar um desses estados sem cair no decorativo.
    verificacao: >
      Dado um agente com uma tarefa definida — tutor, assistente, personagem,
      companheiro de equipe: especificar um estado afetivo em termos de que eventos o
      produzem (avaliação de quê, em relação a que objetivo), quanto ele dura e como
      decai; dizer que comportamento do agente muda quando ele está nesse estado, e
      mostrar que a mudança não é obtível por uma regra sem afeto; especificar a
      expressão do estado em pelo menos dois canais e dizer qual é redundante; dizer
      se o agente deve declarar que não sente, e defender a escolha; e apontar um modo
      de falha em que o estado afetivo prejudica a tarefa.

  - id: comp:ihc/resposta-social-a-maquina
    titulo: Prever a resposta social de quem usa a uma escolha de interface
    rev: 1
    status: ativo
    descricao: >
      O achado experimental de Nass e colegas: pessoas aplicam a máquinas regras que
      são sociais — reciprocidade, cortesia, lisonja, atribuição de personalidade e de
      gênero à voz, constrangimento diante de crítica —, mesmo sabendo perfeitamente
      que é máquina, e mesmo negando que o fazem. A competência é usar isso para
      prever o efeito de uma escolha concreta de interface, e para projetar um teste
      que confirme ou negue a previsão.
    verificacao: >
      Dada uma escolha concreta de interface — o texto de uma mensagem de erro, a voz
      de um assistente, a ordem de um elogio, a identidade de quem dá uma nota:
      prever a resposta social que ela produz, nomeando a regra social acionada;
      desenhar um experimento com condição de controle que distinguiria essa previsão
      da hipótese nula, dizendo o que se mediria; dizer por que perguntar ao usuário
      não serve como medida nesse caso; e apontar um uso da mesma regra que seria
      manipulação, separando-o do uso que não é, com o critério explícito.

  - id: comp:ihc/design-emocional-em-tres-niveis
    titulo: Analisar e corrigir um artefato pelos três níveis do processamento
    rev: 1
    status: ativo
    descricao: >
      Norman separa o visceral (a reação imediata à forma, antes de qualquer
      interpretação), o comportamental (o prazer e a frustração de usar, que é o
      território da usabilidade) e o reflexivo (o que o objeto diz de quem o tem, a
      memória e a narrativa). A competência é localizar em que nível um artefato
      acerta e em que nível falha — e saber que os níveis podem se contradizer, caso em
      que a correção de um piora o outro.
    verificacao: >
      Dado um artefato ou interface em uso, de preferência um que o estudante tenha
      abandonado ou mantido contra a própria conveniência: descrever a resposta em
      cada um dos três níveis, com o elemento concreto que a produz; apontar uma
      contradição entre dois níveis e dizer qual venceu na decisão de continuar usando
      ou não; propor uma mudança que melhore o nível mais fraco e dizer o que ela
      custa nos outros dois; e dizer em que caso o nível reflexivo sozinho sustenta um
      produto ruim de usar, com um exemplo que não seja de luxo.

  - id: comp:ihc/validade-de-construto-na-inferencia-de-emocao
    titulo: Julgar a validade de construto de um sistema que declara inferir emoção
    rev: 1
    status: ativo
    descricao: >
      A pergunta que vem antes da acurácia: o que exatamente o sistema afirma estar
      medindo, e esse algo existe na forma que ele supõe? Barrett reúne a evidência de
      que categorias de emoção não têm assinatura corporal nem facial estável — há
      variabilidade dentro da categoria e degeneração entre categorias —, e sustenta
      que a emoção é construída pelo cérebro no contexto. A competência é extrair daí
      consequências operacionais: o rótulo do conjunto de treino é uma teoria da
      emoção embutida, e uma acurácia alta contra esse rótulo pode não medir nada do
      mundo.
    verificacao: >
      Dado um sistema de inferência de emoção com métrica publicada: dizer que
      construto ele afirma medir e que teoria da emoção o seu esquema de rótulos
      pressupõe; explicar, com a distinção entre variabilidade e degeneração, por que
      uma acurácia alta contra aqueles rótulos pode ser compatível com não medir
      emoção; propor uma validação externa que o construto exigiria, e dizer por que a
      validação cruzada interna não a substitui; reescrever a alegação do sistema numa
      forma defensável (sobre movimento facial, sobre ativação fisiológica, sobre
      rótulo de anotador) e dizer o que a reescrita custa ao produto; e dizer em que
      uso a alegação mais fraca ainda é suficiente, e em que uso não é.

  - id: comp:ihc/critica-politica-do-reconhecimento-de-emocao
    titulo: Situar um sistema de reconhecimento de emoção na cadeia de poder que o sustenta
    rev: 1
    status: ativo
    descricao: >
      Crawford lê a inteligência artificial como indústria extrativa — mineral,
      energética, de trabalho de rotulagem e de dados tomados sem consentimento — e
      dedica ao reconhecimento de emoção o argumento mais direto: uma teoria
      psicológica contestada foi convertida em infraestrutura de classificação, e
      vendida a quem contrata, vigia e pune. A competência é fazer essa leitura num
      caso concreto, do sensor ao contrato, e distinguir o que é defeito corrigível do
      que é a função.
    verificacao: >
      Dado um uso real de reconhecimento de emoção — triagem de candidatos,
      monitoramento de sala de aula, fronteira, central de atendimento, carro,
      publicidade: nomear quem é medido, quem decide e quem lucra, e dizer quem
      assume o risco do erro; rastrear de onde vieram os dados de treino e que
      trabalho humano os rotulou, com a condição desse trabalho; dizer se o dano
      depende de o sistema estar errado ou se um sistema perfeitamente acurado
      produziria dano igual, justificando; identificar a assimetria que impede quem é
      pontuado de contestar; e avaliar uma intervenção regulatória concreta — proibição
      por contexto, exigência de consentimento, abertura de auditoria — dizendo o que
      ela não resolve.

# -------------------------------------------------------------------------
# trilha:ihc/reconhecimento-de-emocao-na-voz
#
# Terceira trilha da área, pedida pelo estudante em 2026-11-14 logo depois da
# computação afetiva: ele pediu livros sobre reconhecimento de emoção **em voz** e
# mandou registrá-los. É especialização, não trilha paralela —
# `etapa:ihc/deteccao-de-afeto-por-sinal` (trilha:ihc/computacao-afetiva) trata voz
# como uma modalidade entre quatro, e esta trilha abre esse canal. Por isso ela
# **exige** aquela competência e referencia as duas etapas que levam até ela, em vez
# de recomeçar do zero.
#
# Cinco competências, e a ordem delas é a tese: **situar** (emoção é uma tarefa
# paralinguística entre várias, não um campo próprio), **decompor o sinal** (fonte de
# excitação, tracto vocal, prosódia — não "atributos de áudio" em bloco),
# **comparar com o ouvinte humano**, e **julgar o corpus**, que é onde o canal vocal
# tem um problema que o facial não tem na mesma forma: quase todo corpus histórico é
# de fala atuada, e acurácia alta contra ele pode estar medindo a competência de
# atores em produzir estereótipo vocal. A quinta, a análise de sinal, é base opcional
# para quem chega sem ela.
#
# Mesmo critério das outras: a `verificacao` se cobra fora do corpus da trilha —
# qualquer gravação, qualquer corpus, qualquer sistema em uso.
# -------------------------------------------------------------------------

  - id: comp:ihc/paralinguistica-como-tarefa
    titulo: Situar o reconhecimento de emoção entre as tarefas paralinguísticas da fala
    rev: 1
    status: ativo
    descricao: >
      Paralinguística computacional é o que na fala não é o que se diz: emoção, mas
      também personalidade, idade, sexo, intoxicação, sonolência, carga cognitiva e
      estado de saúde. Schuller e Batliner tratam essas tarefas com o mesmo
      encadeamento — corpus, atributos, classificador, protocolo — e é isso que a
      competência exige enxergar: emoção não é um problema sui generis, e o que a
      distingue das vizinhas é a definição do rótulo, não a técnica.
    verificacao: >
      Dada uma alegação de produto ou de artigo sobre o que se extrai da voz: dizer
      qual é a tarefa paralinguística em jogo e qual rótulo ela usa; apontar uma tarefa
      vizinha que o mesmo sinal e o mesmo extrator atenderiam, e dizer o que mudaria no
      conjunto de rótulos; dizer se o sistema está medindo estado (que passa) ou traço
      (que não passa), e por que a diferença muda o protocolo de avaliação; e nomear
      uma tarefa paralinguística cuja confusão com emoção explicaria um resultado bom
      pelo motivo errado.

  - id: comp:ihc/fontes-do-sinal-de-emocao-na-fala
    titulo: Decompor o sinal de fala nas fontes de que a emoção é extraída
    rev: 1
    status: ativo
    descricao: >
      Rao e Koolagudi organizam o problema pela origem física do atributo, e não pela
      biblioteca que o calcula: informação da fonte de excitação (o que a glote faz),
      informação do tracto vocal (a filtragem, de onde saem os atributos espectrais e
      os cepstrais) e informação prosódica (entoação, duração, intensidade ao longo do
      enunciado). A competência é saber qual fonte carrega qual parte do afeto, e por
      que juntar tudo num vetor único esconde a resposta.
    verificacao: >
      Dado um enunciado gravado e um objetivo de reconhecimento: atribuir cada atributo
      que você usaria a uma das três fontes (excitação, tracto vocal, prosódia) e dizer
      o que cada uma contribui naquele caso; dizer qual delas sobrevive a uma gravação
      ruim de telefone e qual não, justificando pela banda e pelo ruído; apontar um
      atributo prosódico que depende do **enunciado inteiro** e dizer o que isso impõe
      à janela de análise; e dizer o que você perderia medindo só coeficientes
      cepstrais, que é o atalho mais comum.

  - id: comp:ihc/percepcao-vocal-do-afeto
    titulo: Comparar o reconhecimento automático com o que o ouvinte humano faz
    rev: 1
    status: ativo
    descricao: >
      Antes de medir máquina contra rótulo, há a pergunta de como o ouvinte humano
      extrai afeto de uma voz — que pistas usa, com que acerto, com que viés de
      familiaridade, língua e identidade de quem fala, e o que o cérebro faz com voz
      que não faz com outro som. A competência é usar a percepção humana como
      referência explícita: é dela que vem o teto realista de desempenho, e é ela que
      diz quando a tarefa é mal definida também para gente.
    verificacao: >
      Dado um resultado de reconhecimento automático de emoção em voz: dizer qual é o
      acerto humano na mesma tarefa e com que concordância entre ouvintes, e onde esse
      número foi obtido; julgar se o sistema superou pessoa ou superou **o rótulo**, e
      explicar a diferença; nomear duas pistas vocais que o ouvinte humano usa e dizer
      se o extrator do sistema as captura; apontar um efeito de familiaridade, de
      língua ou de identidade do falante que contaminaria a comparação; e dizer o que
      um teto humano baixo significa para a alegação do produto.

  - id: comp:ihc/corpus-de-emocao-na-fala
    titulo: Julgar um corpus de emoção na fala pelo que ele pode sustentar
    rev: 1
    status: ativo
    descricao: >
      É a competência que decide o valor de todo o resto. Um corpus de fala atuada tem
      rótulo limpo e estímulo irreal; um de fala espontânea tem o inverso, e costuma ser
      pequeno e desbalanceado. Somam-se a isso a língua, o número de falantes, o canal
      de gravação, quem anotou e com que concordância, e o esquema de classes — que às
      vezes mistura dimensões que não são emoção. A competência é dizer o que o corpus
      autoriza concluir, e o que não.
    verificacao: >
      Dado um corpus de emoção na fala e uma métrica publicada sobre ele: dizer se a
      fala é atuada, induzida ou espontânea e o que isso faz com a validade externa;
      contar falantes, duração e distribuição de classes, e dizer qual classe a métrica
      agregada está escondendo; examinar o esquema de rótulos e apontar uma classe que
      não é emoção, ou que mistura emoção com outro atributo do falante; dizer se a
      avaliação pode ser independente de falante com aquele número de falantes; e dizer
      que alegação do estado da arte **deixa de se sustentar** se avaliada só nesse
      corpus.

  - id: comp:ihc/analise-de-sinal-de-audio
    titulo: Percorrer o encadeamento de análise de um sinal de áudio até o classificador
    rev: 1
    status: ativo
    descricao: >
      A base de processamento que o reconhecimento de emoção pressupõe e raramente
      ensina: janelamento e sobreposição, representação espectral, extração de atributos
      de baixo nível e sua agregação em funcionais sobre o segmento, normalização, e só
      então o classificador. Competência de base, oferecida como etapa opcional para
      quem chega sem ela — e útil além da emoção, porque é o mesmo encadeamento de
      qualquer tarefa de áudio.
    verificacao: >
      Dado um sinal de áudio e uma tarefa de classificação por segmento: escolher
      tamanho e sobreposição de janela e justificar pelo fenômeno que se quer medir, não
      pelo padrão da biblioteca; distinguir atributo de baixo nível do funcional que o
      agrega, e dizer que informação o funcional destrói; dizer onde a normalização
      entra e por que normalizar por falante muda o que o classificador pode aprender;
      e apontar um ponto do encadeamento em que uma decisão de pré-processamento
      vazaria informação do conjunto de teste.

# -------------------------------------------------------------------------
# Quarta trilha da área, pedida pelo estudante em 2026-11-14 na sequência da voz:
# ele pediu livros sobre reconhecimento de emoção **em expressão facial** e mandou
# registrá-los.
#
# **Aqui a trilha NÃO é especialização, e a diferença em relação à voz é de fundo.**
# A trilha da voz abriu um canal que `etapa:ihc/deteccao-de-afeto-por-sinal` já
# tratava como uma modalidade entre quatro, e por isso exigiu aquela competência. O
# canal facial tem raiz própria e mais antiga que o campo todo: Darwin, 1872, setenta
# anos antes de haver computador. Entrar por Picard seria entrar pelo meio. Por isso
# estas competências partem de perfil vazio e nenhuma depende de outra trilha.
#
# Quatro competências, e a ordem delas é a tese: **a origem** (de onde vem a
# alegação de universalidade e o que a evidência dela sustenta), **o instrumento**
# (codificar movimento muscular em unidades de ação — e separar isso da inferência de
# emoção), **o contra-argumento ecológico** (a face como sinal social dirigido a
# alguém, não como vazamento de estado interno) e **a controvérsia** (situar uma
# afirmação sobre face e emoção na disputa que a psicologia da emoção não encerrou).
#
# A segunda é a que organiza tudo, e vale deixar escrito: **a codificação sobrevive à
# crítica, a inferência não.** "Unidade de ação 12 ativada" é descrição observável e
# reprodutível; "alegria 0,87" é outra alegação, e é a que a revisão de Barrett e
# colegas de 2019 derruba. Um sistema que relata unidades de ação faz afirmação
# defensável; o mesmo sistema que relata emoções, não. Esta é a aplicação facial de
# `comp:ihc/validade-de-construto-na-inferencia-de-emocao`
# (trilha:ihc/computacao-afetiva), que é a forma geral — e, como na voz, a instância
# **não** exige a geral de propósito: quem chega por aqui faz o juízo sem ter lido
# Barrett em livro, e sai com motivo para lê-la.
#
# Mesmo critério das outras: a `verificacao` se cobra fora do corpus da trilha —
# qualquer vídeo, qualquer estudo, qualquer produto de "emotion AI" em uso.
# -------------------------------------------------------------------------

  - id: comp:ihc/origem-evolutiva-da-expressao-facial
    titulo: Julgar uma alegação de universalidade da expressão facial pela evidência que a sustenta
    rev: 1
    status: ativo
    descricao: >
      A tese de que certas expressões faciais são as mesmas em toda parte vem de Darwin,
      que argumenta por **continuidade evolutiva** — o mesmo movimento no bebê, no
      adulto, no animal, no cego de nascimento —, e não por um conjunto fechado de
      categorias discretas; a leitura categórica é posterior a ele e tem de se defender
      sozinha. A competência é saber o que cada desenho de estudo pode estabelecer:
      reconhecimento transcultural por escolha forçada entre rótulos não é o mesmo que
      produção espontânea, e os dois sustentam conclusões diferentes.
    verificacao: >
      Dado um estudo que alega universalidade de uma expressão: dizer se a evidência é
      de produção ou de reconhecimento, e se o reconhecimento foi por escolha forçada
      entre rótulos dados ou por nomeação livre; dizer o que o viés de escolha forçada
      acrescenta de acerto mesmo quando não há sinal; apontar qual população tornaria o
      resultado mais informativo e por quê; e reescrever a conclusão do estudo numa
      forma que o desenho dele realmente autorize.

  - id: comp:ihc/codificacao-anatomica-do-movimento-facial
    titulo: Codificar movimento facial em unidades de ação e separar a descrição da inferência
    rev: 1
    status: ativo
    descricao: >
      O FACS decompõe todo movimento facial visível em unidades de ação ancoradas na
      anatomia, e é por isso que ele atravessa o debate intacto: ele descreve músculo,
      não sentimento. A competência tem duas metades inseparáveis — saber codificar, e
      saber onde a codificação termina. Dizer "unidade de ação 6 mais 12" é observação
      que outro codificador reproduz; dizer "alegria" é uma segunda alegação, que
      precisa de evidência própria e quase nunca a tem.
    verificacao: >
      Dado um quadro ou um trecho de vídeo de um rosto: nomear as unidades de ação
      plausíveis e dizer em que evidência visível cada uma se apoia; dizer qual par de
      emoções o mesmo conjunto de unidades seria compatível com, e o que no contexto
      decidiria entre elas; pegar a saída de um sistema comercial na forma
      "<emoção> <número>" e reescrevê-la como alegação sobre unidades de ação mais um
      passo inferencial explícito; e dizer que medida de concordância entre
      codificadores o resultado precisaria reportar para ser levado a sério.

  - id: comp:ihc/expressao-facial-como-sinal-social
    titulo: Explicar uma expressão facial como sinal dirigido a alguém, não como vazamento de estado interno
    rev: 1
    status: ativo
    descricao: >
      A leitura de ecologia comportamental, de Fridlund: expressões faciais são sinais
      com destinatário e função social — negociar, apaziguar, ameaçar, convidar —, e não
      leituras de um estado interno que escapa. A consequência prática é grande e é
      testável: a mesma pessoa, no mesmo estado, expressa de modo diferente com e sem
      audiência, inclusive audiência imaginada. Um reconhecedor treinado em rosto isolado
      mede o que a presença de outra pessoa modula, e não sabe disso.
    verificacao: >
      Dado um registro de expressão facial com e sem audiência: dizer o que cada leitura
      — vazamento de estado interno e sinal social — prediz para a diferença, e se o
      dado disponível separa as duas; apontar, num conjunto de treino de reconhecimento
      facial de emoção, onde a condição social está fixada sem ter sido declarada; dizer
      que alteração no protocolo de coleta tornaria a distinção observável; e nomear um
      caso em que a leitura social explica melhor uma expressão que a leitura de estado
      trataria como ruído.

  - id: comp:ihc/controversia-da-inferencia-facial-de-emocao
    titulo: Situar uma afirmação sobre face e emoção na controvérsia que a sustenta ou a derruba
    rev: 1
    status: ativo
    descricao: >
      Esta é a literatura mais disputada da computação afetiva, e a disputa não é
      detalhe técnico: há a posição das emoções básicas, a construcionista e a
      ecológico-comportamental, cada uma privilegiando um tipo de evidência, e meio
      século de troca entre elas. A competência é ler uma afirmação sobre face e emoção
      sabendo de que lado da evidência ela depende, em vez de herdar uma posição por
      acidente de bibliografia — e saber que achado a refutaria.
    verificacao: >
      Dada uma afirmação sobre o que um rosto indica — de artigo, de livro-texto ou de
      material de produto: identificar a posição teórica que ela pressupõe e o tipo de
      evidência que essa posição privilegia; nomear o achado empírico que a refutaria;
      dizer o que a revisão de 2019 de Barrett e colegas conclui sobre a confiabilidade,
      a especificidade e a generalização do mapeamento entre movimento facial e categoria
      de emoção, e qual das três a afirmação precisaria assumir; e dizer que parte da
      afirmação continua de pé se o passo inferencial cair.

# -------------------------------------------------------------------------
# Quinta trilha da área, pedida pelo estudante em 2026-11-14 na sequência da
# expressão facial: ele pediu livros sobre reconhecimento de emoção **em sinais
# fisiológicos** e mandou registrá-los. Fecha as três modalidades que
# `etapa:ihc/deteccao-de-afeto-por-sinal` (trilha:ihc/computacao-afetiva) trata em
# bloco — face, voz, fisiologia —, cada uma agora com trilha própria.
#
# **E esta modalidade tem um problema que as outras duas não têm.** Na face o
# problema é o paradigma; na voz, o corpus; aqui é **o sinal**. A condutância da pele
# sobe com ativação independentemente de valência, e a frequência cardíaca responde a
# postura, temperatura, cafeína e respiração antes de responder a emoção alguma. Não é
# artefato de conjunto de dados que um corpus melhor corrija: é fisiologia. A
# consequência é que a maior parte do trabalho de computação afetiva por fisiologia
# mede **ativação** e reetiqueta como emoção específica.
#
# Quatro competências, e a ordem delas é a tese: **adquirir** (onde o eletrodo vai,
# que artefato sobrevive ao filtro, que linha de base a medida exige), **ler o sinal
# que o campo mais usa** (atividade eletrodérmica, sem confundir ativação com
# emoção), **julgar se o padrão especifica a categoria** — a competência central — e
# **projetar a interface** que usa isso como entrada.
#
# A terceira é a que organiza tudo, e o material dela é uma divergência real, não um
# consenso: **duas meta-análises, dois vereditos opostos.** Kreibig (2010, 134
# estudos) conclui que há especificidade considerável *desde que* se considerem
# subtipos distintos de emoção; Siegel e colegas (2018, 202 estudos, com Barrett)
# concluem que não há mapeamento um-para-um. A competência não é escolher um lado: é
# saber em que cada uma condiciona a conclusão, e por que corrigir viés de publicação
# consome exatamente o condicional da primeira.
#
# Mesmo critério das outras: a `verificacao` se cobra fora do corpus da trilha —
# qualquer registro, qualquer pulseira, qualquer alegação de "detecção de estresse".
# -------------------------------------------------------------------------

  - id: comp:ihc/aquisicao-de-sinal-fisiologico
    titulo: Planejar e criticar a aquisição de um sinal fisiológico destinado a inferir afeto
    rev: 1
    status: ativo
    descricao: >
      A metade do problema que não aparece no artigo e decide o resultado: posição de
      eletrodo, taxa de amostragem, filtro, artefato de movimento e de respiração,
      linha de base, e o fato de que a maior parte do erro em trabalho de emoção por
      fisiologia é de aquisição e não de modelo. Inclui saber o que cada canal mede de
      fato — condutância da pele, eletrocardiograma, eletromiografia, eletroencefalograma,
      rastreamento ocular — e a que custo de invasividade.
    verificacao: >
      Dado um protocolo de coleta de sinal fisiológico para inferir estado afetivo:
      dizer onde cada eletrodo vai e por que ali; nomear uma fonte de artefato que
      sobreviveria ao filtro declarado e como ela se parece no traçado; dizer que linha
      de base a medida exige e por que normalizar por participante muda o que se pode
      alegar; e apontar uma variável de ambiente ou de rotina — temperatura, postura,
      cafeína, hora do dia — que explicaria o resultado sem nenhuma emoção.

  - id: comp:ihc/atividade-eletrodermal
    titulo: Interpretar atividade eletrodérmica sem confundir ativação com emoção
    rev: 1
    status: ativo
    descricao: >
      A atividade eletrodérmica é o sinal que a computação afetiva mais usa, inclusive
      nas pulseiras do próprio laboratório da Picard, e é o mais fácil de reportar
      errado. A competência separa o nível tônico da resposta fásica, situa a resposta
      na janela de latência em que ela pode ser atribuída a um estímulo, e, acima de
      tudo, sabe o que o sinal **não** distingue: ele acompanha ativação e é cego a
      valência, de modo que medo e entusiasmo produzem a mesma subida.
    verificacao: >
      Dado um traçado de condutância da pele com marcas de estímulo: separar nível
      tônico de resposta fásica e dizer que janela de latência autoriza atribuir a
      resposta ao estímulo; dizer que par de estados afetivos opostos em valência o
      traçado não separa, e que segundo canal os separaria; pegar uma alegação de
      produto na forma "estresse detectado" e reescrevê-la como alegação sobre ativação
      mais um passo inferencial explícito; e dizer que hábito de higiene, de
      temperatura ou de medicação invalidaria a comparação entre dois participantes.

  - id: comp:ihc/especificidade-autonomica-da-emocao
    titulo: Julgar se um padrão autonômico especifica uma categoria de emoção
    rev: 1
    status: ativo
    descricao: >
      A competência central da trilha, e a que a literatura não encerrou. A lógica da
      inferência psicofisiológica admite relações um-para-um, um-para-muitos,
      muitos-para-um e muitos-para-muitos entre medida fisiológica e construto
      psicológico, e quase tudo que interessa está nas três últimas. Duas meta-análises
      divergem: uma conclui especificidade considerável sob a condição de distinguir
      subtipos, a outra conclui que não há impressão digital autonômica por categoria.
      Saber ler a divergência vale mais que adotar qualquer das duas conclusões.
    verificacao: >
      Dadas duas revisões com vereditos opostos sobre especificidade autonômica: dizer
      em que cada uma condiciona a conclusão e que diferença de método produz a
      divergência; dizer o que a correção para viés de publicação faz com tamanho de
      efeito e com heterogeneidade, e qual conclusão ela enfraquece; classificar a
      relação que uma alegação de produto pressupõe entre medida e construto nas quatro
      formas da inferência psicofisiológica; e dizer que parte da alegação continua de
      pé se o mapeamento um-para-um cair.

  - id: comp:ihc/fisiologia-como-entrada-de-interface
    titulo: Projetar uma interface que usa sinal fisiológico como entrada e dizer o que ela pode prometer
    rev: 1
    status: ativo
    descricao: >
      Computação fisiológica é usar o corpo como entrada, e isso é problema de
      interação antes de ser de classificação: a malha pode ser explícita, com o sinal
      mostrado a quem usa e sob controle dele, ou implícita, com o sistema se adaptando
      sem aviso — e as duas têm éticas e modos de falha diferentes. A competência é
      escolher a malha, dimensionar latência e decidir o que acontece no falso
      positivo, sabendo que um sinal que só carrega ativação limita o que a interface
      pode honestamente prometer.
    verificacao: >
      Dada uma interface que se adapta ao estado de quem usa: dizer qual sinal a
      alimenta, com que latência entre evento e adaptação, e se a malha é explícita ou
      implícita; descrever o comportamento no falso positivo e no falso negativo, e
      dizer qual dos dois custa mais naquele uso; dizer o que a interface pode prometer
      se o sinal só carregar ativação, e reescrever a promessa nesses termos; e nomear
      um caso em que a adaptação implícita seria indefensável mesmo funcionando.
