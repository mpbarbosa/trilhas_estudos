versao_schema: 1
competencias:
  - id: comp:web/http-e-protocolo
    titulo: HTTP e o que acontece antes do código
    rev: 1
    status: ativo
    descricao: >
      O protocolo como contrato: métodos, códigos de status, cabeçalhos, cache,
      cookies, CORS, TLS e o custo de cada ida ao servidor.
    verificacao: >
      Diante do painel de rede de uma página lenta, apontar quais requisições são
      desnecessárias, quais poderiam ser servidas de cache e qual cabeçalho faria
      isso — justificando pela semântica do protocolo, não por tentativa.

  - id: comp:web/documento-e-estilo
    titulo: Documento e estilo
    rev: 1
    status: ativo
    descricao: >
      HTML como estrutura com significado e CSS como camada de apresentação: fluxo
      normal, modelo de caixa, cascata e especificidade, layout por grid e flexbox,
      e adaptação a tamanhos de tela.
    verificacao: >
      Reproduzir um layout de duas dimensões que se mantenha legível de 320px a
      1920px sem valores fixos de altura, e explicar por que uma regra sua vence
      outra na cascata.

  - id: comp:web/acessibilidade
    titulo: Acessibilidade de interface
    rev: 1
    status: ativo
    descricao: >
      Construir para quem não usa mouse nem enxerga a tela: semântica nativa antes de
      ARIA, foco visível e ordem de foco, contraste, nome acessível, estados anunciados.
    verificacao: >
      Operar um fluxo completo da sua própria interface usando apenas o teclado e um
      leitor de tela, e corrigir ao menos um ponto em que o componente não anuncia o
      próprio estado.

  - id: comp:web/javascript-de-aplicacao
    titulo: JavaScript de aplicação
    rev: 1
    status: ativo
    descricao: >
      A linguagem como ela roda: escopo e closures, o modelo de objetos, módulos,
      manipulação do DOM, e o laço de eventos com assincronia por promessas.
    verificacao: >
      Explicar, sobre código seu, a ordem em que um conjunto de operações assíncronas
      executa, e corrigir uma condição de corrida sem recorrer a espera por tempo.

  - id: comp:web/tipagem-estatica
    titulo: Tipagem estática em JavaScript
    rev: 1
    status: ativo
    descricao: >
      Usar TypeScript como ferramenta de projeto, não de anotação: modelar estados
      possíveis, estreitar tipos, tipos genéricos, e reconhecer quando `any` ou uma
      asserção está escondendo um erro de modelagem.
    verificacao: >
      Reescrever um tipo que admite estados impossíveis de modo que o compilador
      recuse o estado inválido, e demonstrar o erro que ele passa a pegar.

  - id: comp:web/interface-por-componentes
    titulo: Interface por componentes
    rev: 1
    status: ativo
    descricao: >
      Compor uma interface em unidades com estado e limites claros: onde o estado
      mora, o que causa nova renderização, efeitos e sincronização com o servidor,
      e o custo de cada abstração.
    verificacao: >
      Entregar uma interface com dado remoto que trate carregamento, erro e estado
      vazio, e justificar a posição escolhida para cada pedaço de estado.

  - id: comp:web/visualizacao-no-navegador
    titulo: Visualização de dados no navegador
    rev: 1
    status: ativo
    descricao: >
      Ligar dado a elementos gráficos no navegador: escalas, eixos, seleção e
      associação de dados, transições e interação.
    verificacao: >
      Construir um gráfico interativo a partir de dado real, com escala e eixos
      corretos, que permaneça legível quando o conjunto dobra de tamanho.

  - id: comp:web/javascript-no-servidor
    titulo: JavaScript no servidor
    rev: 1
    status: ativo
    descricao: >
      A mesma linguagem fora do navegador: o laço de eventos de Node sem DOM,
      resolução de módulos (CommonJS e ESM), I/O de arquivo e de rede sem bloquear,
      um servidor HTTP escrito à mão, e dependência de terceiro com o custo que ela
      traz.
    verificacao: >
      Servir uma API HTTP própria, sem framework, que leia e escreva arquivo; depois
      trocar a leitura pela variante síncrona e mostrar — medindo a latência de uma
      segunda requisição concorrente — o que o bloqueio do laço de eventos custa.

  # Fecha a lacuna de docs/acervo-lido.md § 3.2, pela forma decidida em
  # docs/adr/0011-python-no-servidor-como-ramo-da-trilha-web.md. Irmã de
  # comp:web/javascript-no-servidor e distinta dela no que importa: lá o exercício é
  # servir API sem framework e medir o custo de bloquear o laço de eventos; aqui a
  # página sai montada do servidor, e o que se aprende é a borda — URL endereçável,
  # template com escape, domínio puro atrás dela. É a camada que o próprio
  # repositório construiu (docs/adr/0007-entrega-web-em-python-html-no-servidor.md).
  - id: comp:web/python-no-servidor
    titulo: Python no servidor — HTTP e HTML montado antes de sair
    rev: 1
    status: ativo
    descricao: >
      Servir HTTP em Python com a página montada no servidor: roteamento e URL
      endereçável, requisição e resposta, template com herança e escape automático,
      arquivo estático e erro com página própria — e a borda de I/O separada do
      domínio, que continua testável sem subir servidor.
    verificacao: >
      Servir, a partir de um JSON de entrada, páginas de leitura em que cada URL
      abra sempre o mesmo conteúdo sem depender de estado de sessão, com um template
      base herdado pelos demais; depois mostrar que o cálculo exibido mora fora do
      template, exercitando-o por teste que não sobe servidor.

  # As duas abaixo nascem com trilha:web/typescript-sistema-de-tipos, da leitura de
  # *Total TypeScript* (Matt Pocock com Taylor Bell, No Starch Press, 2026). São
  # escritas **gerais** de propósito: a `verificacao` se cobra em qualquer base
  # TypeScript, não no livro — assim o próximo material da área entra como etapa, sem
  # reescrever competência. O que o livro é, a trilha diz; o que se passa a saber,
  # estas dizem.
  #
  # Nenhuma substitui comp:web/tipagem-estatica, que continua sendo "usar TypeScript
  # como ferramenta de projeto" e já tem etapa e evidência possíveis. A fronteira:
  # lá se modela o estado possível; aqui se deriva um tipo de outro (primeira) e se
  # configura e sustenta o compilador e a arquitetura (segunda).
  - id: comp:web/tipos-derivados
    titulo: Tipos derivados de tipos
    rev: 1
    status: ativo
    descricao: >
      Derivar um tipo do que já existe em vez de redigitá-lo: `keyof`, `typeof`, acesso
      indexado, tipo mapeado e tipo condicional, genérico como transformação, e
      `satisfies` no lugar da anotação que apaga a informação que se queria manter.
    verificacao: >
      Diante de um tipo mantido em duplicata — escrito à mão ao lado do valor, do
      esquema ou da função que ele deveria acompanhar —, derivá-lo da fonte única e
      mostrar que uma mudança na fonte passa a quebrar a compilação no ponto exato em
      que a duplicata mentiria calada.

  - id: comp:web/compilador-e-arquitetura-de-tipos
    titulo: Configuração do compilador e arquitetura de tipos
    rev: 1
    status: ativo
    descricao: >
      O compilador como parte do projeto: `tsconfig.json` por alvo (aplicação no
      navegador, Node, biblioteca publicada), resolução de módulo, rigor adotado em
      etapas, arquivo de declaração e o que é emitido — e a arquitetura que mantém os
      tipos legíveis e conferíveis quando o projeto cresce.
    verificacao: >
      Configurar um projeto do zero para o próprio alvo, justificando cada opção pelo
      erro que ela passa a pegar ou pelo que ela muda na saída emitida; e, num código
      cujos tipos ficaram ilegíveis ou lentos de conferir, localizar a construção
      responsável e substituí-la por uma mais simples sem perder a garantia que ela
      dava.

  # --- Código binário portátil no navegador e fora dele ---------------------
  # Escritas gerais de propósito: a `verificacao` se cobra sobre qualquer módulo
  # WebAssembly e qualquer cadeia de ferramentas, não sobre o livro que abriu a
  # trilha nem sobre Rust, que é só a linguagem de origem dos exemplos dele. O
  # próximo material da área entra como etapa, sem reescrever competência.
  - id: comp:web/modulo-wasm-e-maquina-virtual
    titulo: Módulo WebAssembly e a máquina virtual que o executa
    rev: 1
    status: ativo
    descricao: >
      O modelo de execução antes do código: a máquina virtual de pilha, os tipos de
      valor que ela conhece, os dois formatos do mesmo módulo — texto e binário —, o
      que a compilação de uma linguagem de origem produz, e o isolamento em caixa de
      areia que define o que um módulo pode e não pode alcançar por si.
    verificacao: >
      Diante de uma função em linguagem compilável para o formato, prever os tipos de
      valor da assinatura resultante, compilar o módulo e mostrar na saída onde cada
      parte da função foi, e dizer o que aquele módulo é incapaz de fazer sem que o
      hospedeiro lhe conceda.

  - id: comp:web/interoperacao-modulo-e-hospedeiro
    titulo: Interoperação entre o módulo e o hospedeiro
    rev: 1
    status: ativo
    descricao: >
      A fronteira que o módulo não atravessa sozinho: importação e exportação, a
      memória linear vista do hospedeiro por matrizes tipadas, valores globais,
      tabelas de referência, e a instância como o objeto onde tudo isso se junta.
    verificacao: >
      Transferir nos dois sentidos um dado que não é número — uma imagem, um vetor de
      bytes ou uma cadeia de texto — entre o hospedeiro e o módulo, sem cópia
      desnecessária, e justificar a escolha de onde a memória foi alocada e quem
      conhece seu endereço e seu comprimento.

  - id: comp:web/vinculacao-e-abi-de-modulo
    titulo: Vinculação e interface binária de aplicativo
    rev: 1
    status: ativo
    descricao: >
      O contrato que duas unidades compiladas cumprem para se chamarem: a interface
      binária da linguagem de origem, o símbolo declarado externo, a vinculação
      estática contra a dinâmica, e a codificação com que um tipo da linguagem chega
      do outro lado como bytes em memória.
    verificacao: >
      Fazer um módulo chamar código compilado separadamente, declarando o símbolo e a
      convenção de chamada, e explicar o que muda na saída e no carregamento quando a
      mesma dependência é vinculada estaticamente ou dinamicamente.

  - id: comp:web/concorrencia-em-memoria-compartilhada
    titulo: Concorrência sobre memória compartilhada
    rev: 1
    status: ativo
    descricao: >
      Mais de um fio de execução sobre a mesma memória: memória declarada
      compartilhada, a operação atômica e o que ela garante, a espera e o despertar
      sobre um endereço, e os requisitos que o hospedeiro impõe para permitir tudo
      isso.
    verificacao: >
      Escrever um cálculo que duas ou mais execuções paralelas dividem sobre a mesma
      memória, demonstrar o resultado errado que a versão sem sincronização produz, e
      corrigi-lo com operação atômica em vez de espera por tempo.

  - id: comp:web/formato-binario-de-modulo
    titulo: Leitura e manipulação do formato binário
    rev: 1
    status: ativo
    descricao: >
      O arquivo como objeto de estudo: o formato de texto e suas instruções numéricas
      e de controle, as seções da estrutura binária, as ferramentas que desmontam,
      interpretam, convertem e otimizam um módulo — e os três momentos em que ele pode
      falhar, que são compilação, instanciamento e execução.
    verificacao: >
      Diante de um binário que não se escreveu, desmontá-lo para o formato de texto,
      dizer o que cada seção declara, localizar uma função exportada e suas
      instruções; e, diante de uma falha, dizer se ela é de compilação, de
      instanciamento ou de execução, pelo que a mensagem nomeia.

  - id: comp:web/modulo-fora-do-navegador
    titulo: Módulo portátil fora do navegador
    rev: 1
    status: ativo
    descricao: >
      O mesmo binário rodando onde não há página: a interface de sistema que lhe dá
      arquivo, relógio e entrada padrão, o tempo de execução autônomo que o carrega, e
      o modelo de capacidades, em que o que não foi concedido na linha de comando não
      existe para o módulo.
    verificacao: >
      Rodar um módulo em tempo de execução autônomo fazendo-o ler e escrever um
      arquivo, e mostrar que o mesmo módulo falha quando o diretório não lhe é
      concedido — distinguindo essa falha de um erro de programação.
