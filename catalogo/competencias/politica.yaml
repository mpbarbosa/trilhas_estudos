# Primeira área de política do catálogo. As cinco competências são de leitura de
# teoria política e de crítica de explicação, não do nazismo nem do stalinismo: a
# verificação de cada uma se cobra sobre um regime, um movimento ou um argumento que
# não é o dos dois livros desta trilha, e a Europa de 1930 a 1945 é só onde ela as
# exercita. Foi critério de desenho — uma competência que só se verifica num corpus é
# assunto daquele corpus, não competência (docs/catalogo.md §2) —, e é o que permite
# que o próximo livro da área entre como etapa sem reescrever competência nenhuma.
versao_schema: 1
competencias:
  - id: comp:politica/dois-sentidos-de-liberdade
    titulo: Distinguir liberdade como ausência de vínculo e liberdade como capacidade
    rev: 1
    status: ativo
    descricao: >
      Dizer que alguém está livre de uma coerção não é dizer que ele tem o que fazer
      com a liberdade conquistada. A competência é separar os dois sentidos num caso
      concreto — o vínculo que caiu e a capacidade que não nasceu com a queda dele —
      e reconhecer o estado em que ganhar o primeiro produz insegurança em vez de
      autonomia. Sem isso, "mais liberdade" e "melhor" viram a mesma palavra.
    verificacao: >
      Dada uma situação documentada em que um vínculo de autoridade, tradição ou
      dependência se desfez — uma transição de regime, uma reforma de legislação
      trabalhista, a saída de alguém de uma instituição: dizer de que o sujeito ficou
      livre e para que ele ficou (ou não) capaz, nomeando o recurso material,
      cognitivo ou coletivo que falta para o segundo; e explicar por que, no caso, a
      perda do vínculo pode ser vivida como desamparo, sem concluir disso que o
      vínculo anterior era preferível.

  - id: comp:politica/psicologia-social-da-submissao
    titulo: Explicar adesão de massa a um regime de dominação
    rev: 1
    status: ativo
    descricao: >
      Por que gente comum adere, aplaude e colabora. A competência é dar conta da
      adesão por mecanismos nomeáveis — isolamento, insegurança, submissão a uma
      autoridade que promete sentido, conformismo, prazer na destruição — sem as duas
      saídas fáceis: a de que os aderentes foram enganados por propaganda e a de que
      eram patológicos. As duas isentam quem adere e não explicam quem resistiu nas
      mesmas condições.
    verificacao: >
      Dado um caso documentado de adesão coletiva a um regime ou movimento autoritário
      que não os estudados: nomear ao menos três mecanismos que a sustentam, dizendo
      em cada caso que parte da adesão ele explica e que parte fica fora; apontar o
      grupo social em que o caso se concentrou e o que o distingue dos que não
      aderiram; e refutar, com um fato datado do próprio caso, tanto a explicação por
      engano quanto a explicação por patologia.

  - id: comp:politica/anatomia-do-dominio-total
    titulo: Distinguir domínio total de tirania e de ditadura
    rev: 1
    status: ativo
    descricao: >
      Chamar de totalitário todo governo que reprime esvazia a palavra. A competência
      é operar o conceito pelos traços que o delimitam — movimento antes de Estado,
      ideologia com lei de movimento própria, duplicação de órgãos e indefinição
      deliberada de autoridade, polícia que persegue o inimigo objetivo e não o
      opositor, campo como laboratório de supressão da pessoa — e, com eles na mão,
      aceitar ou recusar a classificação de um regime, dizendo que traço falta.
    verificacao: >
      Dado um regime documentado que não os estudados: decidir se ele satisfaz o
      conceito de domínio total, percorrendo um a um os traços que o definem e dizendo
      quais estão presentes, quais estão ausentes e com que evidência; nomear o traço
      cuja ausência é decisiva, se houver; e dizer que diferença prática a
      classificação faz para prever o comportamento do regime — por exemplo se a
      repressão para quando a oposição cessa.

  - id: comp:politica/conceito-a-partir-de-material-historico
    titulo: Auditar um conceito político construído sobre material histórico
    rev: 1
    status: ativo
    descricao: >
      Teoria política séria se escreve sobre documento datado, e é por aí que ela se
      audita: que fatos o autor usa, que peso cada um aguenta, e onde o conceito
      passa a andar sozinho, longe do material que o produziu. A competência não é
      checar notas de rodapé — é dizer o que precisaria ser verdade no mundo para a
      afirmação se sustentar, e se o texto mostra isso.
    verificacao: >
      Dado um trecho de teoria política que afirma algo geral sobre um tipo de regime
      ou de movimento: separar as afirmações apoiadas em fato datado das apoiadas em
      interpretação do próprio autor; dizer, para a tese central, que evidência a
      confirmaria e que evidência a refutaria; e apontar uma passagem em que o
      conceito é aplicado a um caso que o material citado não cobre, dizendo que
      documento faltaria ali.

  - id: comp:politica/critica-de-explicacao-psicologica-da-politica
    titulo: Avaliar o salto entre explicação do indivíduo e explicação do coletivo
    rev: 1
    status: ativo
    descricao: >
      Explicar política por caráter, medo ou necessidade de autoridade é fecundo e
      escorrega fácil: o que vale para um sujeito não se soma até virar regime, e a
      propriedade de um grupo não se reparte de volta em cada membro. A competência é
      localizar o ponto em que o argumento troca de nível — indivíduo, grupo,
      instituição — e dizer o que ele precisaria mostrar para atravessar, incluindo no
      argumento que se está construindo.
    verificacao: >
      Dado um argumento que explica um fenômeno político por disposição psicológica:
      marcar em que passo ele muda de nível de análise; nomear a mediação que faria a
      passagem (organização, instituição, incentivo material, veículo de propaganda) e
      dizer se o argumento a exibe; apontar que fato do caso o argumento deixa sem
      explicar; e propor uma explicação concorrente, de outro nível, dizendo que
      evidência decidiria entre as duas.

# -------------------------------------------------------------------------
# trilha:politica/desinformacao-e-resistencia
#
# Sete competências acrescentadas em 2026-11-10, pela bibliografia de monografia que o
# estudante trouxe colada. Mesmo critério das cinco primeiras: a `verificacao` se cobra
# **fora** do corpus da trilha — qualquer dispositivo de vigilância, qualquer registro
# audiovisual contestado, qualquer movimento que surgiu ou não surgiu, qualquer regime
# que se diz fascista. O século XX europeu e a eleição contemporânea são só onde esta
# trilha as exercita.
#
# A trilha de 2026-11-05 (Arendt e Fromm) cobriu o **domínio total** e a **adesão**.
# Esta cobre o que fica do outro lado: o controle que se exerce sobre o que se pode
# saber, e o que as pessoas fazem quando não podem recusar em público. As competências
# não se sobrepõem por construção — `comp:politica/anatomia-do-dominio-total` classifica
# regime, `comp:politica/transcrito-oculto` lê o comportamento de quem vive sob ele —, e
# as duas trilhas se encontram só em `comp:politica/fascismo-como-processo`, que é a
# crítica da própria classificação por essência.
# -------------------------------------------------------------------------

  - id: comp:politica/controle-pela-linguagem-e-pelo-passado
    titulo: Reconhecer controle exercido sobre a linguagem e sobre o registro do passado
    rev: 1
    status: ativo
    descricao: >
      Um regime que reescreve o arquivo e estreita o vocabulário não está só mentindo:
      está retirando os meios de formular a objeção. A competência é identificar esse
      trabalho em material real — que palavra desapareceu, que registro foi corrigido,
      que contradição deixou de ser enunciável — e fazê-lo sem a inflação retórica que
      chama de orwelliano qualquer eufemismo oficial.
    verificacao: >
      Dado um caso documentado de alteração oficial de linguagem ou de registro —
      renomeação administrativa, correção de dado publicado, retirada de documento de
      arquivo, glossário imposto, remoção de página: dizer o que a alteração torna
      indizível ou inverificável, e para quem; nomear o que resta de rastro e por que via
      a mudança ainda é detectável; distinguir o caso do eufemismo burocrático comum,
      exibindo um eufemismo que **não** satisfaz a descrição e dizendo por quê; e apontar
      que condição material o controle precisa ter para funcionar (monopólio do arquivo,
      ausência de cópia independente, impunidade).

  - id: comp:politica/vigilancia-e-disciplina
    titulo: Analisar um dispositivo de vigilância pelo efeito disciplinar que produz
    rev: 1
    status: ativo
    descricao: >
      O efeito de um dispositivo de vigilância não está em quem ele pega, e sim no que
      ele faz com quem não sabe se está sendo visto: a conduta se ajusta sozinha, e a
      economia do poder fica barata. A competência é analisar um dispositivo por essa
      via — visibilidade desigual, incerteza do olhar, interiorização da regra — sem o
      uso do panóptico como metáfora decorativa para qualquer câmera.
    verificacao: >
      Dado um dispositivo real de observação de pessoas — ponto eletrônico, software de
      produtividade, prova vigiada, câmera de escola, catraca, aplicativo de entrega:
      descrever a distribuição de visibilidade (quem vê, quem é visto, quem sabe quando)
      e dizer que conduta ele induz em quem não foi punido; nomear o que o dispositivo
      mede e o que as pessoas passam a otimizar, com a divergência entre os dois;
      distinguir o efeito disciplinar da simples coleta de dados, exibindo uma coleta que
      **não** produz esse efeito; e dizer que mudança no dispositivo reduziria o efeito
      sem reduzir a informação que ele coleta.

  - id: comp:politica/prova-audiovisual-e-deep-fake
    titulo: Avaliar o estatuto de prova de um registro audiovisual contestado
    rev: 1
    status: ativo
    descricao: >
      Quando qualquer vídeo pode ter sido fabricado, o dano maior não é acreditar no
      falso: é a autoridade conveniente de poder negar o verdadeiro. A competência é
      raciocinar sobre o estatuto de prova de um registro — procedência, cadeia de
      custódia, corroboração independente, incentivo de quem o divulga e de quem o nega —
      e dizer o que a dúvida bem fundada autoriza concluir, que é menos do que os dois
      lados querem.
    verificacao: >
      Dado um registro audiovisual contestado e o contexto de sua circulação: listar o que
      se poderia verificar sobre ele e por que meio (procedência do arquivo, cadeia de
      custódia, fonte independente do mesmo evento, metadados, perícia) e dizer o que
      cada verificação decide e o que não decide; dizer que conclusão a incerteza
      restante autoriza, distinguindo "não autenticado" de "falso"; nomear quem se
      beneficia da autenticidade e quem se beneficia da dúvida; e dizer que regra
      institucional — de prova, de plataforma, de redação — mudaria o resultado, e a que
      custo.

  - id: comp:politica/transcrito-oculto
    titulo: Distinguir consentimento de conformidade pública sob dominação
    rev: 1
    status: ativo
    descricao: >
      Subordinado que não protesta em público não é subordinado que concorda: a
      conformidade é uma atuação exigida pela situação, e a recusa existe num registro
      que o poder não escuta — anonimato, boato, sabotagem miúda, ironia, deferência
      exagerada. A competência é ler os dois registros e resistir às duas conclusões
      apressadas: a de que há consentimento e a de que toda deferência esconde revolta.
    verificacao: >
      Dada uma relação de dominação documentada que não a estudada — trabalho, prisão,
      escola, casa, clientelismo rural: descrever o que o registro público exige dos
      subordinados e por que sanção; apontar duas práticas do registro oculto e dizer
      por que evidência se sabe delas e que risco correm seus autores; dizer que
      evidência distinguiria, naquele caso, conformidade de adesão genuína; e explicar
      por que a passagem do oculto ao aberto é rara e o que no caso a tornaria possível.

  - id: comp:politica/estrutura-de-oportunidade-politica
    titulo: Explicar o surgimento — ou a ausência — de um movimento pela estrutura de oportunidade
    rev: 1
    status: ativo
    descricao: >
      Movimento não nasce de quantidade de sofrimento: nasce quando o arranjo de
      autoridade se abre, há organização já montada para aproveitar a brecha e um grupo
      se reconhece capaz de agir. A competência é usar esse esquema em caso de surgimento
      **e** em caso de ausência — explicar por que não houve movimento onde o sofrimento
      era igual é o teste que a tese precisa passar.
    verificacao: >
      Dados dois casos comparáveis de privação documentada, num dos quais surgiu um
      movimento e no outro não: nomear o que mudou na estrutura de autoridade do primeiro
      (eleição, cisão de elite, guerra, decisão judicial, pressão externa) e o que não
      mudou no segundo; identificar as organizações preexistentes que serviram de base em
      cada caso; dizer o que fez (ou não) o grupo se considerar capaz de agir; e apontar
      um fato que o esquema deixa sem explicar, dizendo que explicação concorrente o
      cobriria.

  - id: comp:politica/fascismo-como-processo
    titulo: Operar o fascismo como processo, e não como essência
    rev: 1
    status: ativo
    descricao: >
      Procurar a definição de fascismo por lista de atributos ideológicos é o caminho que
      não chega: os movimentos contradisseram seus próprios programas sem perder nada. A
      competência é classificar por processo — como o movimento nasce, como se enraíza,
      como chega ao poder por aliança com conservadores que pensam controlá-lo, como
      exerce o poder e como radicaliza — e dizer, para um caso, em que etapa ele parou.
    verificacao: >
      Dado um movimento ou regime que não os estudados: situá-lo nas etapas do processo
      (criação, enraizamento, chegada ao poder, exercício do poder, radicalização),
      dizendo em qual ele parou e com que evidência; nomear os aliados conservadores que
      o viabilizaram, se houve, e o que eles esperavam obter; dizer que atributo do
      programa o próprio movimento contrariou na prática, e o que isso mostra sobre
      classificar por ideologia; e decidir se a classificação de fascista se sustenta,
      nomeando a etapa cuja ausência é decisiva.

  - id: comp:politica/ruptura-institucional-por-via-legal
    titulo: Reconhecer mudança de forma de governo conduzida por via legal
    rev: 1
    status: ativo
    descricao: >
      A ruptura que importa raramente chega de fardado na tribuna: chega por voto de
      emergência, delegação de poderes, prorrogação e reforma aprovada no rito. A
      competência é acompanhar o procedimento passo a passo, dizer em que ponto o
      conteúdo contradiz o limite que a própria ordem se deu, e separar o que é
      inconstitucional do que é apenas intolerável — sem tratar toda derrota política
      como golpe.
    verificacao: >
      Dado um processo documentado de mudança institucional conduzido pelas formas
      vigentes — emenda, lei de emergência, delegação legislativa, interpretação de
      corte: reconstituir os passos e nomear quem concedeu o quê em cada um; dizer que
      limite material da ordem anterior o resultado contradiz, se contradiz, e onde esse
      limite está escrito; distinguir a mudança que a ordem admite da que ela proíbe,
      exibindo uma reforma profunda que **não** rompe o limite; e dizer que mecanismo
      poderia ter interrompido o processo e por que não interrompeu.
