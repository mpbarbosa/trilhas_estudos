# etapa:cinema/o-esteta-e-o-culto-da-beleza — etapa opcional acrescentada em
# 2026-11-10 a trilha:cinema/estetizacao-da-politica (ver o arquivo daquela trilha).
# A competência está aqui, e não entre as nove acima, porque é dela que se trata: o
# esteticismo como programa de vida, anterior ao regime que o herdaria.
# -------------------------------------------------------------------------

  - id: comp:cinema/esteticismo-como-programa
    titulo: Ler o esteticismo como programa — a vida tratada como obra de arte
    rev: 1
    status: ativo
    descricao: >
      Antes de ser traço de regime, a subordinação de tudo à forma foi programa de vida
      privada: a existência conduzida como composição, o gosto como critério último, a
      indiferença moral apresentada não como falha mas como refinamento. A competência é
      descrever esse programa num texto que o professa e dizer o que ele faz com o outro
      — e separar isso da acusação retrospectiva, que lê todo esteta como fascista em
      potencial.
    verificacao: >
      Dado um texto literário ou um documento que professe o culto da forma e do gosto:
      reconstituir o programa — que critérios substituem os morais, que prazeres contam,
      que esforço a composição da própria vida exige — citando as passagens; dizer o que
      o programa reserva às outras pessoas do texto, com a cena que o mostra; apontar
      onde o próprio texto cobra o preço do programa, se cobra; e dizer o que o
      esteticismo tem em comum com a política estetizada e o que o separa dela, recusando
      a leitura do primeiro como anúncio necessário da segunda.
