# Primeira área de cinema do catálogo. As cinco competências são de leitura de filme
# e de história de uma forma cultural, não do primeiro cinema: a verificação de cada
# uma se cobra sobre um filme ou um período que não é o da trilha de hoje, e o cinema
# de 1895 a 1915 é só onde esta trilha as exercita. Foi critério de desenho — uma
# competência que só se verifica num corpus é assunto daquele corpus, não competência
# (docs/catalogo.md §2) —, e é o que permite que o próximo livro da área entre como
# etapa sem reescrever competência nenhuma.
versao_schema: 1
competencias:
  - id: comp:cinema/leitura-do-filme
    titulo: Leitura de uma sequência de filme — plano, movimento e montagem
    rev: 1
    status: ativo
    descricao: >
      Ler o que está na tela antes de contar a história que ela narra: onde começa e
      acaba cada plano, que escala e que movimento de câmera o compõem, que relação o
      corte estabelece entre dois planos vizinhos, e de que lugar o filme pede que se
      olhe. O resumo do argumento é justamente o que esta competência não aceita como
      resposta.
    verificacao: >
      Diante de uma sequência de três a cinco minutos de um filme que não se viu
      antes: decupar os planos, nomear a escala e o movimento de câmera de cada um,
      dizer em cada corte que relação a montagem estabelece entre os dois planos, e
      explicar o que o ponto de vista escolhido mostra e o que ele deixa fora do
      quadro — sem recorrer ao resumo do argumento.

  - id: comp:cinema/cinema-como-industria-e-ideologia
    titulo: Crítica da aparência de neutralidade do filme
    rev: 1
    status: ativo
    descricao: >
      Um filme não é janela: alguém escolheu de onde a câmera olha, quem fala, o que
      fica fora do quadro, quanto se gastou e para que público. A competência é
      desfazer a transparência — ligar o efeito de registro fiel às escolhas de
      linguagem e às condições de produção que o fabricam, sem transformar isso em
      suspeita genérica de que todo filme mente.
    verificacao: >
      Diante de um filme de ficção: listar três escolhas que o fazem parecer registro
      transparente do mundo — enquadramento, ponto de vista, decupagem, elenco,
      trilha — e dizer, em cada caso, o que fica fora do quadro por causa dela;
      relacionar ao menos duas dessas escolhas a condições de produção (quem
      financiou, para que público, em que regime de exibição); e apontar uma
      afirmação sobre o mundo que o filme sustenta de fato, dizendo o que nele a
      sustenta.

  - id: comp:cinema/historiografia-do-primeiro-cinema
    titulo: Periodização do primeiro cinema — espetáculo, narração e domesticação
    rev: 1
    status: ativo
    descricao: >
      O cinema das duas primeiras décadas não é cinema clássico mal feito. Tem regime
      próprio — exibição de atração, olhar para a lente, autonomia do quadro — e a
      competência é situar um filme nesse regime pelos traços que ele mostra, em vez
      de medi-lo pela narrativa que vem depois.
    verificacao: >
      Diante de um filme anterior a 1915 e de sua data: situá-lo na periodização do
      primeiro cinema e nomear os traços que sustentam a posição — atração exibida
      frente à câmera, olhar dirigido à lente, continuidade construída por corte,
      condução do olhar do espectador, lugar e público da exibição —; e apontar ao
      menos um traço do filme que contraria a leitura do período como evolução linear
      rumo à narrativa clássica.

  - id: comp:cinema/cinema-e-modernidade
    titulo: Relação entre uma forma cultural e a experiência moderna
    rev: 1
    status: ativo
    descricao: >
      A tese de que o cinema deu forma à percepção moderna — choque, multidão,
      vitrine, velocidade — é fértil e fácil de usar mal: duas formas que se parecem
      não provam que uma produziu a outra. A competência inclui classificar o próprio
      argumento, dizendo onde ele se apoia em documento e onde é analogia.
    verificacao: >
      Dado um fenômeno da vida urbana do fim do século XIX — panorama, vitrine de loja
      de departamentos, bulevar, viagem de trem, museu de cera, jornal ilustrado — e um
      filme do mesmo período: dizer que regime de percepção os dois compartilham e em
      que diferem; e separar, no próprio argumento, o que se apoia em evidência
      documentada (público, local de exibição, imprensa da época) do que é analogia
      entre formas, dizendo que documento faltaria para converter a analogia em tese.

  - id: comp:cinema/contexto-historico-de-uma-forma-cultural
    titulo: Situar uma forma cultural na história econômica e política de seu período
    rev: 1
    status: ativo
    descricao: >
      Uma técnica nova não explica a forma cultural que nasce com ela: faltam o
      mercado que a financia, a cidade que lhe dá público, o império que a distribui e
      a política que a tolera. A competência é nomear essas condições para um período
      datado, com o alcance de cada uma, e resistir à história contada de trás para
      frente.
    verificacao: >
      Dada uma novidade cultural e as três décadas em que ela aparece: nomear as
      condições econômicas, políticas e sociais do período que a tornaram possível —
      mercado, técnica, público urbano, cidade, império — dizendo em cada caso o que
      ela explica e o que não explica; e refutar, com um fato datado do próprio
      período, a afirmação de que a novidade era inevitável.

# -------------------------------------------------------------------------
# trilha:cinema/estetizacao-da-politica
#
# Cinco competências acrescentadas em 2026-11-05, pela bibliografia que o estudante
# trouxe (Benjamin, Kracauer, Sontag, Speer e o filme de Riefenstahl). Valem o mesmo
# critério das cinco primeiras: a `verificacao` se cobra fora do corpus da trilha —
# qualquer regime de reprodução, qualquer espetáculo de massa, qualquer filme de
# encomenda, qualquer memória de implicado. O comício de Nuremberg é só onde esta
# trilha as exercita, e é o que permite que o próximo título da área entre como etapa
# sem reescrever competência.
#
# `comp:cinema/leitura-de-memoria-de-implicado` é crítica de fonte, não cinema, e está
# aqui pelo mesmo motivo que `comp:cinema/contexto-historico-de-uma-forma-cultural`:
# `area` é organizacional, não semântica (docs/catalogo.md §3). O acoplamento real está
# em `requires`/`teaches`.
# -------------------------------------------------------------------------

  - id: comp:cinema/reprodutibilidade-e-aura
    titulo: Efeito da reprodução técnica sobre o modo de existência de uma obra
    rev: 1
    status: ativo
    descricao: >
      A tese de que a reprodução técnica destitui a obra do seu aqui-e-agora, e troca
      valor de culto por valor de exposição, é fácil de repetir e difícil de usar: sem
      data e sem técnica na mão, ela vira nostalgia da obra única. A competência é
      dizer, para uma obra e um regime de reprodução determinados, o que muda no modo
      de ela existir — e separar o que é perda do que é só deslocamento.
    verificacao: >
      Dada uma obra e um regime de reprodução determinado — gravura, fotografia,
      disco, filme, transmissão, arquivo digital: dizer o que a reprodução subtrai
      daquela obra e o que ela torna possível; distinguir nela valor de culto de valor
      de exposição, nomeando em que prática concreta cada um se realiza; e dizer que
      parte do próprio argumento se apoia em traço técnico datado e que parte seria
      nostalgia da obra única, apontando um fato do próprio regime que a contradiga.

  - id: comp:cinema/estetizacao-da-politica
    titulo: Reconhecer a estetização da política num evento ou numa obra
    rev: 1
    status: ativo
    descricao: >
      "O fascismo estetiza a política" virou palavra de ordem, e como insulto não
      distingue nada: todo governo cuida da própria imagem. A competência é cobrar da
      tese o que ela de fato afirma — que procedimentos de forma substituem a decisão
      política pela contemplação da própria massa — e mostrar onde isso se vê no
      material, em vez de deduzi-lo do regime que produziu a obra.
    verificacao: >
      Dado um evento político montado para a imagem — desfile, comício, posse,
      cerimônia militar, propaganda de campanha, inauguração — e o registro dele:
      nomear os procedimentos que convertem política em espetáculo (massa enquadrada
      como forma, simetria, liturgia, lugar do chefe no quadro, ausência de
      contraditório) e dizer o que cada um subtrai de deliberação; e distinguir a tese
      da estetização da acusação genérica de propaganda, exibindo um evento político
      cuidadoso da própria imagem que **não** a satisfaz, e dizendo por quê.

  - id: comp:cinema/critica-do-espetaculo-de-massa
    titulo: Ler a multidão como forma — espetáculo de massa e organização do trabalho
    rev: 1
    status: ativo
    descricao: >
      Kracauer olha as pernas alinhadas da revista de music-hall e vê a esteira da
      fábrica: a massa não comparece como povo nem como classe, mas como material de
      um ornamento que o próprio público admira sem se reconhecer nele. O risco da
      leitura é descambar em desprezo pela plateia. A competência mantém a análise na
      forma e na relação dela com a produção do período.
    verificacao: >
      Dado um espetáculo de massa — revista, abertura de estádio, desfile, coreografia
      esportiva, show de intervalo — e a década em que ocorre: descrever a figura que
      os corpos compõem e por que procedimento ela se sustenta; relacioná-la à
      organização do trabalho e da produção daquele período, dizendo o que a relação
      explica e o que não explica; e dizer o que o público vê de si naquela figura,
      sem converter a análise em condenação moral de quem assiste.

  - id: comp:cinema/filme-de-encomenda-politica
    titulo: Ler um filme feito a serviço de um poder
    rev: 1
    status: ativo
    descricao: >
      Diante de um filme de encomenda política as duas saídas fáceis se equivalem:
      descartá-lo como "só propaganda", o que dispensa de olhar, e admirar-lhe a forma
      como se a função fosse acidente. A competência é a terceira — separar o que o
      filme registra do que ele encena, e mostrar por que procedimento ele funciona
      sobre quem assiste.
    verificacao: >
      Dado um filme feito por encomenda de um poder — regime, partido, governo,
      empresa, campanha — e a data dele: separar o que ele registra do que foi encenado
      para a câmera, dizendo em cada caso o que sustenta a separação; nomear os
      procedimentos que produzem o efeito pretendido (escala, angulação, montagem, som
      e música, recusa de contraplano, o que fica fora do quadro); e dizer o que o
      filme pede que o espectador aceite, sem recorrer nem ao descarte como mera
      propaganda nem ao elogio da forma separado da função.

  - id: comp:cinema/leitura-de-memoria-de-implicado
    titulo: Ler memória de quem esteve do lado do poder
    rev: 1
    status: ativo
    descricao: >
      A memória de um implicado é fonte e peça de defesa no mesmo volume: sabe coisas
      que nenhum documento externo sabe — procedimento, bastidor, logística, hierarquia
      vista de dentro — e tem interesse direto na conclusão do leitor. A competência é
      usar a primeira coisa sem engolir a segunda, e dizer onde a prova externa é
      indispensável.
    verificacao: >
      Dada uma memória escrita por alguém implicado num regime ou numa organização sob
      acusação: identificar as operações de autoexculpação do texto — o técnico que
      apenas executava, a responsabilidade deslocada para um ausente, o enquadramento
      estético do que foi crime, a ignorância alegada — citando a passagem de cada uma;
      dizer para que o texto é boa evidência e sobre o que ele é parte interessada; e,
      para uma afirmação determinada dele, nomear que documento externo a confirmaria
      ou a refutaria.

# -------------------------------------------------------------------------
# trilha:cinema/analise-filmica-de-uma-saga
#
# Nove competências acrescentadas em 2026-11-10, pela bibliografia de monografia que o
# estudante trouxe colada. Valem o mesmo critério das dez primeiras: a `verificacao` se
# cobra **fora** do corpus da trilha — qualquer filme de ficção, qualquer narrativa de
# viagem do herói, qualquer estilo histórico, qualquer leitura de obra popular feita por
# outra disciplina. A saga que originou a lista é só onde esta trilha as exercitaria, e é
# o que permite que o próximo título da área entre como etapa sem reescrever competência.
#
# `comp:cinema/filme-como-fonte-historica` e `comp:cinema/industria-cultural-e-contestacao`
# são de ofício de historiador, não de leitura de filme, e estão aqui pelo mesmo motivo
# que `comp:cinema/leitura-de-memoria-de-implicado`: `area` é organizacional, não
# semântica (docs/catalogo.md §3). O acoplamento real está em `requires`/`teaches`.
#
# **Por que `comp:cinema/analise-formal-do-filme` não é `comp:cinema/leitura-do-filme`
# com nível maior:** a primeira é o filme inteiro como sistema — forma narrativa e os
# quatro sistemas de estilo articulados —, a segunda é a sequência decupada. Quem decupa
# bem uma sequência não descreve por isso a forma do filme todo; e a verificação de uma
# não cobre a da outra. A etapa de Bordwell e Thompson exige a segunda e desenvolve as
# duas, que é o que diz como elas se encaixam.
# -------------------------------------------------------------------------

  - id: comp:cinema/analise-formal-do-filme
    titulo: Análise formal de um filme inteiro — forma narrativa e sistemas de estilo
    rev: 1
    status: ativo
    descricao: >
      Descrever um filme inteiro como sistema, e não como sucessão de momentos marcantes:
      que princípio de forma organiza o todo, como a narração distribui o que o
      espectador sabe e quando, e como mise-en-scène, fotografia, montagem e som
      colaboram ou brigam entre si. O erro que a competência exclui é o inventário —
      listar recursos técnicos corretamente nomeados sem dizer o que cada um faz naquele
      filme.
    verificacao: >
      Diante de um longa-metragem de ficção que não se viu antes: descrever o princípio
      de forma que organiza o todo e localizar os pontos em que ele se firma e em que se
      rompe; dizer, para dois momentos de informação decisiva, o que a narração dá ao
      espectador que os personagens não têm (ou o contrário) e que efeito isso produz;
      para uma cena escolhida, mostrar como mise-en-scène, fotografia, montagem e som
      concorrem para o mesmo efeito, nomeando um ponto em que um deles o contraria; e
      dizer que parte da análise mudaria se o filme tivesse outro final.

  - id: comp:cinema/som-no-cinema
    titulo: Escuta de um filme — som como portador de sentido e música narrativa
    rev: 1
    status: ativo
    descricao: >
      O som do cinema é o que menos se percebe e mais se obedece: ele diz onde a cena
      está, quanto tempo ela dura, o que a imagem não mostra e o que o espectador deve
      sentir sem perceber que lhe disseram. A competência é escutar o filme separando o
      que vem da imagem do que o som acrescenta — e resistir às duas saídas fáceis,
      tratar a trilha como ilustração do que já se via e tratar toda música como
      manipulação.
    verificacao: >
      Diante de uma sequência de filme com trilha sonora, assistida com som e depois sem
      som: dizer o que o som acrescenta que a imagem não sustenta sozinha — espaço,
      duração, fora de campo, atribuição de ponto de escuta — e o que ele subtrai de
      ambiguidade; classificar cada elemento sonoro como diegético ou não, e apontar um
      em que a classificação é discutível, dizendo por quê; nomear a função que a música
      cumpre ali (unificar o corte, datar a cena, antecipar o desfecho, marcar um
      personagem) e dizer em que a cena mudaria com outra música; e distinguir essa
      análise da afirmação genérica de que a trilha manipula o espectador.

  - id: comp:cinema/modo-melodramatico
    titulo: Reconhecer o modo melodramático numa narrativa
    rev: 1
    status: ativo
    descricao: >
      "Melodramático" é usado como insulto — exagerado, piegas — e assim não distingue
      nada. Como modo, ele tem procedimentos nomeáveis: moral exteriorizada em gesto e
      em quadro, virtude que precisa ser reconhecida publicamente, mudez expressiva,
      excesso como forma de dizer o que o mundo dessacralizado já não enuncia. A
      competência é operá-lo como descrição, com o custo que ele cobra da narrativa.
    verificacao: >
      Dada uma narrativa (filme, romance, série, peça) que não a estudada: decidir se ela
      opera no modo melodramático, percorrendo os procedimentos que o definem e dizendo
      quais estão presentes, com a passagem ou a cena que sustenta cada um; nomear o que
      a narrativa ganha em legibilidade moral e o que perde em ambiguidade por causa
      deles; distinguir o modo do juízo de valor, exibindo uma narrativa melodramática
      que se considere boa e uma não melodramática que se considere ruim; e apontar uma
      cena em que o excesso faz trabalho que o diálogo não faria.

  - id: comp:cinema/estrutura-mitica-da-narrativa
    titulo: Auditar a leitura mítica de uma narrativa
    rev: 1
    status: ativo
    descricao: >
      O monomito explica tanto que quase não se refuta: com etapas suficientemente
      largas, toda história vira jornada do herói. A competência não é aplicar o
      esquema — é aplicá-lo e depois cobrar-lhe a conta: que episódios ele ilumina, que
      episódios ele força, e que diferença entre duas narrativas ele apaga. Sem esse
      segundo movimento, a leitura mítica é descrição que não exclui nada.
    verificacao: >
      Dada uma narrativa que não a estudada: mapear nela as etapas do percurso do herói,
      citando o episódio que preenche cada uma e marcando as que ficam vazias ou
      preenchidas à força; apontar dois traços decisivos da narrativa que o esquema não
      capta e dizer que leitura os captaria; dizer que narrativa do mesmo gênero o
      esquema **não** descreveria, e por quê; e separar, na própria leitura, o que é
      estrutura encontrada no texto do que é molde imposto a ele.

  - id: comp:cinema/efeito-especial-e-sublime
    titulo: Ler o efeito especial como atração e como experiência do sublime
    rev: 1
    status: ativo
    descricao: >
      O efeito especial costuma ser julgado por duas réguas igualmente cegas: se
      "convence" — a régua do realismo — ou se "envelheceu" — a régua da técnica. A
      competência é a terceira leitura: o efeito como momento em que a narrativa para e
      se oferece à contemplação, e a escala desmedida como experiência de sublime
      fabricado, com o lugar que ela reserva ao espectador.
    verificacao: >
      Dada uma sequência de efeito visual de um filme, com sua data e a técnica
      empregada: dizer onde a narrativa se suspende e o que é oferecido à contemplação em
      seu lugar; descrever como a escala e a duração do plano situam o corpo do
      espectador diante do que se mostra; distinguir o juízo sobre o efeito do juízo
      sobre o realismo dele, exibindo um efeito tecnicamente datado que continua
      funcionando e um tecnicamente impecável que não funciona; e relacionar o efeito à
      condição industrial que o produziu (custo, prazo, publicidade do próprio efeito).

  - id: comp:cinema/heranca-de-um-estilo-historico
    titulo: Rastrear a herança de um estilo histórico num filme posterior
    rev: 1
    status: ativo
    descricao: >
      Dizer que um filme "é expressionista" porque tem sombra dura é o tipo de filiação
      que não custa nada e não prova nada. A competência é tratar a herança como
      afirmação histórica sujeita a prova: que traços de forma migraram, por que via
      material eles migraram — pessoas, estúdios, manuais, cópias em circulação — e que
      semelhanças são convergência independente.
    verificacao: >
      Dados um estilo histórico datado e um filme posterior que não o estudado: nomear
      três traços de forma do estilo e dizer, para cada um, se o filme o apresenta, com a
      cena que o mostra; propor a via material da transmissão (emigração de técnicos,
      escola, distribuição, manual, remake) e dizer que documento a confirmaria;
      identificar uma semelhança que se explica melhor por convergência independente ou
      por um terceiro intermediário; e dizer o que a filiação explica no filme que a
      leitura sem ela não explicaria.

  - id: comp:cinema/filme-como-fonte-historica
    titulo: Usar um filme como fonte para a história de seu tempo
    rev: 1
    status: ativo
    descricao: >
      Um filme de época é fonte ruim sobre a época que representa e fonte boa sobre a
      época que o fez — e isso vale também para o filme que não fala de história
      nenhuma. A competência é extrair dele o que ele testemunha sem querer (o que podia
      ser dito, mostrado, financiado e exibido naquele ano) e distinguir isso do que ele
      afirma de propósito, evitando a leitura do filme como espelho da sociedade.
    verificacao: >
      Dado um filme de ficção com data e país de produção, e uma pergunta histórica sobre
      aquele período: dizer sobre o que o filme é boa fonte e sobre o que não é, com a
      razão em cada caso; extrair dele duas evidências involuntárias — o que era
      representável, o que era censurável, que público se pressupõe, que consenso se
      dispensa de explicar — e dizer que outra fonte confirmaria cada uma; separar a
      representação que o filme faz do período representado do testemunho que ele dá do
      período em que foi feito; e refutar, com um fato datado, a leitura do filme como
      reflexo direto da mentalidade de seu público.

  - id: comp:cinema/industria-cultural-e-contestacao
    titulo: Explicar como uma indústria cultural absorve a contestação de sua época
    rev: 1
    status: ativo
    descricao: >
      Uma indústria cultural que se renova com a linguagem de quem a contesta não está
      nem capitulando nem sendo generosa: está resolvendo um problema de público e de
      custo. A competência é descrever esse movimento pelos dois lados — o que a
      contestação consegue inscrever na obra e o que a absorção lhe retira — sem a
      narrativa heroica da geração que mudou tudo nem a tese de que recuperação comercial
      anula qualquer conteúdo.
    verificacao: >
      Dado um período de renovação de uma indústria cultural que não o estudado — editora,
      gravadora, estúdio, televisão, plataforma — e um movimento de contestação
      contemporâneo dele: nomear as condições econômicas e demográficas que abriram a
      indústria àquela linguagem; apontar duas coisas que a contestação inscreveu nas
      obras e duas que a absorção neutralizou, com a obra que mostra cada uma; dizer o
      que aconteceu com os autores do movimento depois, e com os que ficaram fora; e
      refutar, com um fato datado, tanto o relato da ruptura total quanto o da pura
      recuperação comercial.

  - id: comp:cinema/leitura-critica-de-uma-saga
    titulo: Avaliar leituras de uma obra popular feitas por outras disciplinas
    rev: 1
    status: ativo
    descricao: >
      Filosofia, direito, teologia e ciência política leem obra popular, e o gênero tem
      um vício próprio: a obra entra como ilustração de uma tese que o autor já tinha, e
      qualquer episódio serve porque nada do texto pode contrariá-la. A competência é
      julgar a leitura pelo que ela arrisca — que detalhe da obra a sustenta, que detalhe
      a complicaria, e o que ela afirma sobre a obra que não se poderia afirmar sem ela.
    verificacao: >
      Dado um texto acadêmico ou crítico que lê uma obra popular à luz de outra
      disciplina: reconstituir a tese e dizer que evidência da obra ela cita; apontar um
      episódio ou detalhe da obra que a complica, e dizer se o texto o enfrenta ou o
      ignora; decidir se a obra é objeto ou ilustração — se a tese sobreviveria intacta
      com outra obra no lugar — e sustentar a decisão; e dizer uma coisa que o texto
      ensina sobre a obra e uma que ele ensina apenas sobre a disciplina de quem o
      escreveu.

