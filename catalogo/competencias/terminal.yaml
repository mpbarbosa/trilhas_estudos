# Área nova: `terminal`. O emulador de terminal fica fora das áreas existentes de
# propósito. Ele é meio sistema operacional (pseudoterminal, sinais, grupo de
# processos), meio renderizador de texto (Unicode em grade, atlas de glifos) e meio
# implementação de protocolo (ECMA-48 e a linhagem DEC) — e `area` é organizacional,
# não semântica (docs/catalogo.md §3), então o que decide é onde o autor vai procurar,
# não de qual disciplina o assunto descende (ADR-0017).
#
# A única competência tomada de outra área é `comp:so/linha-de-comando`, pela etapa
# avulsa de catalogo/etapas/avulsas.yaml (ADR-0010): quem vai escrever a ponta de
# escrita de um pseudoterminal precisa primeiro saber, do lado de fora, quem cria cada
# processo e para onde vai cada descritor.
versao_schema: 1
competencias:
  - id: comp:terminal/protocolo-de-controle
    titulo: O protocolo de controle do terminal
    rev: 1
    status: ativo
    descricao: >
      As sequências que governam um terminal — controles C0 e C1, CSI, OSC, DCS e APC,
      atributos SGR, modos privados DEC — na linhagem que vai do VT100 ao xterm, e onde
      cada uma está definida: a ECMA-48, a documentação da DEC e as convenções do xterm.
    verificacao: >
      Diante de um despejo de bytes com atributos SGR, movimento de cursor, troca para
      a tela alternativa e um OSC terminado por BEL, dizer o que cada sequência faz e em
      qual das três fontes ela está definida; e explicar por que `ESC [` e o byte C1
      único são a mesma introdução de sequência de controle.

  - id: comp:terminal/analisador-de-sequencias
    titulo: Analisador de sequências de controle
    rev: 1
    status: ativo
    descricao: >
      A máquina de estados do analisador DEC/ANSI — estados, transições, acumulação de
      parâmetros e intermediários, e o tratamento de entrada malformada — como se
      implementa e por que ela é uma máquina de estados e não uma expressão regular.
    verificacao: >
      Implementar a máquina de estados do analisador DEC/ANSI e demonstrá-la em três
      entradas hostis: sequência interrompida por CAN no meio, parâmetro com mais
      dígitos que o limite, e OSC que nunca recebe terminador. Para cada uma, dizer em
      que estado a máquina para e por que não há travamento nem leitura fora de faixa.

  - id: comp:terminal/modelo-de-tela
    titulo: Modelo de tela, rolagem e redimensionamento
    rev: 1
    status: ativo
    descricao: >
      A grade de células como estrutura de dados: atributos por célula, região de
      rolagem, buffer de histórico, tela alternativa, envoltório automático de linha, e
      o que o redimensionamento faz com o texto já escrito.
    verificacao: >
      Para uma grade de 80 por 24 com histórico, dizer o que acontece ao escrever na
      última coluna com o envoltório automático ligado e desligado, o que a tela
      alternativa preserva, e o que o redimensionamento para 40 colunas faz com uma
      linha de 100 caracteres — distinguindo truncar de reconstituir a linha.

  - id: comp:terminal/pty-e-controle-de-trabalho
    titulo: Pseudoterminal, sinais e controle de trabalho
    rev: 1
    status: ativo
    descricao: >
      O par mestre/escravo do pseudoterminal, a disciplina de linha do núcleo, modo
      canônico e modo cru, eco, o grupo de processos em primeiro plano, os sinais que a
      disciplina gera, e a propagação de dimensões da janela.
    verificacao: >
      Abrir um pseudoterminal, executar um shell nele e demonstrar três coisas: que
      `Ctrl-C` chega como SIGINT ao grupo de processos em primeiro plano e não ao
      emulador, qual lado do par faz eco em modo canônico e qual faz em modo cru, e que
      redimensionar a janela gera SIGWINCH com as dimensões novas.

  - id: comp:terminal/codificacao-de-entrada
    titulo: Codificação de teclado e de mouse
    rev: 1
    status: ativo
    descricao: >
      Como tecla e clique viram bytes: a codificação legada e suas ambiguidades, as
      extensões `modifyOtherKeys` e CSI-u, o protocolo de teclado do kitty, os modos de
      relato de mouse, colagem entre marcas, e a composição por método de entrada —
      tecla morta, sequência de composição e pré-edição —, que acontece antes de existir
      byte para enviar.
    verificacao: >
      Para `Ctrl-Shift-Enter`, mostrar o que o terminal envia em três regimes — o
      legado, `modifyOtherKeys` e o protocolo de teclado do kitty — e dizer qual
      ambiguidade do regime legado cada um dos outros resolve; repetir o exercício para
      um clique com `Shift` no modo de relato SGR. E, com um método de entrada ativo,
      digitar um ideograma por composição, mostrando onde a pré-edição aparece e em que
      momento o byte chega ao programa — que não é quando a tecla é pressionada.

  - id: comp:terminal/texto-em-celulas
    titulo: Texto Unicode numa grade de células
    rev: 1
    status: ativo
    descricao: >
      O conflito entre texto Unicode e grade de largura fixa: largura leste-asiática,
      agrupamento de grafemas, emoji com seletor e com ZWJ, conformação de texto,
      ligaduras e substituição de fonte quando o glifo não está na fonte pedida.
    verificacao: >
      Dizer quantas células ocupam, e por quê, um ideograma CJK, um emoji com seletor de
      variação, uma família de emoji formada por ZWJ e um `e` seguido de acento
      combinante; apontar qual anexo do Unicode decide cada caso e em que esses casos a
      `wcwidth` da biblioteca C discorda do que o terminal precisa.

  - id: comp:terminal/renderizacao-de-terminal
    titulo: Renderização e latência de um terminal
    rev: 1
    status: ativo
    descricao: >
      Desenhar a grade rápido: atlas de glifos em textura, rasterização e cache,
      desenho em lote, controle de dano, sincronismo de quadro, e a diferença entre
      vazão (rolar um arquivo grande) e latência (a tecla até o pixel).
    verificacao: >
      Descrever o caminho de um caractere até o pixel num renderizador por atlas de
      glifos — rasterizar, guardar, achar as coordenadas de textura, desenhar em lote —
      e medir com instrumento a latência entre tecla e pixel no próprio emulador,
      dizendo qual etapa domina o número medido.

  - id: comp:terminal/integracao-com-o-shell
    titulo: Integração entre terminal, shell e ambiente
    rev: 1
    status: ativo
    descricao: >
      O que o terminal e o shell combinam por sequência OSC — diretório corrente,
      hiperlink, área de transferência, marcas semânticas de prompt e de saída de
      comando — mais o lado do ambiente: `TERM`, terminfo e como o sistema escolhe o
      terminal padrão.
    verificacao: >
      Fazer o shell marcar início de prompt, de comando e de saída com OSC 133 e usar as
      marcas para pular de um comando ao anterior; explicar o que OSC 7, OSC 8 e OSC 52
      acrescentam, e por que aceitar OSC 52 sem restrição é decisão de segurança e não
      só de recurso.

  - id: comp:terminal/conformidade-de-emulador
    titulo: Conformidade de um emulador, demonstrada por teste
    rev: 1
    status: ativo
    descricao: >
      Provar comportamento em vez de afirmá-lo: as suítes `vttest` e `esctest`, o que
      cada uma cobre, como se lê um caso que falha até a sequência que o causa, e o que
      fazer quando o teste e a especificação discordam.
    verificacao: >
      Rodar `vttest` e um subconjunto do `esctest` contra um emulador em construção,
      reduzir um caso que falha à sequência mínima que o reproduz, e decidir se a falha é
      do emulador ou expectativa do teste — justificando pela especificação, não pelo
      comportamento de outro emulador.

  - id: comp:terminal/acessibilidade-de-terminal
    titulo: Acessibilidade de um emulador de terminal
    rev: 1
    status: ativo
    descricao: >
      A grade de células exposta à tecnologia assistiva: a árvore de acessibilidade que
      o sistema espera, o que nela representa texto que rola e cursor que se move, e por
      que um emulador que desenha a própria janela é opaco ao leitor de tela até
      construí-la.
    verificacao: >
      Com um leitor de tela em execução, demonstrar que a saída de um comando é lida,
      que o movimento do cursor é anunciado, e que a troca para a tela alternativa não
      deixa o leitor preso no conteúdo anterior; e explicar por que nada disso vem de
      graça num emulador desenhado por GPU, ao contrário de um que rode dentro de uma
      webview e receba a árvore pronta.

  - id: comp:terminal/arquitetura-de-emulador
    titulo: Arquitetura de um emulador de terminal
    rev: 1
    status: ativo
    descricao: >
      As partes de um emulador e as formas de montá-las: motor VT pronto e embutível
      contra analisador próprio, pilha nativa com GPU e janela contra pilha web embutida,
      e onde cada decisão aparece depois em latência, portabilidade e custo de
      conformidade.
    verificacao: >
      Para um alvo dado — por exemplo um emulador nativo de baixa latência, ou um
      terminal embutido numa aplicação que já existe — escolher entre reaproveitar um
      motor VT pronto e escrever o próprio, nomeando o que cada caminho entrega de
      imediato e o que cobra em latência, portabilidade e trabalho de conformidade.
