versao_schema: 1
competencias:
  - id: comp:dados/manipulacao-tabular
    titulo: Manipulação de dados tabulares
    rev: 1
    status: ativo
    descricao: >
      Carregar, limpar, combinar e agregar tabelas com arrays e dataframes: tipos,
      valores ausentes, junções, agrupamento, reformatação entre formato largo e longo.
    verificacao: >
      A partir de dois arquivos com chaves inconsistentes e valores ausentes, produzir
      uma tabela agregada correta, justificando o tipo de junção escolhido e o
      tratamento dado a cada coluna com ausências.

  - id: comp:dados/analise-exploratoria
    titulo: Análise exploratória de dados
    rev: 1
    status: ativo
    descricao: >
      Interrogar um conjunto desconhecido até entender sua forma: distribuições,
      dispersão, correlação, valores atípicos, dados faltantes e vieses de coleta.
    verificacao: >
      Dado um conjunto que você não escolheu, entregar uma exploração que responda o
      que ele mede, quais variáveis são confiáveis e qual pergunta ele **não** pode
      responder — cada afirmação sustentada por um número ou um gráfico do próprio dado.

  - id: comp:dados/visualizacao-de-dados
    titulo: Visualização de dados para análise
    rev: 1
    status: ativo
    descricao: >
      Escolher a forma gráfica adequada à pergunta e à natureza da variável, e ler um
      gráfico criticamente: escala, agregação, o que foi omitido.
    verificacao: >
      Refazer um gráfico enganoso identificando o que nele distorce a leitura, e
      defender a escolha de forma, escala e agregação da sua versão.

  - id: comp:dados/inferencia-estatistica
    titulo: Inferência estatística aplicada
    rev: 1
    status: ativo
    descricao: >
      Separar o que a amostra mostra do que a população sustenta: variabilidade
      amostral, intervalo de confiança, teste de hipótese, tamanho de efeito e os
      limites de cada um.
    verificacao: >
      Sobre uma diferença observada entre dois grupos, dizer se ela se sustenta,
      apresentando incerteza e tamanho de efeito, e explicar por que um p-valor
      isolado não responde à pergunta de decisão.

  - id: comp:dados/matematica-para-dados
    titulo: Matemática para ciência de dados
    rev: 1
    status: ativo
    descricao: >
      Álgebra linear e cálculo na medida em que sustentam o método: vetores, matrizes,
      produto interno, derivada, gradiente e otimização — lidos como operação sobre
      dados, não como exercício simbólico.
    verificacao: >
      Implementar uma regressão por mínimos quadrados usando apenas operações de
      álgebra linear, e explicar geometricamente o que a solução minimiza.

  - id: comp:dados/enquadramento-analitico
    titulo: Enquadramento analítico de um problema
    rev: 1
    status: ativo
    descricao: >
      Traduzir uma pergunta de negócio em pergunta respondível por dados: o que seria
      evidência, qual a unidade de análise, qual o custo de errar para cada lado, e
      quando os dados disponíveis não respondem à pergunta feita.
    verificacao: >
      A partir de um pedido vago de uma área não técnica, entregar o enquadramento:
      pergunta reformulada, dado necessário, critério de sucesso e o que faria você
      recomendar **não** seguir com a análise.

  - id: comp:dados/modelagem-preditiva
    titulo: Fundamentos de modelagem preditiva
    rev: 1
    status: ativo
    descricao: >
      Ajustar e avaliar um modelo supervisionado com honestidade: separação de
      amostras, sobreajuste, vazamento de dado, linha de base e métrica adequada ao
      custo do erro.
    verificacao: >
      Entregar um modelo que supere uma linha de base trivial num conjunto de teste
      intocado, apontando onde houve risco de vazamento e por que a métrica escolhida
      corresponde ao custo real do erro.

  # --- Banco de dados (trilha:dados/bancos-de-dados-relacionais) -----------
  - id: comp:dados/arquitetura-de-sgbd
    titulo: Arquitetura de um sistema de banco de dados
    rev: 1
    status: ativo
    descricao: >
      Os três níveis — externo, conceitual e interno —, a independência de dados que
      a separação compra, o catálogo do próprio sistema e o que cabe ao SGBD em vez
      de caber à aplicação.
    verificacao: >
      Diante de uma mudança física anunciada (índice novo, reorganização do
      armazenamento, troca de disco), dizer quais aplicações precisam mudar e quais
      não, nomeando o nível em que a mudança ocorre e o mapeamento que as protege.

  - id: comp:dados/armazenamento-e-indexacao
    titulo: Armazenamento e estruturas de acesso
    rev: 1
    status: ativo
    descricao: >
      Como a relação vira página em disco e como se chega a uma tupla sem varrer
      tudo: índice denso e esparso, índice composto, árvore B, hashing e o custo que
      cada estrutura cobra na escrita.
    verificacao: >
      Para uma consulta lenta sobre uma tabela grande, propor a estrutura de acesso
      que a atende, estimar a ordem de grandeza dos acessos a disco com e sem ela, e
      dizer o que a estrutura custa em inserção e em espaço.

  - id: comp:dados/modelo-relacional
    titulo: O modelo relacional
    rev: 1
    status: ativo
    descricao: >
      Relação como conjunto de tuplas sobre domínios — não como arquivo com linhas:
      chave candidata, primária e estrangeira, as regras de integridade de entidade e
      referencial, e o que o valor nulo faz com cada uma delas.
    verificacao: >
      Sobre um esquema dado, apontar as chaves candidatas e justificar a escolha da
      primária, e dizer, para três operações de escrita propostas, qual regra de
      integridade cada uma viola e qual ação referencial a resolveria.

  - id: comp:dados/algebra-relacional
    titulo: Álgebra e cálculo relacional
    rev: 1
    status: ativo
    descricao: >
      As operações fechadas sobre relações — restrição, projeção, produto, junção,
      união, diferença, divisão — e a formulação equivalente em cálculo de tuplas,
      com a noção de completude relacional que liga as duas.
    verificacao: >
      Escrever a mesma consulta não trivial (com divisão ou quantificação universal)
      em álgebra e em cálculo relacional, e mostrar sobre um esquema concreto que as
      duas devolvem a mesma relação.

  - id: comp:dados/sql-consultas
    titulo: Consulta em SQL
    rev: 1
    status: ativo
    descricao: >
      Escrever e ler SQL sabendo a que operação do modelo cada construção
      corresponde: junção, agrupamento, subconsulta correlacionada, e os pontos em
      que a linguagem diverge do modelo — duplicatas, ordem e nulos.
    verificacao: >
      Responder a uma pergunta que exija junção, agregação e subconsulta
      correlacionada, e explicar por que a contagem muda quando uma coluna envolvida
      tem nulos — nomeando a divergência entre SQL e o modelo que a produz.

  - id: comp:dados/projeto-de-esquema
    titulo: Projeto de esquema e normalização
    rev: 1
    status: ativo
    descricao: >
      Dependência funcional como critério de projeto: anomalia de atualização,
      decomposição sem perda, preservação de dependências e as formas normais até a
      FNBC — e quando desnormalizar é decisão consciente, não descuido.
    verificacao: >
      Normalizar até a FNBC um esquema dado em texto, justificando cada decomposição
      pela dependência funcional que a motiva, mostrando que ela é sem perda e
      apontando a anomalia que o esquema original admitia.

  - id: comp:dados/transacoes-e-concorrencia
    titulo: Transação, recuperação e concorrência
    rev: 1
    status: ativo
    descricao: >
      A transação como unidade atômica de trabalho: log e pontos de verificação na
      recuperação, bloqueio e serialização no acesso concorrente, as anomalias que
      cada nível de isolamento admite e o impasse que o bloqueio cria.
    verificacao: >
      Dado um entrelaçamento de duas transações, nomear a anomalia que ele produz e o
      nível de isolamento que a impede, e descrever o que o log permite refazer e
      desfazer numa falha ocorrida no meio do entrelaçamento.
