versao_schema: 1
competencias:
  - id: comp:programacao/python-dados
    titulo: Python aplicado a dados
    rev: 1
    status: ativo
    descricao: >
      Escrever Python idiomático para manipular dados, usando ambientes isolados,
      notebooks e bibliotecas de terceiros.
    verificacao: >
      Dado um CSV sujo, escrever um script que carregue, limpe e agregue os dados,
      executando em ambiente isolado com dependências declaradas em arquivo.

  # --- Linguagem C (trilha:programacao/linguagem-c-ansi) ---------------------
  - id: comp:programacao/c-fundamentos
    titulo: C — tipos, operadores, expressões e controle de fluxo
    rev: 1
    status: ativo
    descricao: >
      O núcleo da linguagem C: tipos básicos e seus limites, conversões implícitas,
      operadores (inclusive bit a bit e de atribuição composta), precedência, e as
      construções de controle de fluxo.
    verificacao: >
      Escrever, compilando com `-std=c89 -pedantic -Wall` sem aviso, um programa que
      conte linhas, palavras e caracteres da entrada padrão, e explicar o resultado de
      uma expressão com conversão entre `char`, `int` e `unsigned` escolhida por outra
      pessoa.

  - id: comp:programacao/c-funcoes-e-estrutura-de-programa
    titulo: C — funções e estrutura de programa
    rev: 1
    status: ativo
    descricao: >
      Funções e protótipos, variáveis externas e escopo, classes de armazenamento
      (`static`, `extern`, `register`), compilação separada em vários arquivos,
      recursão e o pré-processador.
    verificacao: >
      Dividir um programa em pelo menos três arquivos-fonte com cabeçalho próprio,
      escondendo estado com `static`, compilar e ligar à mão, e explicar o que cada
      `extern` e cada `#include` resolve.

  - id: comp:programacao/c-apontadores
    titulo: C — apontadores, vetores e memória
    rev: 1
    status: ativo
    descricao: >
      Apontadores e endereços, aritmética de apontadores, a relação entre vetor e
      apontador, cadeias de caracteres, vetores de apontadores, apontadores para
      funções, declarações complexas e alocação dinâmica.
    verificacao: >
      Implementar uma ordenação de linhas lidas da entrada com vetor de apontadores e
      função de comparação passada por apontador, sem vazamento nem acesso inválido sob
      `valgrind`, e decifrar em português uma declaração como `char (*(*x())[])()`.

  - id: comp:programacao/c-estruturas
    titulo: C — estruturas, uniões e estruturas autorreferentes
    rev: 1
    status: ativo
    descricao: >
      Estruturas e funções, vetores de estruturas, apontadores para estruturas,
      estruturas autorreferentes (listas, árvores), tabelas de dispersão, `typedef`,
      uniões e campos de bits.
    verificacao: >
      Implementar uma árvore binária de busca ou uma tabela de dispersão para contar
      ocorrências de palavras, liberando toda a memória ao final, e justificar a
      escolha entre passar a estrutura por valor ou por apontador em cada função.

  - id: comp:programacao/c-entrada-saida-e-biblioteca
    titulo: C — entrada e saída e a biblioteca padrão
    rev: 1
    status: ativo
    descricao: >
      E/S padrão (`stdio.h`): formatação com `printf`/`scanf`, acesso a arquivos,
      tratamento de erro com `stderr` e `exit`, listas de argumentos variáveis, e o
      restante da biblioteca padrão ANSI (`string.h`, `ctype.h`, `stdlib.h`,
      `math.h`).
    verificacao: >
      Reescrever um utilitário como `cat` ou `cmp` que receba arquivos na linha de
      comando, reporte erro de abertura em `stderr` com código de saída diferente de
      zero, e implementar uma função com argumentos variáveis no estilo de `printf`.

  - id: comp:programacao/c-interface-unix
    titulo: C — interface com o sistema UNIX
    rev: 1
    status: ativo
    descricao: >
      O que a biblioteca padrão esconde: descritores de arquivo, E/S de baixo nível
      (`read`, `write`, `open`, `lseek`), listagem de diretórios, e um alocador de
      memória escrito sobre o sistema.
    verificacao: >
      Implementar `fopen`/`getc` mínimos sobre `read` e um alocador `malloc`/`free`
      com lista livre, demonstrando-os num programa de teste, e explicar por que a E/S
      com buffer é mais rápida que um `read` por caractere.

  - id: comp:programacao/pratica-da-programacao
    titulo: Prática da programação
    rev: 1
    status: ativo
    descricao: >
      O ofício em torno do código que compila: estilo e notação, escolha de algoritmo
      e estrutura de dados, depuração sistemática, teste, medição antes de otimizar,
      e portabilidade — independente de linguagem, exercido em C.
    verificacao: >
      Partindo de um programa que funciona mas está lento ou ilegível, entregar uma
      versão revista sustentada por medição: apresentar o perfil que identificou o
      gargalo, o teste que impediu a regressão, e justificar uma otimização que foi
      descartada por não valer a complexidade que introduzia.

  # --- Programação de sistemas (etapa avulsa) -------------------------------
  # Terceira competência de pré-requisito compartilhado, na forma de ADR-0010 e pelo
  # buraco que ADR-0017 declarou: trilha:terminal/emulador manda escrever um emulador
  # e trilha:so/projeto-e-implementacao manda modificar o MINIX, e nenhuma das duas
  # exigia saber programar. Decisão e recorte em
  # docs/adr/0018-programacao-de-sistemas-como-pre-requisito-compartilhado.md.
  #
  # O recorte é o que as duas cobram **em comum**, e nada além: descritor, estrutura
  # em memória e programa em módulos. Não é a trilha de C — fora ficam a biblioteca
  # padrão, os argumentos variáveis, o alocador próprio e a sintaxe de C — e não é
  # linguagem nenhuma: as três pilhas de um emulador (Rust, C, JavaScript) cobram as
  # mesmas três coisas. `etapa:programacao/c-interface-com-o-unix` passou a ensinar
  # esta competência também, para que quem cursa a trilha de C inteira não seja
  # mandado de volta a uma etapa que já ultrapassou.
  - id: comp:programacao/programacao-de-sistemas
    titulo: Programação de sistemas — descritor, estrutura em memória e programa em módulos
    rev: 1
    status: ativo
    descricao: >
      Escrever programa que fala com o sistema operacional, em qualquer linguagem: o
      descritor de arquivo como fluxo de bytes sem fronteira de registro, a leitura
      parcial e o estado que sobrevive entre duas leituras, o processo filho e os
      canais que o ligam a quem o lançou, a estrutura de dados agregada e a diferença
      entre guardar uma cópia e guardar referência ao mesmo dado, e o programa
      repartido em mais de um módulo com uma construção que o liga. Não é uma
      linguagem, e por isso não substitui nenhuma: é o mínimo que Rust, C e
      JavaScript cobram igualmente de quem vai escrever código de sistema.
    verificacao: >
      Entregar, na linguagem de sua escolha, um programa de pelo menos dois módulos
      que lance um processo filho, leia a saída dele por um descritor (ou pelo fluxo
      equivalente da linguagem) em pedaços que não respeitam fronteira de registro, e
      acumule o que leu numa estrutura de dados que cresce. Demonstrar, com uma
      entrada cortada no meio de um delimitador, que nada se perde nem se duplica;
      dizer onde a estrutura escolhida guarda cópia e onde guarda referência ao mesmo
      dado; e mostrar o comando que constrói o programa a partir dos dois módulos,
      nomeando o que cada módulo exporta ao outro.

  # --- Compiladores (trilha:programacao/compiladores) -----------------------
  # As cinco fases do livro de Price & Toscani, uma competência por fase. O corte
  # entre elas é o que cada uma **recebe e entrega**: cadeia de caracteres → átomos →
  # árvore → árvore anotada com tipos → código. Por isso nenhuma verificação pede
  # "entender" a fase: pede o artefato que ela produz a partir do da anterior.
  - id: comp:programacao/compilador-estrutura
    titulo: Estrutura de um compilador — fases, o que cada uma entrega e onde o interpretador se separa
    rev: 1
    status: ativo
    descricao: >
      O compilador visto como sequência de fases: que representação cada uma recebe e
      qual entrega à seguinte, a tabela de símbolos como estrutura que as atravessa
      todas, a distinção entre erro léxico, sintático e semântico, e o ponto em que um
      interpretador deixa de seguir o mesmo caminho.
    verificacao: >
      Dado um programa-fonte de poucas linhas numa linguagem imperativa, dizer o que
      cada fase recebe e devolve nele — a cadeia de caracteres, a sequência de átomos,
      a árvore sintática, a árvore anotada, o código gerado —, classificar três erros
      dados pela fase que os detecta, e explicar o que um interpretador do mesmo
      programa não chega a produzir.

  - id: comp:programacao/analise-lexica
    titulo: Análise léxica — expressão regular, autômato finito e o analisador que os realiza
    rev: 1
    status: ativo
    descricao: >
      Da especificação léxica ao reconhecedor: a expressão regular que descreve cada
      classe de átomo, o autômato finito determinístico como implementação, o
      tratamento de palavra reservada, comentário e espaço em branco, e a entrada do
      identificador na tabela de símbolos.
    verificacao: >
      Escrever, na linguagem de sua escolha, um analisador léxico que leia um
      programa-fonte e emita a sequência de átomos com lexema, classe e posição,
      reconhecendo identificador, número, palavra reservada e operador de dois
      caracteres. Demonstrar, com uma entrada em que a decisão gulosa e a preguiçosa
      divergem, que ele devolve o átomo mais longo possível, e apresentar o autômato
      que o código implementa.

  - id: comp:programacao/analise-sintatica
    titulo: Análise sintática — gramática livre de contexto e os métodos descendente e ascendente
    rev: 1
    status: ativo
    descricao: >
      A gramática livre de contexto como especificação da linguagem, derivação e árvore
      sintática, ambiguidade e recursão à esquerda, os conjuntos First e Follow, a
      análise descendente (preditiva, recursiva ou por tabela) e a ascendente (empilha
      e reduz, tabela LR), e a detecção do erro sintático com a posição.
    verificacao: >
      Dada uma gramática livre de contexto para expressões aritméticas, calcular First
      e Follow, construir a tabela preditiva e dizer se a gramática é LL(1). Escrever um
      analisador descendente recursivo que aceite a linguagem e rejeite uma cadeia
      inválida apontando a posição, e explicar, para uma gramática ambígua dada, que
      conflito ela produz na tabela e que reescrita o remove.

  - id: comp:programacao/analise-semantica
    titulo: Análise semântica — tabela de símbolos, escopo, tipos e tradução dirigida por sintaxe
    rev: 1
    status: ativo
    descricao: >
      O que a sintaxe não pega: a tabela de símbolos com escopo aninhado, a declaração
      e o uso de identificador, a checagem e a conversão de tipos, e a tradução dirigida
      por sintaxe — atributo herdado e sintetizado, ação semântica associada à regra da
      gramática.
    verificacao: >
      Estender um analisador sintático de declarações e expressões com tabela de
      símbolos de escopo aninhado e checagem de tipos: o programa deve recusar uso de
      identificador não declarado, redeclaração no mesmo escopo e atribuição entre
      tipos incompatíveis, cada recusa com a linha. Para três atributos dados, dizer
      qual é herdado e qual é sintetizado, e por quê.

  - id: comp:programacao/geracao-de-codigo
    titulo: Geração de código — código intermediário, ambiente de execução e código final
    rev: 1
    status: ativo
    descricao: >
      Da árvore anotada ao código que roda: o código intermediário de três endereços,
      a tradução de atribuição, expressão, teste e laço, o ambiente de execução — o
      registro de ativação, a passagem de parâmetro, a variável local e o endereçamento
      dela — e a emissão do código final para uma arquitetura concreta.
    verificacao: >
      Gerar código intermediário de três endereços para um trecho com atribuição,
      expressão aritmética, teste e laço, e traduzi-lo para o assembly de uma
      arquitetura ou para o código de uma máquina virtual de sua escolha. Desenhar o
      registro de ativação de uma chamada com dois parâmetros e uma variável local,
      dizendo quem empilha o quê e em que momento, e mostrar como o código gerado
      alcança cada um dos três.
