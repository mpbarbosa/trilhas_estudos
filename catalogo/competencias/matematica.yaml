versao_schema: 1
competencias:
  - id: comp:matematica/raciocinio-dedutivo
    titulo: Raciocínio dedutivo e demonstração
    rev: 1
    status: ativo
    descricao: >
      Ler e escrever demonstração: quantificadores, implicação e sua recíproca, prova
      direta, contrapositiva, contradição, indução, contraexemplo — e distinguir
      argumento válido de argumento convincente.
    verificacao: >
      Demonstrar uma proposição que você não viu antes, escolhendo a estratégia e
      justificando por que ela cabe; e, dada uma "prova" com erro sutil, localizar o
      passo inválido e dizer qual regra ele viola.

  - id: comp:matematica/geometria-euclidiana
    titulo: Geometria euclidiana e método axiomático
    rev: 1
    status: ativo
    descricao: >
      A geometria plana como sistema dedutivo: noções comuns, postulados, construções
      com régua e compasso, e o que muda quando um postulado é retirado.
    verificacao: >
      Reconstruir uma proposição dos Elementos indicando de quais postulados e
      proposições anteriores ela depende, e explicar por que o quinto postulado foi
      objeto de dois mil anos de tentativa de demonstração.

  - id: comp:matematica/limite-e-continuidade
    titulo: Limite e continuidade
    rev: 1
    status: ativo
    descricao: >
      O limite como o conceito que torna o infinitesimal tratável: aproximação,
      continuidade, comportamento assintótico, e por que a definição precisa ser
      tão desconfortável quanto é.
    verificacao: >
      Decidir se uma função dada é contínua num ponto e sustentar a resposta pela
      definição, não pelo gráfico; e exibir uma função cujo gráfico engana a intuição.

  - id: comp:matematica/calculo-diferencial
    titulo: Cálculo diferencial
    rev: 1
    status: ativo
    descricao: >
      A derivada como taxa de variação e como inclinação: regras de derivação, regra
      da cadeia, otimização, e a leitura física do que a derivada mede.
    verificacao: >
      Modelar um problema de otimização a partir de um enunciado em prosa, resolvê-lo
      por derivação e interpretar o resultado na grandeza original — inclusive
      verificando que o ponto crítico encontrado é de fato máximo ou mínimo.

  - id: comp:matematica/calculo-integral
    titulo: Cálculo integral
    rev: 1
    status: ativo
    descricao: >
      A integral como acumulação e como área: soma de Riemann, teorema fundamental,
      técnicas de integração e aplicação a grandezas acumuladas.
    verificacao: >
      Resolver um problema de acumulação montando a integral a partir do enunciado,
      e explicar em que sentido o teorema fundamental diz que derivar e integrar se
      desfazem — e em que sentido não.

  - id: comp:matematica/estrutura-e-simetria
    titulo: Estrutura algébrica e simetria
    rev: 1
    status: ativo
    descricao: >
      Grupo como a formalização de simetria: operação, elemento neutro, inverso,
      subgrupo, e a ideia de classificar objetos pelas transformações que os preservam.
    verificacao: >
      Descrever o grupo de simetrias de uma figura dada listando seus elementos e a
      tabela da operação, e identificar um subgrupo justificando por que é fechado.

  - id: comp:matematica/funcoes-elementares
    titulo: Conjuntos, relações e funções elementares
    rev: 1
    status: ativo
    descricao: >
      A linguagem de conjuntos e dos conjuntos numéricos, relação, e função como
      relação com domínio, contradomínio e imagem: afim, quadrática, modular,
      composta e inversa — o vocabulário que o cálculo dá por sabido.
    verificacao: >
      Dada uma função definida por partes, determinar domínio e imagem, esboçar o
      gráfico sem tabela de valores, decidir se é injetora ou sobrejetora e, quando
      couber, obter a inversa e restringir o domínio para que ela exista.
