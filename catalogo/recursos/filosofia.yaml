#
#   Os oito itens vêm da foto das notas 37 a 45 enviada pelo estudante em 2026-11-15
#   (a 42 e a 43 repetem a mesma referência). Sete são exemplares e declaram `obra`,
#   cada um com uma fatia só; o artigo de Clynes e Kline é avulso e não declara.
#
#   **Nenhum `custo` foi conferido em loja**, e este é o ponto a ler antes de usá-lo.
#   Amazon, Wiley e Estante Virtual recusaram a leitura automática em 2026-11-15, e as
#   páginas da Polity, da Routledge e da Penguin Random House que abriram não traziam
#   preço. Os seis livros em inglês levam o preço de tabela aproximado da brochura nos
#   EUA, **de memória e arredondado**, convertido pela cotação do BCE de 2026-11-13
#   (R$ 5,6637/US$, via frankfurter.dev), sem frete nem imposto de importação; o
#   *Antropologia do ciborgue* leva uma estimativa de mercado brasileiro. São ordem de
#   grandeza para o fator de custo do motor, não preço — o mesmo estado do custo do
#   Viewpoint 1 em catalogo/recursos/linguas.yaml. Quem conferir corrige: mudar `custo`
#   é substantivo e sobe a `rev` do recurso (docs/catalogo.md §4).
#
#   Também por isso a `url` dos livros em inglês é a página da Amazon BR pelo ISBN-10
#   da brochura, **não aberta** — exceto a de Hayles, que é a da University of Chicago
#   Press, lida em 2026-11-15.
#
#   **Edição em português.** O estudante citou as edições em inglês, e são elas que
#   entram. Há tradução brasileira dos dois Kurzweil, ao que consta, mas não se
#   conferiu editora, ano nem disponibilidade; se ele preferir ler em português,
#   o movimento é acrescentar o recurso traduzido como segunda via da mesma etapa.
# -------------------------------------------------------------------------

