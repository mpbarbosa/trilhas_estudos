    idioma: en-US
    custo: 0
    duracao_min: 300
    url: https://www.gutenberg.org/ebooks/2388
    obra: arnold-song-celestial
    disponivel: true
    verificado_em: 2026-10-26

  # Livro 2 da série, e a única tradução do catálogo feita do sânscrito com aparato:
