# trilha:filosofia/subjetividade-artificial
#
#   Cinco fatias de um exemplar só — *Gozai por nós*, coletânea organizada por
#   Alfredo Simonetti —, uma por etapa, todas com `obra: simonetti-gozai-por-nos` e
#   o mesmo `custo`, que é o do exemplar comprado uma vez (validação 12).
#
#   **Qual exemplar.** O `custo` 9.99 e a `url` são os da edição Kindle (ASIN
#   B0CQRJ84FY, R$ 9,99, incluída no Kindle Unlimited), conferidos na Amazon BR em
#   2026-11-14 — é a via mais barata e é a edição cujo sumário foi lido. A capa
#   comum do mesmo ISBN-13 custava R$ 94,90 (R$ 90,15 à vista no Pix) na mesma data,
#   348 p. contra 412 do Kindle. Se o estudante estiver lendo em papel, trocar
#   `custo` e `url` é mudança substantiva de recurso (docs/catalogo.md §4) e sobe a
#   `rev` das cinco fatias, não a da etapa.
#
#   **Duração.** Estimativa, não medida: ~2,5 min/p. sobre as 348 p. da capa comum
#   (~870 min no total), repartidas por número de capítulos, porque o sumário da
#   amostra não traz paginação por capítulo. Ver o comentário LIMITE DE VERIFICAÇÃO
#   no arquivo da trilha.
#
#   **Editora não resolvida.** A capa impressa "ALPENDRE Books"; o isbnsearch.org
#   atribui o ISBN à "Editora Amoler"; o site editoraamoler.com.br não resolve DNS e
#   a página da Amazon não imprime editora em campo nenhum. A ficha em
#   docs/bibliografia.md registra a divergência em vez de escolher — nenhum campo do
#   recurso depende dela.
# -------------------------------------------------------------------------

