# Convenções deste arquivo:
#   custo  — em BRL, aproximado na data de `verificado_em`; 0 = gratuito.
#   idioma — tag BCP 47.
#
# -------------------------------------------------------------------------
# trilha:filosofia/bhagavad-gita
#
#   Cinco recursos são a série que Hari Chetan numera no próprio site: livro 1 (as
#   quinze razões), 2 (a tradução), 3 (os trinta dias), 4 (o resumo) e 5 (a prática
#   devocional, o único que não trata da Gita). Só o 1
#   é gratuito, por decisão do autor em todas as lojas (Kindle, Google Play, Apple
#   Books, Nook), conferido na página do livro no site dele e no Google Play — por
#   isso custo 0, ao contrário de leitura por assinatura. Os outros três são pagos,
#   com preço e paginação lidos no Google Play BR em 2026-11-01.
#
#   Cada um declara a própria `obra`, de uma fatia só: são cinco exemplares
#   distintos, comprados um a um, e cada um atende uma etapa só. Até 2026-11-01 não
#   declaravam nenhuma, pela leitura de que sem fatiamento não há o que agrupar;
#   ADR-0020 inverteu isso — `obra` é o que diz "isto é um exemplar", e sem ela a
#   trilha não tem como listar os próprios livros. O slug repete o do recurso: é o
#   mesmo exemplar, e nome diferente só criaria duas maneiras de chamá-lo.
#   A duração de cada um é estimada pelo ritmo medido no livro 1 (180 min / 95 p.
#   ≈ 1,9 min/p.), não pelo que o título promete: os "30 dias" do livro 3 são
#   calendário, não esforço.
# -------------------------------------------------------------------------
versao_schema: 1
recursos:
  # --- etapa:filosofia/por-que-ler-a-gita ---------------------------------
  # Livro 1: 97 p. no Google Play e 95 no Goodreads. Sem sumário público, as quinze
  # razões não foram fatiadas, e o livro entra inteiro numa etapa só.
  - id: rec:filosofia/chetan-gita-perfect-philosophy
    etapa: etapa:filosofia/por-que-ler-a-gita
    titulo: "Bhagavad Gita - The Perfect Philosophy: 15 Reasons That Make the Song of God the Most Scientific Ideology (Hari Chetan)"
    rev: 2
    status: ativo
    formato: texto
    idioma: en-US
    custo: 0
    duracao_min: 180
    url: https://harichetan.com/books/bhagavad-gita-perfect-philosophy/
    obra: chetan-gita-perfect-philosophy
    disponivel: true
    verificado_em: 2026-10-26

  # Livro 3 da mesma série, e o inverso do livro 1 em função: não argumenta que se
  # deve ler a Gita, expõe a doutrina em trinta passos — atman, karma, reencarnação,
  # os seis princípios da autorrealização, os caminhos e o que a Gita chama de ioga.
  # Entra nesta etapa, e não na do texto, porque é exposição do autor e não o
  # diálogo. Alternativa paga ao livro de abertura: 245 p. e R$ 24,99 no Google Play
  # (Amazon, Apple Books e Nook também), ao contrário do livro 1, que é gratuito.
  # Duração estimada pelo ritmo do livro 1 (~1,9 min/p.), não pelos trinta dias do
  # título, que são sugestão de calendário e não de esforço.
  - id: rec:filosofia/chetan-30-dias-gita
    etapa: etapa:filosofia/por-que-ler-a-gita
    titulo: "30 Days to Understanding the Bhagavad Gita: A Complete, Simple, and Step-by-Step Guide to the Million-Year-Old Confidential Knowledge (Hari Chetan)"
    rev: 2
    status: ativo
    formato: texto
    idioma: en-US
    custo: 24.99
    duracao_min: 450
    url: https://harichetan.com/books/30-days-understanding-bhagavad-gita
    obra: chetan-30-dias-gita
    disponivel: true
    verificado_em: 2026-11-01

  # Livro 4 da série: o resumo. Segue os dezoito capítulos, cada um com "Key
  # Takeaways", e fecha com os ensinamentos agrupados por tema. Fica nesta etapa, e
  # não na do texto integral, porque resumo é exatamente o que a
  # comp:filosofia/argumento-da-gita exclui ("a leitura do texto inteiro, não do
  # resumo"). Aqui ele serve: é a visão de conjunto antes do diálogo.
  - id: rec:filosofia/chetan-gita-resumida
    etapa: etapa:filosofia/por-que-ler-a-gita
    titulo: "The Bhagavad Gita Summarized and Simplified: A Comprehensive and Easy-to-Read Summary of the Divine Song of God (Hari Chetan)"
    rev: 2
    status: ativo
    formato: texto
    idioma: en-US
    custo: 19.99
    duracao_min: 280
    url: https://harichetan.com/books/bhagavad-gita-summarized-simplified/
    obra: chetan-gita-resumida
    disponivel: true
    verificado_em: 2026-11-01

