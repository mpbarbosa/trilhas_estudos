# Convenções deste arquivo:
#   custo  — em BRL, aproximado na data de `verificado_em`; 0 = gratuito.
#   idioma — tag BCP 47.
#
# O livro-base (Tanenbaum & Woodhull, 2ª ed., Bookman) aparece como uma entrada por
# etapa, uma por capítulo — o caso de "recurso composto" de docs/catalogo.md §8. O
# `custo` repete por entrada embora o exemplar seja pago uma vez. A 2ª edição está
# fora de catálogo e circula em sebos; o valor é o de um exemplar usado.
#
# ATENÇÃO sobre defasagem: a 2ª edição traz o MINIX 2 no CD-ROM, que hoje não roda
# em hardware atual. Os conceitos envelheceram bem; para a prática, o projeto usa o
# MINIX 3 em máquina virtual, cuja estrutura (micronúcleo, servidores, drivers em
# modo usuário) é a descrita no livro, com código diferente.
