# etapa, uma por capítulo — o caso de "recurso composto" de docs/catalogo.md §8. O
# `custo` repete por entrada embora o exemplar seja pago uma vez. A 2ª edição está
# fora de catálogo e circula em sebos; o valor é o de um exemplar usado.
