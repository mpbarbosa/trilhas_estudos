  # =======================================================================
  # Shell e linha de comando — as duas etapas avulsas de catalogo/etapas/avulsas.yaml
  # (ADR-0010). Exemplares conferidos em 2026-10-17, e a conferência mudou duas
  # entradas:
  #
  # - *Shell Script Profissional* (Jargas) saiu de "livro pt-BR de shell" para
  #   recurso da **segunda** etapa só. É um livro sobre escrever script que se
  #   mantenha — portabilidade, POSIX vs. bash, estilo —, não sobre operar a linha
  #   de comando, que ele pressupõe. Entrou onde cobre, e com isso
  #   etapa:so/linha-de-comando fica **sem recurso pt-BR pago**.
  # - *Linux Command Line and Shell Scripting Bible* está na 5ª edição, de
  #   30/12/2025 — posterior ao exemplar da estante lida, cuja edição não se
  #   identificou. O catálogo aponta a 5ª, que é a que se compra; bash e o shell
  #   POSIX são conservadores e a diferença não afeta estas etapas
  #   (docs/acervo-lido.md § 4). Na loja brasileira o Kindle (R$ 323,00) sai **mais
  #   caro** que a capa comum (R$ 268,78, importado com tributos inclusos); `custo`
  #   segue o impresso.
  #
  # Gratuito de acesso aberto: uma etapa servida só por livro pago é filtrada por
  # `custo_maximo` (motor §2.2). As duas têm alternativa de `custo: 0`.
  #
  # O que **não** entrou, para não ser pesquisado de novo: não há material gratuito
  # **e** em pt-BR que carregue etapa:so/linha-de-comando inteira. O Guia Foca
  # (abaixo) é o que chega mais perto e entrou apesar de parado desde 2020; as
  # apostilas do próprio Jargas (*Introdução ao Shell Script*, 22 p., e o *Canivete
  # Suíço*, que é tabela de consulta) são curtas demais para realizar uma etapa.
  #
  # As duas fatias do Shotts **não** declaram `obra`, pela mesma razão das cinco do
  # OSTEP acima: `obra` existe para que uma agregação monetária conte o exemplar uma
  # vez (ADR-0009), e obra gratuita soma zero de qualquer maneira. As duas do Blum
  # declaram.
  # =======================================================================

