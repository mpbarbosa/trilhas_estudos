  # -------------------------------------------------------------------------
  # trilha:so/edicao-de-texto-no-vi
  #
  #   O exemplar que abriu a trilha é o *vi Editor Pocket Reference* de Arnold
  #   Robbins (O'Reilly, 1ª ed., 18 jan. 1999; 66 p. na impressão, ISBN
  #   9781565924970; a edição Kindle que o estudante trouxe declara ISBN
  #   978-0596108687 e custa R$ 43,45, com a capa comum a partir de R$ 34,90 —
  #   conferido em 07/11/2026 na página da Amazon.com.br). Está fatiado em seis, uma
  #   fatia por etapa, pelos **grupos de tabela** do livrinho. Todas as fatias
  #   declaram `obra: robbins-vi-pocket-reference` e o mesmo `custo` (validação 12):
  #   é um exemplar, comprado uma vez.
  #
  #   As fatias são nomeadas por assunto, não por capítulo: o livro é tabular e a
  #   página da O'Reilly recusa leitura automática (403 em 07/11/2026), de modo que a
  #   numeração interna não se confirmou em fonte pública. O que se confirmou foi a
  #   descrição da própria editora na página da Amazon — "movement and editing
  #   commands, the command-line options, and other elements of the vi editor in an
  #   easy-to-use tabular format" — e é esse o recorte das fatias. A `duracao_min` de
  #   cada uma é de **consulta**, não de curso: 66 páginas de tabela não ensinam
  #   gramática de edição, e o livro diz isso de si mesmo ao se declarar "companion
  #   volume" ao *Learning the vi Editor*.
  #
  #   Por isso cada etapa leva também um capítulo do **manual do usuário do Vim**
  #   (vimhelp.org), que é o material que ensina o que a tabela resume, e é a via
  #   gratuita da trilha inteira. Ele **não** declara `obra`: é documentação de
  #   projeto, versionada com o editor e sem editora nem ISBN — mesma classificação
  #   de rec:so/guiafoca-linha-de-comando. Os capítulos citados são os do sumário
  #   `usr_toc` conferido em 07/11/2026.
  #
  #   Os dois livros pagos que entram ao lado: *Learning the vi and Vim Editors:
  #   Power and Agility Beyond Just Text Editing*, 8ª ed. (Robbins & Hannah,
  #   O'Reilly, 17 nov. 2021, 938 p., Kindle R$ 307,56), que é o volume de que o
  #   livrinho é companheiro, em quatro fatias; e *Practical Vim*, 2ª ed. (Drew Neil,
  #   Pragmatic Bookshelf, 1 dez. 2015, 356 p., ISBN 9781680501278, R$ 238,32), numa
  #   fatia só, na etapa de repetição — é o livro que trata edição repetida como
  #   assunto central.
  #
  #   LACUNA, registrada e não resolvida: **nenhum recurso desta trilha está em
  #   pt-BR**. O exemplar do estudante, a ajuda do Vim e os dois exercícios
  #   interativos são em inglês. Quem lê só português não tem via aqui, ao contrário
  #   do que acontece em etapa:so/linha-de-comando, que tem o Guia Foca.
  # -------------------------------------------------------------------------

