# Convenções deste arquivo:
#   custo  — em BRL, aproximado na data de `verificado_em`; 0 = gratuito.
#   idioma — tag BCP 47.
#
# Três coisas que este arquivo não tem, e que não são esquecimento:
#
# 1. **Nenhum livro.** O assunto não tem livro-texto. A literatura do emulador de
#    terminal é especificação (ECMA-48, `ctlseqs`, anexos do Unicode), página de
#    manual, documentação de biblioteca e código-fonte de emulador — e é por isso que
#    `docs/bibliografia.md`, que é ficha de **livro**, não ganhou entrada nenhuma com
#    esta trilha. O mais perto de um guia "escreva o seu" é *Anatomy of a terminal
#    emulator*, que aparece em duas fatias: a visão geral na primeira etapa e o
#    esqueleto do projeto na última.
# 2. **Nada em pt-BR.** Procurado em 2026-10-19 por tutorial, artigo e livro em
#    português sobre pseudoterminal, sequências de escape e escrita de emulador: o que
#    existe é ou genérico ("os melhores emuladores do Linux"), ou um executor de
#    comandos em Java apresentado como emulador, ou tradução automática de texto em
#    inglês. Registrado aqui para não ser pesquisado de novo. Consequência real: esta
#    trilha é inacessível a quem não lê inglês técnico, e nenhuma etapa dela tem
#    alternativa em português.
# 3. **Nenhum recurso pago.** Toda entrada deste arquivo é de acesso aberto, o que torna a
#    trilha inteira imune ao filtro de `custo_maximo` do motor (motor §2.2) e dispensa
#    `obra`: `obra` existe para que uma agregação monetária conte o exemplar uma vez
#    (ADR-0009), e obra gratuita soma zero de qualquer maneira.
#
# **O que não entrou, para não ser pesquisado de novo.** A bibliografia de origem
# trazia um documento do acervo de leitura da CIA (CIA-RDP73T00325R000100110001-0), que
# não tem relação com emulação de terminal e ficou fora. Ficaram fora também, por serem
# dependência de implementação e não material de estudo, os pacotes que a trilha usa sem
# estudar — o lugar deles é o `Cargo.toml` ou o `package.json` do projeto do estudante,
# não uma etapa. O que entrou de biblioteca entrou pela documentação, que é o que se lê:
# a de `vte` ensina a máquina de estados, a de `portable-pty` ensina o par
# mestre/escravo nos três sistemas, e assim por diante.
#
# **Fatias da mesma URL em etapas diferentes** — `alacritty_terminal`, `xterm.js`,
# `ctlseqs` e *Anatomy* aparecem em dois recursos cada, com ids distintos, porque um
# recurso pertence a uma etapa só (docs/catalogo.md §2) e cada fatia aponta a parte que
# serve àquela etapa. O `titulo` diz qual parte; a URL é a mesma porque o material não
# tem endereço por seção.
#
# **A seção "Further reading" de *Anatomy of a terminal emulator* está inteira aqui**,
# espalhada pelas etapas a que cada item serve: *The TTY demystified* é
# `rec:terminal/tty-desmistificado`, o capítulo 3 do manual do VT100 é
# `rec:terminal/vt100-guia-do-usuario`, o post do Li Haoyi é
# `rec:terminal/ansi-linha-de-comando-propria`, e a página da Wikipédia entrou em
# 2026-10-20 como `rec:terminal/wikipedia-sequencias-ansi`. Os links do **corpo** do
# artigo não entraram, e não é esquecimento: `nix` e `signal-hook` são dependência de
# implementação (ver acima), `pty(7)` e `termios(3)` já estavam, `forkpty` e as chamadas
# vizinhas se leem pelo manual da glibc e por `pty(7)`, e os verbetes de apoio (Sixel,
# caracteres de moldura, caractere de escape ASCII) são consulta de um parágrafo durante
# a leitura, não material de uma etapa. A exceção é *Building Zellij's web client*, do
# mesmo autor, que entrou em 2026-10-20 como `rec:terminal/zellij-cliente-web`: é um
# emulador real descrito pelo autor, e o lugar disso é `leitura-de-emuladores-reais`.
#
# **As referências e os links externos de *ANSI escape code* (Wikipédia) foram
# minerados em 2026-10-20**, agora que a própria página é recurso. Entraram seis em
# `especificacao-de-sequencias`: a ECMA-35 (`rec:terminal/ecma-35`), que define as
# categorias de sequência — C0, C1, Fe, Fs, Fp, nF — que a ECMA-48 pressupõe e pelas
# quais o verbete se organiza; o manual do VT510
# (`rec:terminal/vt510-manual-de-referencia`), a referência DEC mais completa, que o
# verbete cita sequência por sequência onde o guia do VT100 não alcança;
# `console_codes(4)` (`rec:terminal/man-console-codes-4`) e as sequências do console
# do Windows (`rec:terminal/sequencias-do-console-do-windows`), terceira e quarta
# implementação a comparar com a da DEC e com a do xterm; e as duas convenções de
# fato que o verbete documenta sem norma por baixo — OSC 8
# (`rec:terminal/osc-8-hiperlinks`) e a cor de 24 bits
# (`rec:terminal/termstandard-cores`). *Digital's Video Terminals*, do mesmo Paul
# Williams da máquina de estados, entrou em `o-que-e-um-terminal` como
# `rec:terminal/williams-historia-dos-terminais-dec`.
#
# O resto dos cerca de oitenta endereços da página ficou fora, e nada por
# esquecimento: relatório de bug (bugzilla do GNOME, issues do iTerm2 e do KDE) e
# pergunta de fórum (Stack Exchange, Ask Ubuntu) são citação de evidência, não
# material de estudo; `ansicon` e `colorama` são dependência de implementação (ver
# acima); a FAQ e o changelog do xterm se consultam durante a leitura de
# `rec:terminal/xterm-ctlseqs`, que já está; a documentação de CSI u do iTerm2 repete
# o que `rec:terminal/fixterms-csi-u` e `rec:terminal/kitty-protocolo-de-teclado` já
# cobrem; `no-color.org` tem um parágrafo; a ITU-T T.416, de onde vem o
# `38:2:r:g:b`, exige login no site da ITU e o que ela decide chega por
# `rec:terminal/termstandard-cores`; a 2ª edição da ECMA-48 (1979) é a mesma norma
# antes da revisão, e a 5ª já está; e os endereços mortos (`ansi.html` da AACC,
# `ascii-table.com`) só existem no Internet Archive. `all-escapes.txt`, de
# bjh21.me.uk, seria o único levantamento de sequências terminal por terminal e
# caberia em `conformidade-por-suite`, mas o host não respondeu em 2026-10-20: ficou
# fora por `disponivel`, não por mérito — vale tentar de novo.
#
# Endereços conferidos um a um em 2026-10-19 (HTTP 200 seguindo redirecionamento). A
# wiki do fontconfig em freedesktop.org responde 418 a cliente automatizado; o recurso
# aponta a página de documentação do usuário, que responde.
