# trilha:ihc/captologia
#
# Fichas conferidas em 2026-11-14 nas páginas citadas em docs/bibliografia.md §IHC.
# As lojas brasileiras não respondem ao `curl` deste ambiente, e a Amazon também não:
# os dados saíram de leitura das páginas por outro meio, e a `url` de cada recurso é
# a busca da Amazon pelo ISBN-13, como em catalogo/recursos/economia.yaml.
#
#   obra: fogg-persuasive-technology — B.J. Fogg, *Persuasive Technology: Using
#     Computers to Change What We Think and Do* (Morgan Kaufmann, 2003, 312 p.,
#     ISBN 978-1-55860-643-2), em inglês: nenhuma tradução brasileira encontrada.
#     Duas fatias, pelo sumário da O'Reilly: introdução e caps. 1-5, caps. 6-10 e
#     apêndice. **O custo é ESTIMATIVA** do impresso importado; nenhuma página lida
#     mostrou preço. Corrija quando houver preço pago ou observado.
#   obra: fogg-micro-habitos — B.J. Fogg, *Micro-hábitos: pequenas mudanças que mudam
#     tudo*, trad. Bruno Fiuza e Roberta Clapp (HarperCollins Brasil, 2020, 336 p.,
#     ISBN 978-85-950-8688-3). R$ 38,43 à vista, brochura, na Martins Fontes Paulista
#     (de R$ 54,90), com a página dizendo ao mesmo tempo "esgotado" e "sob encomenda".
#   obra: eyal-hooked-engajado — Nir Eyal, *Hooked (Engajado): como construir produtos
#     e serviços formadores de hábitos* (1ª ed., 2020, 218 p., ISBN 978-85-8339-476-1).
#     R$ 88,81 à vista, brochura, na Martins Fontes Paulista. A loja cadastra a editora
#     como AlfaCon, e o tradutor não aparece — ver a ficha.
#   obra: alter-irresistivel — Adam Alter, *Irresistível: por que você é viciado em
#     tecnologia e como lidar com ela*, trad. Cássio de Arantes Leite (Objetiva, 2018,
#     296 p., ISBN 978-85-470-0058-5). R$ 92,90 na página da Companhia das Letras, sem
#     dizer se é preço de capa ou promocional.
#   obra: oneil-algoritmos-de-destruicao-em-massa — Cathy O'Neil, *Algoritmos de
#     destruição em massa: como o big data aumenta a desigualdade e ameaça a
#     democracia* (Rua do Sabão, 2020, 341 p., ISBN 978-65-86460-02-5, pela referência
#     da resenha na ReCiC/UESB). **O custo é ESTIMATIVA**: nenhuma página lida mostrou
#     preço.
# -------------------------------------------------------------------------
# -------------------------------------------------------------------------
# trilha:ihc/computacao-afetiva
#
# Fichas conferidas em 2026-11-14, detalhadas em docs/bibliografia.md §IHC. Ao
# contrário das cinco da captologia, **nenhum destes nove preços é estimativa**: cada
# um saiu de uma página de produto lida no navegador embutido, e a `url` de cada
# recurso é a página em que o preço estava. A Amazon BR recusa o `curl` deste
# ambiente mas responde ao navegador, e foi assim que os cinco importados saíram.
#
#   obra: picard-affective-computing — Rosalind W. Picard, *Affective Computing*
#     (MIT Press; brochura de 2000 do original de 1997, 306 p.,
#     ISBN 978-0-262-66115-7), en-US: nenhuma tradução brasileira encontrada.
#     R$ 473,48 em capa comum na Amazon BR, que mostra ao lado "6 ofertas de produtos
#     novos e usados" a partir de R$ 259,99 — o `custo` é o da oferta principal.
#   obra: oxford-handbook-affective-computing — Calvo, D'Mello, Gratch e Kappas
#     (orgs.), *The Oxford Handbook of Affective Computing* (Oxford University Press,
#     2015, 624 p., ISBN 978-0-19-994223-7), en-US. **Duas fatias, por seção e não por
#     capítulo**: a descrição da editora dá cinco seções — história e teoria,
#     detecção, geração, metodologias e aplicações — em 41 capítulos, e os números de
#     capítulo de cada seção não se conferiram em nenhuma página lida. Fatiar por
#     número aqui seria inventar. R$ 1.513,82 em capa dura na Amazon BR, onde a
#     página mostra também R$ 1.593,50 "à vista no Pix" — mais alto que o preço
#     normal, contradição que ficou como está porque é o que a página diz.
#   obra: konar-chakraborty-emotion-recognition — Amit Konar e Aruna Chakraborty
#     (orgs.), *Emotion Recognition: A Pattern Analysis Approach* (Wiley, 2015,
#     584 p., ISBN 978-1-118-13066-7), en-US. R$ 814,37 em capa dura na Amazon BR,
#     com entrega prevista para o fim de dezembro de 2026.
#   obra: damasio-o-erro-de-descartes — António Damásio, *O erro de Descartes: emoção,
#     razão e o cérebro humano*, trad. Dora Vicente e Georgina Segurado (Companhia das
#     Letras, selo Edição Econômica, lançada em 19/11/2012, 264 p.,
#     ISBN 978-85-359-2200-4). R$ 67,90 à vista na Martins Fontes Paulista. A página
#     da editora dá a ficha mas **não dá preço**.
#   obra: minsky-the-emotion-machine — Marvin Minsky, *The Emotion Machine:
#     Commonsense Thinking, Artificial Intelligence, and the Future of the Human Mind*
#     (Simon & Schuster, brochura de 2007 do original de 2006, 400 p.,
#     ISBN 978-0-7432-7664-1), en-US. R$ 110,96 na Amazon BR, de R$ 211,88.
#   obra: nass-yen-the-man-who-lied-to-his-laptop — Clifford Nass e Corina Yen,
#     *The Man Who Lied to His Laptop: What We Can Learn About Ourselves from Our
#     Machines* (Current/Penguin, brochura de 2013 do original de 2010, 256 p.,
#     ISBN 978-1-61723-004-2), en-US. R$ 100,67 na Amazon BR, que avisa "Somente 1 em
#     estoque" — `disponivel: true` hoje, e é o tipo de recurso que a validação 10 vai
#     mandar reconferir em 180 dias.
#   obra: norman-emotional-design — Donald A. Norman, *Emotional Design: Why We Love
#     (or Hate) Everyday Things* (Basic Books, brochura, 272 p.,
#     ISBN 978-0-465-05136-6), en-US. R$ 103,79 na Amazon BR. **A tradução brasileira
#     existe e está fora de catálogo**: *Design Emocional*, Rocco, 2008, 278 p.,
#     ISBN 9788532523327 pelo Skoob; a busca da Martins Fontes Paulista por "design
#     emocional" devolve um produto só, e é de outro autor. O recurso entra em inglês
#     porque é o exemplar que se compra hoje.
#   obra: barrett-como-as-emocoes-sao-feitas — Lisa Feldman Barrett, *Como as emoções
#     são feitas: a vida secreta do cérebro*, trad. Cássio de Arantes Leite (Objetiva,
#     lançada em 28/07/2026, 472 p., brochura, ISBN 978-85-390-0961-9). R$ 99,90 na
#     Martins Fontes Paulista. ⚠️ A página da Companhia das Letras **não traz o preço
#     do livro** e traz, logo abaixo da ficha, uma vitrine "Você também pode gostar"
#     com R$ 99,90 ao lado de outro título: a coincidência é acidental, e o preço
#     deste recurso é o da Martins Fontes.
#   obra: crawford-atlas-da-ia — Kate Crawford, *Atlas da IA: poder, política e os
#     custos planetários da inteligência artificial*, trad. Humberto do Amaral
#     (Edições Sesc São Paulo, 2025, 380 p., brochura, ISBN 978-85-9493-328-7).
#     R$ 98,00 na Travessa, com "Adicionar à sacola". A Livraria Loyola anuncia
#     R$ 78,40 (20% de desconto sobre R$ 98,00) e na mesma página diz **"Produto
#     esgotado"** — preço de exemplar que não se compra não é preço, e por isso o
#     `custo` é o da Travessa.
#
# **Não entrou, e é deliberado:** *The Handbook of Multimodal-Multisensor Interfaces*
# (Oviatt et al., ACM/Morgan & Claypool), que estava na lista de sugestões. São três
# volumes com preço e disponibilidade próprios, e `obra` é um exemplar com um preço
# (validação 12): catalogá-lo exigiria decidir se são uma obra ou três, e a decisão
# não se toma sem ver as três páginas de produto. A fusão de modalidades, que é o que
# ele traria, está coberta pela seção de detecção do Oxford Handbook.
# -------------------------------------------------------------------------
# -------------------------------------------------------------------------
# trilha:ihc/reconhecimento-de-emocao-na-voz
#
# Fichas conferidas em 2026-11-14, detalhadas em docs/bibliografia.md §IHC. Como nas
# nove da computação afetiva, **nenhum destes preços é estimativa**: os cinco
# importados saíram da Amazon BR lida no navegador embutido, e os dois recursos
# gratuitos têm url conferida por `curl` (HTTP 200 em 2026-11-14).
#
#   obra: schuller-batliner-computational-paralinguistics — Björn Schuller e Anton
#     Batliner, *Computational Paralinguistics: Emotion, Affect and Personality in
#     Speech and Language Processing* (Wiley, nov./2013 com imprenta 2014, 344 p.,
#     ISBN 978-1-119-97136-8), en-US. R$ 785,83 em capa dura.
#   obra: rao-koolagudi-emotion-recognition-speech-features — K. Sreenivasa Rao e
#     Shashidhar G. Koolagudi, *Emotion Recognition using Speech Features*
#     (SpringerBriefs in Speech Technology, nov./2012, XII+124 p.,
#     ISBN 978-1-4614-5142-6), en-US. R$ 320,80 em capa comum.
#   obra: rao-koolagudi-robust-emotion-recognition — dos mesmos autores e na mesma
#     série, *Robust Emotion Recognition using Spectral and Prosodic Features*
#     (jan./2013, 118 p., ISBN 978-1-4614-6359-7), en-US. R$ 320,80, **o mesmo preço
#     do volume anterior e por coincidência**: são duas obras distintas, com slug e
#     ficha próprios, e a validação 12 não se aplica entre elas.
#   obra: fruhholz-belin-oxford-handbook-voice-perception — Sascha Frühholz e Pascal
#     Belin (orgs.), *The Oxford Handbook of Voice Perception* (Oxford University
#     Press, série *Oxford Library of Psychology*, 29/01/2019, 976 p.,
#     ISBN 978-0-19-874318-7), en-US. R$ 1.804,57 em capa dura — **a obra mais cara
#     do catálogo**, à frente do Oxford Handbook of Affective Computing. Uma fatia só:
#     o sumário capítulo a capítulo não foi conferido em nenhuma página lida, e nomear
#     intervalo aqui seria inventar.
#   obra: schuller-intelligent-audio-analysis — Björn W. Schuller, *Intelligent Audio
#     Analysis* (Springer, série *Signals and Communication Technology*, 08/05/2013,
#     XXVIII+345 p., capa dura ISBN 978-3-642-36805-9), en-US. R$ 550,16 em capa dura.
#     ⚠️ **A capa comum sai mais CARA**: a brochura de 2015 (ISBN 978-3-642-44277-3)
#     está a R$ 657,83 na mesma loja. O recurso aponta a capa dura por ser a barata, o
#     que inverte a suposição usual e é o motivo de a ficha registrar os dois.
#
# Os dois recursos de `etapa:ihc/corpus-de-emocao-na-fala-em-portugues` **não
# declaram `obra`**, pela mesma regra que deixou `beej-guide-c` fora: são referência
# aberta e corpus, sem editora, sem ISBN e sem exemplar à venda — não são exemplares,
# e `obra` só existe para dar endereço a exemplar (ADR-0020).
