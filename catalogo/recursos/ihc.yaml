# a busca da Amazon pelo ISBN-13, como em catalogo/recursos/economia.yaml.
#
#   obra: fogg-persuasive-technology — B.J. Fogg, *Persuasive Technology: Using
#     Computers to Change What We Think and Do* (Morgan Kaufmann, 2003, 312 p.,
#     ISBN 978-1-55860-643-2), em inglês: nenhuma tradução brasileira encontrada.
#     Duas fatias, pelo sumário da O'Reilly: introdução e caps. 1-5, caps. 6-10 e
#     apêndice. **O custo é ESTIMATIVA** do impresso importado; nenhuma página lida
#     mostrou preço. Corrija quando houver preço pago ou observado.
#   obra: fogg-micro-habitos — B.J. Fogg, *Micro-hábitos: pequenas mudanças que mudam
#     tudo*, trad. Bruno Fiuza e Roberta Clapp (HarperCollins Brasil, 2020, 336 p.,
#     ISBN 978-85-950-8688-3). R$ 38,43 à vista, brochura, na Martins Fontes Paulista
#     (de R$ 54,90), com a página dizendo ao mesmo tempo "esgotado" e "sob encomenda".
#   obra: eyal-hooked-engajado — Nir Eyal, *Hooked (Engajado): como construir produtos
#     e serviços formadores de hábitos* (1ª ed., 2020, 218 p., ISBN 978-85-8339-476-1).
#     R$ 88,81 à vista, brochura, na Martins Fontes Paulista. A loja cadastra a editora
#     como AlfaCon, e o tradutor não aparece — ver a ficha.
#   obra: alter-irresistivel — Adam Alter, *Irresistível: por que você é viciado em
#     tecnologia e como lidar com ela*, trad. Cássio de Arantes Leite (Objetiva, 2018,
#     296 p., ISBN 978-85-470-0058-5). R$ 92,90 na página da Companhia das Letras, sem
#     dizer se é preço de capa ou promocional.
#   obra: oneil-algoritmos-de-destruicao-em-massa — Cathy O'Neil, *Algoritmos de
#     destruição em massa: como o big data aumenta a desigualdade e ameaça a
#     democracia* (Rua do Sabão, 2020, 341 p., ISBN 978-65-86460-02-5, pela referência
#     da resenha na ReCiC/UESB). **O custo é ESTIMATIVA**: nenhuma página lida mostrou
#     preço.
