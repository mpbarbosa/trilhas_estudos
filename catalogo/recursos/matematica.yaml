# Convenções deste arquivo:
#   custo  — em BRL, aproximado na data de `verificado_em`; 0 = gratuito.
#   idioma — tag BCP 47.
#
# ATENÇÃO sobre `disponivel` (mesma ressalva dos demais arquivos de recurso): parte
# do acervo Kindle é *amostra*, não exemplar completo, e amostra deve virar
# `disponivel: false` — a §5.5 conta com exemplar íntegro.
#
# NOTA sobre a composição desta trilha, para quem for revisá-la: o acervo contribui
# com pouco aqui. Dos quatro títulos de matemática, dois (Stewart) são divulgação —
# motivam e dão contexto histórico, mas não treinam competência, e entram marcados
# como tal; um (Kline) já serve a etapa:dados/matematica-para-dados na trilha de
# dados, onde o recorte é aplicado; e os Elementos sustentam uma etapa só. O corpo
# da trilha é portanto material aberto, escolhido por ter exercício com resposta —
# que é o que falta aos livros de divulgação.
#
# -------------------------------------------------------------------------
#   obra: iezzi-murakami-fme-1 — Gelson Iezzi e Carlos Murakami, *Fundamentos de
#     Matemática Elementar 1: Conjuntos, Funções* (Atual, 9ª ed., 2013, 410 p.,
#     ISBN 978-85-357-1680-1). Lido no Kindle. Texto clássico de ensino médio e
#     pré-vestibular, com muitos exercícios resolvidos e propostos, gabarito no
#     fim e as "novas questões de vestibulares" desta edição. Duas fatias: os
#     caps. 1 e 2 (lógica e conjuntos) entram na raiz como porta em pt-BR para o
#     Book of Proof, que é mais exigente; os caps. 3 a 10 e os dois apêndices
#     sustentam a etapa opcional de funções elementares. O custo é estimativa:
#     o preço do Kindle na Amazon brasileira não foi conferido.
