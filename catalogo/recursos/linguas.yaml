# trilha:linguas/sintaxe-do-ingles
#
#   obra: fenn-schwab-introducing-english-syntax — Peter Fenn e Götz Schwab,
#     *Introducing English Syntax: A Basic Guide for Students of English*
#     (Routledge, 2018, 274 p.). Lido no Google Play Livros. O custo é conversão
#     aproximada do preço de lista da brochura (~US$ 50); o preço da edição
#     digital no Brasil não foi conferido — corrija aqui se o exemplar comprado
#     custou outro valor, e lembre que o mesmo `custo` vale para as quatro fatias.
#     Os exercícios de cada capítulo têm gabarito comentado gratuito nos
#     eResources da Routledge; não é recurso à parte, é a mesma obra.
#
#   obra: biber-conrad-leech-longman-student-grammar — Douglas Biber, Susan
#     Conrad e Geoffrey Leech, *Longman Student Grammar of Spoken and Written
#     English* (Longman, 2002, 487 p.). Gramática de referência baseada em corpus,
#     versão para estudante da *Longman Grammar of Spoken and Written English*
#     (1999): descreve cada estrutura e diz em que registro ela ocorre — conversa,
#     ficção, jornal, texto acadêmico. É o par descritivo do Fenn & Schwab, não um
#     substituto: lá se aprende a analisar, aqui se vê o que o uso real faz.
#     A ordem dos capítulos não é a da trilha, então as fatias não são contíguas.
#     O cap. 13 (a gramática da conversa) não cabe em nenhuma etapa e fica de fora.
#     O custo é o da capa comum na Amazon brasileira em 2026-10-22 (R$ 300,18).
# -------------------------------------------------------------------------
