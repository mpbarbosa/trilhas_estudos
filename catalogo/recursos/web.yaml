# Convenções deste arquivo:
#   custo  — em BRL, aproximado na data de `verificado_em`; 0 = gratuito.
#   idioma — tag BCP 47.
#
# ATENÇÃO sobre `disponivel` (mesma ressalva de recursos/dados.yaml): os livros do
# acervo Kindle entram como `disponivel: true`, mas parte do acervo é *amostra*, não
# exemplar completo. Amostra deve virar `disponivel: false` — a §5.5 conta com
# exemplar íntegro.
#
# ATENÇÃO sobre defasagem: os dois livros de D3 do acervo (Zhu, 2013; Castillo, 2014)
# são de versões antigas da biblioteca, cuja API mudou substancialmente. Por isso a
# documentação oficial é o recurso primário da etapa e os livros entram como apoio
# conceitual — a ideia de associação de dados e escalas envelheceu bem; o código, não.
