  # As fatias são nomeadas **por assunto, não por capítulo**: a página da editora não
  # publica sumário nem numeração de capítulos, e o recorte abaixo segue a progressão
  # que a própria descrição declara. Quem tiver o exemplar em mão e a numeração real
  # pode acrescentá-la aos títulos — é mudança cosmética, não sobe `rev` (catalogo.md
  # §4). O que **não** se deve fazer é inventar número de capítulo para parecer
  # preciso.
