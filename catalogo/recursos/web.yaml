  # --- etapa:web/python-no-servidor ---------------------------------------
  # Mesma convenção dos recursos de D3 no alto deste arquivo: a documentação oficial
  # é o recurso primário e o livro entra como apoio conceitual. Aqui ela vale duas
  # vezes, porque o livro do acervo é de Flask e a edição pt-BR é anterior ao Flask 2.
  #
  # Por que dois frameworks e não um: a competência é a *forma* — pedido, rota,
  # template, resposta, domínio fora do template —, e os dois recursos oficiais
  # mostram a mesma forma nos dois modelos de execução que Python oferece. Flask é
  # WSGI e síncrono, e tem o tutorial canônico do assunto; Starlette é ASGI e é o que
  # este repositório usa (docs/adr/0007-entrega-web-em-python-html-no-servidor.md),
  # com o mesmo Jinja2 por baixo. A diferença entre WSGI e ASGI é conteúdo da etapa,
  # não detalhe a esconder atrás da escolha de um só.
  #
  # Nota de endereço: a documentação do Starlette migrou de starlette.io para
  # starlette.dev; o domínio antigo não resolve mais. A `url` aponta para o novo.
  #
  # Limite declarado: o único recurso pt-BR desta etapa é pago. Quem estuda com
  # `custo_maximo: 0` fica com os dois de documentação, ambos en-US
