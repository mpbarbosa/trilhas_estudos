  #
  # O exemplar que abriu a trilha: Raphael Amorim, *Desmistificando WebAssembly —
  # alta performance, portabilidade e segurança*, Casa do Código, set. 2023. Dez
  # fatias, uma por etapa, obra `amorim-desmistificando-webassembly`, cortadas pelo
  # número de capítulo porque o sumário dos onze capítulos está publicado pela
  # editora.
  #
  # DIVERGÊNCIA DE FICHA, declarada em vez de resolvida (regra de
  # docs/catalogo.md §4 sobre o que é cosmético, e a de não corrigir referência por
  # ficha de terceiro): a editora declara 311 páginas e ISBN 978-85-5519-346-0; a
  # página da edição Kindle, por onde o livro chegou (ASIN B0CJWL9Z5V), declara 334
  # páginas e ISBN-13 978-8555193477. São duas fichas do mesmo título em dois
  # formatos; nenhum exemplar foi medido aqui.
  #
  # `custo: 44.9` é a oferta mais baixa **observada** em 2026-11-10, o e-book na
  # loja da editora (que declara dar acesso a atualizações futuras). No mesmo dia o
  # impresso saía a R$ 79,90, o combo a R$ 109,90 e o Kindle a R$ 49,90. A `url`
  # aponta para a página da editora por ser onde o preço declarado se confere e onde
  # o sumário está publicado.
  #
  # Toda etapa tem ao menos uma via gratuita ao lado da fatia paga. ATENÇÃO sobre
  # idioma: a documentação do MDN sobre WebAssembly só tem a página de entrada
  # traduzida — as páginas de guia em `pt-BR` redirecionam para `en-US`, conferido em
