# -------------------------------------------------------------------------
# trilha:cinema/estetizacao-da-politica
#
#   Os cinco itens vêm da bibliografia que o estudante trouxe em 2026-11-05. Como na
#   trilha anterior, a `url` de livro é a busca do Estante Virtual e não a página de
#   uma editora: três dos quatro estão fora de catálogo (a Cosac & Naify fechou em
#   2015, e o Speer e a Sontag em pt-BR só saem em sebo). O `custo` é a **oferta mais
#   baixa observada na busca em 2026-11-05**, usado incluído, e envelhece mais rápido
#   que o link. Só o Benjamin segue em catálogo editorial.
#
#   obra: speer-anos-de-gloria — **a edição brasileira do Speer é partida em dois
#     volumes**, "Os anos de glória" e "A derrocada", vendidos separadamente (30
#     ofertas na busca, de 1970, 1971 e 1975; há também edições num volume só, a partir
#     de R$ 100). A etapa precisa do primeiro, que é onde está o Speer arquiteto. Por
#     serem exemplares distintos com preço próprio, cada volume é **obra própria** — a
#     validação 12 (fatias da mesma obra declaram o mesmo custo) é justamente o que
#     proíbe tratá-los como duas fatias de uma obra só. Se "A derrocada" entrar algum
#     dia, entra com `obra` e `custo` seus. **Não se confirmou a editora brasileira
#     nem em que volume cai cada capítulo**: a partição em dois volumes se observou nas
#     ofertas, o sumário não. Quem o ler primeiro corrige esta nota.
#
#   rec:cinema/sontag-fascinante-fascismo — o ensaio saiu em "Sob o signo de Saturno".
#     O que se confirmou foi um registro de catálogo de biblioteca dando "Fascinante
#     fascismo" na 2. ed. da L&PM (Porto Alegre, 1986), p. 59-83 — que é a edição das
#     ofertas de R$ 20 a R$ 70. A tradução de Rubens Figueiredo pela Companhia das
#     Letras (as 14 ofertas novas, a partir de R$ 49) aparece em citação acadêmica, mas
#     **o sumário dessa edição não se viu**: confira o ensaio no exemplar. O original
#     em inglês está aberto no site da New York Review of Books e entra como segundo
#     recurso da etapa, a custo zero — é o que torna a etapa alcançável sem comprar
#     nada.
#
#   rec:cinema/triunfo-da-vontade — **o filme não está em domínio público.** Os
#     direitos são administrados pela Transit-Film na Alemanha (sucessora do Estado
#     alemão por decisão de 1966) e nos EUA foram restaurados a Riefenstahl pela URAA
#     em 1996. Não se achou cópia gratuita legítima, e a busca do JustWatch Brasil não
#     devolveu nenhum serviço: no Brasil não há streaming nem aluguel. **Atenção à
#     armadilha:** a busca por "Triumph des Willens" no Internet Archive devolve um
#     item homônimo (`archive.org/details/TriumphDesWillens`) que **não é o filme** —
#     é upload de 2014 sem arquivo algum, com acesso restrito e links de propaganda
#     política. Não o cite. O que se verificou é a edição licenciada da Synapse Films,
#     US$ 34,95 na página do distribuidor em 2026-11-05: DVD de todas as regiões,
#     alemão original com legenda em inglês removível, mais o curta "Dia da liberdade"
#     (17 min) e comentário do historiador Anthony Santoro. O `custo` de R$ 182 é essa
#     cifra ao câmbio de ~R$ 5,20/US$ — a cotação datada mais recente que se achou, de
#     2026-08-20 —, e **não inclui frete internacional nem imposto de importação**,
#     que podem dobrar o valor. A duração de 114 min vem da Wikipédia em inglês e não
#     se confirmou em segunda fonte; a edição da Synapse é descrita como ~4 min mais
#     curta que a íntegra, e há uma edição Kino Lorber do restauro 4K da versão
#     integral que não se conseguiu abrir para conferir.
#     Não declara `obra`: `formato: video` está na lista que a regra do exemplar exclui
#     (docs/catalogo.md §2 e ADR-0020), e a seção de obras da trilha se apresenta como
#     os livros dela.
# -------------------------------------------------------------------------

