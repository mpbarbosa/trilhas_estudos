# -------------------------------------------------------------------------
# trilha:cinema/analise-filmica-de-uma-saga
#
#   Os quatorze itens vêm da bibliografia de monografia que o estudante colou em
#   2026-11-10. Como nas duas trilhas anteriores da área, a `url` de livro fora de
#   catálogo editorial é a busca do Estante Virtual e não a página de uma editora: é
#   onde o exemplar existe para comprar hoje. O `custo` é a **oferta mais baixa
#   observada na busca em 2026-11-10**, usado incluído, e envelhece mais rápido que o
#   link.
#
#   **Os cinco preços em moeda estrangeira** (Brooks, Bukatman, Sklar, Gorbman e, na
#   trilha de política, Scott, McAdam e Goodwin) foram convertidos pelas cotações do
#   Banco Central Europeu de **2026-11-09**, via frankfurter.dev: R$ 5,5167/US$,
#   R$ 6,1748/€ e R$ 7,4012/£. **Nenhum deles inclui frete internacional nem imposto de
#   importação**, que para livro podem dobrar o valor — a trilha de 2026-11-05 registrou
#   o mesmo com o DVD da Synapse.
#
#   obra: bordwell-thompson-arte-do-cinema — a 2013 da Editora da Unicamp com a Edusp,
#     tradução de Roberta Gregoli, como o estudante escreveu; 768 p. (listagem da
#     Martins Fontes Paulista e resenha na *Imagofagia*). ISBN 978-85-268-1020-4
#     (Unicamp). **Há impressão posterior em circulação**: a busca do Estante Virtual
#     devolveu exemplares datados de 2025 e 2026 (R$ 263,89 e a partir de R$ 200), além
#     do de 2013 a R$ 250. O `custo` de R$ 200 é a oferta mais baixa do conjunto. Um
#     artigo do *Jornal da Unicamp* de 2014 dava R$ 250,00 na editora e a Martins Fontes
#     listava R$ 330,00; **não se conferiu o preço de hoje na loja da Unicamp nem na
#     Edusp**, então o livro pode estar mais barato comprado direto.
#
#   obra: chion-a-audiovisao — **a edição é portuguesa, não brasileira.** O estudante
#     citou a obra sem dados de edição; o que se confirmou foi o registro da Biblioteca
#     Nacional de Portugal: *A Audiovisão: som e imagem no cinema*, trad. Pedro Elói
#     Duarte, Lisboa, Texto & Grafia, 1. ed. 2011 e 3. ed. 2016, col. Mi-mé-sis (Artes e
#     espetáculo) 8, 175 p. + 8 p. de estampas; original *L'audio-vision: son et image
#     au cinéma* (Nathan, 1990). **Não existe tradução brasileira conhecida**, e o
#     exemplar se compra em Portugal: € 17,90 na Bertrand em 2026-11-10, com uma segunda
#     edição esgotada a € 7,50. O `custo` é a conversão do € 17,90, sem frete de Portugal.
#     **Ressalva de método:** esta é a edição que *existe*, não necessariamente a que o
#     estudante leu — ele não declarou nenhuma. Se ele tiver lido outra, é ela que entra,
#     com `obra` e `custo` seus.
#
#   obra: gorbman-unheard-melodies — **é o item mais caro do catálogo, e por falta de
#     oferta, não por preço de capa.** Indiana University Press com a BFI, 1987, 186 p.,
#     está fora de catálogo; a única oferta observada foi uma usada da primeira
#     impressão a £ 107,78 na biblio.co.uk (frete incluído para os EUA, não para o
#     Brasil). A página da autora na Universidade de Washington fala de uma segunda
#     edição "em conclusão" vinte e cinco anos depois da primeira; **não se confirmou
#     que ela tenha saído**. Por isso o Chion é a via principal da etapa e este é a
#     segunda: quem quiser o capítulo de música narrativa sem gastar isso encontra
#     Gorbman citada e resumida em qualquer bibliografia de som no cinema — inclusive
#     como tradutora da edição inglesa do próprio Chion.
#
#   obra: campbell-heroi-de-mil-faces — tradução de Adail Ubirajara Sobral pela
#     Cultrix, como o estudante escreveu. **A edição em catálogo hoje é outra**: a busca
#     devolveu 8 exemplares novos e 7 usados datados de **2024**, a partir de R$ 62,90, e
#     o Skoob atribui essa edição "atualizada, revisada e ampliada" à **Palas Athena**,
#     448 p., nas Obras Completas da Fundação Joseph Campbell — não à Cultrix. As
#     impressões Cultrix/Pensamento de 1995 e 2008 tinham ~414 p. **Os registros se
#     contradizem no ISBN** (o Skoob dá à edição de 2024 o mesmo ISBN-10 das Cultrix),
#     então confira a editora no exemplar. O `custo` é a oferta mais baixa do conjunto.
#
#   obra: bukatman-matters-of-gravity — o estudante deixou a paginação do capítulo em
#     branco (`p. [x-y]`). A página da Duke University Press confirma: *Matters of
#     Gravity: Special Effects and Supermen in the 20th Century*, julho de 2003, 296 p.,
#     55 ilustrações, e o cap. 4 é "The Artificial Infinite: On Special Effects and the
#     Sublime", **começando na p. 81**, dentro da seção "Two Kaleidoscopic Perceptions".
#     **A página final do capítulo não se confirmou.** O `custo` é a conversão de
#     US$ 21,95, o preço de brochura citado numa resenha da *Leonardo* em 2004 — **é
#     cifra de 2004, não de hoje**; um atacadista lista US$ 40,00 de preço de tabela, e
#     a página da Duke não mostrou preço. A etapa usa um capítulo só, mas o `custo`
#     declarado é o do exemplar inteiro, que é o que se compra.
#
#   obra: eisner-a-tela-demoniaca — o estudante deu Paz e Terra, 2007, trad. Lúcia
#     Nagib. **A edição de 2007 não se confirmou em fonte nenhuma**: o Skoob registra
#     Paz e Terra 1985, 283 p. (ISBN-10 8521904541), e a busca do Estante Virtual
#     devolveu exemplares de 1985 e de **2002** — estes com 4 usados e 3 novos a partir
#     de R$ 10,00, que é o `custo` declarado. O título completo, nas duas, é *A tela
#     demoníaca: as influências de Max Reinhardt e do expressionismo*. Se a de 2007
#     existir, é reimpressão do mesmo texto; quem tiver o exemplar corrige esta nota.
#
#   obra: rosenfeld-cinema-arte-e-industria — **é o único livro em pt-BR desta trilha
#     que segue em catálogo editorial.** A busca devolveu a edição de 2023 da
#     Perspectiva com 8 exemplares novos a partir de R$ 24,00, além de um usado da de
#     2002 a R$ 16,89, que é o `custo`. O estudante citou a de 2002, 264 p., Coleção
#     Debates 288.
#
#   obra: ferro-cinema-e-historia — Paz e Terra, 1992, trad. Flávia Nascimento, 143 p.,
#     como o estudante escreveu. Fora de catálogo: nove ofertas na busca, de R$ 60,00
#     (que é o `custo`) a R$ 110,00, com reimpressões de 2010 e 2012 entre as mais
#     caras.
#
#   obra: chartier-a-historia-cultural — **o item mais caro em pt-BR do catálogo, com
#     duas ofertas no mundo.** Difusão Editorial (Lisboa, 1988), trad. Maria Manuela
#     Galhardo, 244 p., col. Memória e Sociedade 1, como o estudante escreveu: a busca
#     devolveu **dois** exemplares, a R$ 299,89 e R$ 349,99. Por isso ele é a segunda
#     via da etapa e o Ferro é a primeira. **Há uma edição brasileira do mesmo texto
#     pela Forense Universitária** que apareceu em citação acadêmica mas não se
#     confirmou aqui; quem a achar em oferta deve preferi-la, e ela entra como obra
#     própria, com `obra` e `custo` seus.
#
#   obra: roszak-a-contracultura — Vozes, 2. ed. 1972, trad. Donaldson M. Garschagen,
#     como o estudante escreveu; original *The Making of a Counter Culture* (Doubleday,
#     1969). Fora de catálogo, mas abundante em sebo: 33 ofertas na busca, de R$ 28,90
#     (que é o `custo`) a R$ 140,00.
#
#   obra: irwin-star-wars-e-a-filosofia — São Paulo: Madras, coordenação de William
#     Irwin, **2011, como o estudante escreveu**; original *Star Wars and Philosophy*
#     (Open Court, 2005). **O 2011 é palavra do autor, não campo conferido** — a distinção
#     importa, e é o que esta nota afirma e não mais que isso. Três anos circulam para o
#     mesmo ISBN-10 8573749970: um varejista dá Madras **2000** com 224 p., o Skoob dá
#     **2005** com 218 p., as cinco ofertas de sebo são todas de 2005, e o estudante leu
#     **2011**. O 2000 **cai por impossibilidade**: é anterior ao original americano, de
#     2005 (medição registrada na sessão do repositório da monografia). Sobram 2005 e
#     2011, e o 2011 vence por ser o que o autor diz ter tido na mão — não por fonte
#     melhor. A primeira versão desta entrada declarava 2005, o que foi erro de método:
#     ficha de sebo é cadastro de vendedor e não pesa mais que uma folha de rosto. O
#     `custo` de R$ 20,00 é a oferta mais baixa das fichas de 2005, porque não houve
#     oferta de 2011 na busca. **Quatro campos desta entrada só a folha de rosto fecha**:
#     o ano, o papel de Irwin (coordenação, organização ou edição), o subtítulo e o
#     tradutor — que o estudante deixou em branco (`[tradutor]`) e que não se achou em
#     listagem nenhuma.
#
#   rec:cinema/thorn-episodio-iii — o ensaio está aberto na *Bright Lights Film
#     Journal*, na URL que o estudante deu, com a data de 28 de agosto de 2016.
#     **Atenção à data de acesso que ele registrou: "9 nov. 2026"** — é de ontem, não de
#     uma consulta antiga. Artigo avulso: não declara `obra` (docs/catalogo.md §2).
