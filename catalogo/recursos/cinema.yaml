# trilha:cinema/primeiro-cinema-e-vida-moderna
#
#   Os cinco exemplares vêm da bibliografia que o estudante trouxe em 2026-11-05, e
#   quatro deles estão fora de catálogo editorial: Primeiros Passos nº 9 só sai em
#   reimpressão antiga, a Companhia Editora Nacional não reedita a Coleção Portas
#   Abertas, a Cosac & Naify fechou em 2015 e a Azougue não tem o título em loja. Por
#   isso a `url` é a busca do Estante Virtual, e não a página de uma editora: é onde
#   o exemplar existe para comprar hoje. O `custo` é a **oferta mais baixa observada
#   na busca em 2026-11-05**, livro usado incluído — preço de sebo oscila por
#   exemplar, e o número aqui envelhece mais rápido que o link.
#
#   obra: hobsbawm-era-dos-imperios — as duas fatias são do mesmo exemplar e por isso
#     declaram o mesmo custo (docs/catalogo.md §5.12). A edição citada pelo estudante é
#     a Paz e Terra de 2015, tradução de Sieni Maria Campos e Yolanda Steidel de
#     Toledo; as ofertas de R$ 10 cobrem várias reimpressões do mesmo texto. **Dos
#     treze capítulos, só se confirmaram aqui os títulos do cap. 1 ("A revolução
#     centenária") e do cap. 9 ("As artes transformadas")** — o sumário varia entre a
#     edição brasileira e a inglesa, então confira o título do capítulo no exemplar,
#     não só o número.
#
#   rec:cinema/capuzzo-aventura-do-sonho — Companhia Editora Nacional, 1986, Coleção
#     Portas Abertas vol. 12, ~118 p., sem ISBN. **Não se achou resenha nem sumário**:
#     a ficha bibliográfica se confirmou, o conteúdo não. Por isso ele entra como
#     segundo recurso da etapa de abertura, ao lado de Bernardet, e nenhuma descrição
#     de etapa se apoia nele. Quem o ler primeiro corrige esta nota.
#
#   rec:cinema/costa-o-primeiro-cinema — o estudante citou a 2. ed. (Azougue, 2005), e
#     é ela que está declarada. Havia uma única oferta dela na data, a R$ 240; a 1ª ed.
#     (1995) saía a partir de R$ 98,90. Se a 2ª ed. sumir das buscas, a 1ª ed. é a
#     substituta natural — como exemplar próprio, com `obra` e `custo` seus.
# -------------------------------------------------------------------------
