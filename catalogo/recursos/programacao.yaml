# Convenções deste arquivo:
#   custo  — em BRL, aproximado na data de `verificado_em`; 0 = gratuito.
#   idioma — tag BCP 47.
#
# =========================================================================
# Kernighan & Ritchie, *C: A Linguagem de Programação — Padrão ANSI*, 8ª ed.
# (Editora Campus), tradução da 2ª edição americana. Uma fatia por etapa, todas com
# `obra: kernighan-ritchie-c` e o custo do exemplar inteiro (ADR-0009). O estudante
# já tem o exemplar; o valor é o de um usado.
#
# ATENÇÃO sobre defasagem: o livro descreve o C89 (ANSI). Tudo o que ele ensina
# continua válido, mas não cobre C99/C11 (`//`, `bool`, `stdint.h`, declaração no
# meio do bloco). Compile os exercícios com `-std=c89 -pedantic -Wall` para ler o
# livro no padrão que ele descreve. O cap. 8 assume UNIX: em Linux ou macOS os
# exemplos rodam quase sem mudança; em Windows, use WSL.
# =========================================================================
