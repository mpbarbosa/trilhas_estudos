  # =========================================================================
  # etapa:programacao/programacao-de-sistemas (avulsa, ADR-0018)
  #
  # Quatro recursos, todos de acesso aberto, em **dois caminhos de linguagem** — e
  # isso não é fartura, é o que torna a etapa o que ela diz ser. Uma competência que
  # se declara independente de linguagem e só oferece material de uma linguagem é uma
  # competência de linguagem com outro nome. O caminho de C são os dois guias do Beej;
  # o de Rust são os dois livros abaixo dele.
  #
  # O descritor e a leitura parcial não estão em livro de linguagem: nem o Beej's
  # Guide to C (que para na `stdio.h`) nem o livro de Rust chegam a `fork` e a
  # `pipe`. Quem carrega essa parte da verificação é o Guia de IPC, e é por isso que
  # ele entra ao lado de um guia de linguagem em vez de no lugar dele.
  #
  # Em pt-BR, só o Comprehensive Rust. O que **não** entrou, para não ser pesquisado
  # de novo: a tradução comunitária do livro oficial de Rust
  # (rust-br.github.io/rust-book-pt-br) está parada na edição 2018 e com os capítulos
  # 11, 13, 14, 16 e 18 a 20 sem traduzir — o Comprehensive Rust cobre o mesmo
  # recorte, traduzido e mantido. E não há equivalente gratuito em pt-BR no caminho de
  # C: o K&R em português é pago e é fatia da trilha de C
  # (`obra: kernighan-ritchie-c`, acima), não desta etapa. Quem lê só português tem
  # caminho, mas tem um só, e ele é em Rust.
  #
  # Nenhum declara `obra`: `obra` existe para uma agregação monetária contar o
  # exemplar uma vez (ADR-0009), e obra gratuita soma zero de qualquer maneira.
  # =========================================================================
  - id: rec:programacao/beej-c-sistemas
    etapa: etapa:programacao/programacao-de-sistemas
    titulo: "Beej's Guide to C Programming — de `hello, world` a estruturas, apontadores, alocação manual, projetos de vários arquivos e o ambiente de fora (`argv`, variáveis, código de saída)"
    rev: 1
    status: ativo
    formato: texto
    idioma: en-US
    custo: 0
    duracao_min: 900
    url: https://beej.us/guide/bgc/
    disponivel: true
    verificado_em: 2026-10-19

