# Convenções deste arquivo:
#   custo  — em BRL, aproximado na data de `verificado_em`; 0 = gratuito.
#   idioma — tag BCP 47.
#
# -------------------------------------------------------------------------
# trilha:politica/totalitarismo-e-fuga-da-liberdade
#
#   Os dois exemplares vêm das duas referências em ABNT que o estudante trouxe em
#   2026-11-05, ambas com `ANO`, `EDITORA` e página em branco. O que se confirmou e o
#   que não:
#
#   obra: arendt-origens-do-totalitarismo — Companhia das Letras, tradução de Roberto
#     Raposo, como ele escreveu. A **1ª ed. brasileira é de 1989** (ISBN
#     85-7164-065-3, ~560 p.); a reedição em volume único de 2012 e a Companhia de
#     Bolso de 2013 trazem o mesmo texto com 832 p. e ISBN 978-85-359-2204-2. As
#     quatro fatias são do mesmo exemplar e por isso declaram o mesmo custo
#     (docs/catalogo.md §5.12). **A numeração dos capítulos da parte III se confirmou
#     só em parte**: "O movimento totalitário" e "O totalitarismo no poder" aparecem
#     no sumário da edição brasileira, e "Ideologia e terror: uma nova forma de
#     governo" é o capítulo final na edição inglesa. O título do cap. 10 e os números
#     de página variam entre a edição de 1989 e a de 2012 — confira no exemplar, não
#     aqui. "Domínio total" não é capítulo: é seção do capítulo sobre o totalitarismo
#     no poder, que é o que a indicação do estudante aponta.
#
#   obra: fromm-o-medo-a-liberdade — tradução de Octávio Alves Velho, Rio de Janeiro,
#     como ele escreveu, e **a editora depende da edição**: as ofertas de 1960 a 1974
#     são da Zahar Editores, e a 14ª ed. de 1983 saiu pela Guanabara Koogan, que
#     herdou o catálogo. Está declarada a Zahar, que é a editora da obra em quase
#     todas as edições. O livro está **fora de catálogo** e só existe em sebo, o que
#     explica o custo: é o exemplar mais caro desta trilha, três vezes o da Arendt.
#
#   Por isso a `url` é a busca do Estante Virtual, e não a página de uma editora: para
#   o Fromm é onde o exemplar existe hoje, e para a Arendt é onde as três edições
#   aparecem juntas. O `custo` é a **oferta mais baixa observada na busca em
#   2026-11-05** — R$ 40 para a Arendt de 2012 (a de bolso saía a partir de R$ 67
#   nova) e R$ 96,25 para o Fromm de 1968, cuja faixa ia até R$ 272. Preço de sebo
#   oscila por exemplar, e o número aqui envelhece mais rápido que o link.
# -------------------------------------------------------------------------
