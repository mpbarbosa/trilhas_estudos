# trilha:politica/desinformacao-e-resistencia
#
#   Os dez itens vêm da bibliografia de monografia que o estudante colou em 2026-11-10.
#   Como na trilha anterior da área, a `url` de livro fora de catálogo editorial é a
#   busca do Estante Virtual, e o `custo` é a **oferta mais baixa observada na busca em
#   2026-11-10**, usado incluído — número que envelhece mais rápido que o link.
#
#   **Quatro dos dez são gratuitos**, e é isso que torna a trilha percorrível sem
#   comprar nada em três das oito etapas: os dois artigos sobre deep fake, o artigo de
#   direito constitucional e o Heiden digitalizado no Internet Archive.
#
#   **Os três preços em dólar** (Scott, McAdam, Goodwin) foram convertidos pela cotação
#   do Banco Central Europeu de **2026-11-09**, R$ 5,5167/US$, via frankfurter.dev, e
#   **não incluem frete internacional nem imposto de importação**, que para livro podem
#   dobrar o valor.
#
#   obra: orwell-1984-principis — Principis (Jandira, SP), tradução de Karla Lima, como
#     o estudante escreveu. Em catálogo editorial; a busca devolveu um exemplar novo de
#     2023 a R$ 31,41, que é o `custo`. **Não se conferiu o preço na própria editora nem
#     no varejo grande**, e as edições de bolso da Principis costumam sair mais baratas
#     que em sebo — o número aqui é teto, não piso.
#
#   obra: foucault-vigiar-e-punir — Vozes, tradução de Raquel Ramalhete, como o
#     estudante escreveu (ele citou a 20. ed., 1999). Em catálogo; a busca devolveu
#     **uma** oferta, nova, a R$ 89,10, que é o `custo`. A etapa não pede o livro todo —
#     ver a duração do recurso.
#
#   obra: paxton-anatomia-do-fascismo — Paz e Terra, tradução de Patrícia e Paula
#     Zimbres, como o estudante escreveu. Em catálogo: 13 exemplares novos e 5 usados a
#     partir de R$ 76,92, que é o `custo`. A busca mostra duas fichas — uma com título
#     "A anatomia do Fascismo", datada 2007, a partir de R$ 179,00, e outra "Anatomia do
#     fascismo", sem data, que é a barata. **Não se confirmou se são edições diferentes
#     ou duas fichas do mesmo livro**; o `custo` é o da oferta mais baixa.
#
#   obra: scott-domination-and-the-arts-of-resistance — Yale, 1990; **a edição em
#     catálogo é a brochura revista, ISBN 978-0-300-05669-3**, e as fontes divergem na
#     paginação (251 p. na de 1990 e numa listagem da Blackwell's; 269 p. na brochura,
#     segundo o Goodreads). O `custo` é a conversão de US$ 23,16, o preço da Blackwell's
#     em 2026-11-10; a resenha da *American Political Science Review* dava US$ 29,95 em
#     1990, e um varejista australiano lista AU$ 34,95 hoje. Sem tradução brasileira
#     conhecida.
#
#   obra: mcadam-political-process — **a edição em catálogo é a 2ª, de 1999**, da
#     University of Chicago Press, 346 p., ISBN 978-0-226-55553-9, com o preço de tabela
#     de US$ 33,00 que dois varejistas repetem — e é essa a conversão do `custo`. O
#     estudante citou a 1ª, de 1982. **Armadilha de ISBN:** uma livraria lista
#     US$ 21,00, mas sob o ISBN 978-0-226-55552-2, que é outra tiragem; não é o preço
#     desta edição. Sem tradução brasileira conhecida.
#
#   obra: goodwin-no-other-way-out — Cambridge University Press, brochura de junho de
#     2001, ISBN 978-0-521-62948-5, col. Cambridge Studies in Comparative Politics. A
#     paginação divergiu entre as fontes (428 e 407 p. na brochura; 416 na capa dura). O
#     `custo` é a conversão do preço de tabela de US$ 42,00 que vários varejistas
#     repetem — mas **há usado muito mais barato** (US$ 7,29 na ThriftBooks em
#     2026-11-10), e para quem aceita usado o número aqui é cinco vezes o necessário.
#     Por isso o McAdam é a primeira via da etapa e este é a segunda.
#
#   rec:politica/chesney-citron-deep-fakes — publicado em 107 *California Law Review*
#     1753 (out. 2019), como o estudante escreveu. **Não se achou PDF aberto no site do
#     periódico**; o que se confirmou foi a versão em SSRN, 68 p., primeiro depósito em
#     21/07/2018 e última revisão em 17/12/2019 — e é essa a `url`. Artigo avulso: não
#     declara `obra`.
#
#   rec:politica/fornasier-deep-fakes-democracia — **o ano está errado na referência do
#     estudante.** Ele deu 2024; a página do periódico dá **v. 26, n. 39 (2023)**, com
#     DOI https://doi.org/10.5935/26.39.2023.9633. Autores e título conferem — Mateus de
#     Oliveira Fornasier, Natalia Ues Cury e Glauber Holanda, todos da UNIJUÍ. Acesso
#     aberto. Artigo avulso: não declara `obra`.
#
#   rec:politica/fares-paulo-republica-ao-imperio — **o ano também está errado.** Ele
#     deu 2023; a página do periódico dá **v. 2, n. 1 (2022)**, no dossiê "Arte
#     sequencial, cultura pop e reflexões contemporâneas" da *Cult de Cultura*, revista
#     da Faculdades EST (São Leopoldo, que é a cidade que ele escreveu). Autores da
#     Faculdade FASIPE. O artigo declara viés "exclusivamente pedagógico", o que é
#     exatamente o que a etapa cobra que se julgue. Acesso aberto; não declara `obra`.
#
#   rec:politica/heiden-der-fuehrer — Houghton Mifflin (Boston, 1944), tradução de Ralph
#     Manheim, como o estudante escreveu; também saiu pela Gollancz em Londres (1944 e
#     1945) e pela Beacon Press em 1969, e um registro dá 788 p. **Está digitalizado e
#     aberto no Internet Archive**, no item `derfuehrerhitlersrisetopower`, com PDF
#     (~92 MB) e EPUB derivado — por isso `custo: 0`. **Atenção:** a busca do Archive
#     devolve dezenove itens com este título, e a maioria são cópias de **empréstimo
#     controlado** (identificadores no padrão `derfuehrerhitler0000konr_*`), que exigem
#     conta e fila de espera. A `url` aqui é a do item aberto; se ele sair do ar, as
#     outras continuam servindo, com empréstimo. Não declara `obra`: é digitalização
#     aberta, não exemplar que se compre.
# -------------------------------------------------------------------------

