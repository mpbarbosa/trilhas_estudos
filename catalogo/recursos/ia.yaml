  # =========================================================================
  # trilha:ia/analise-de-sentimentos
  #
  # Cinco obras, quatro delas de acesso aberto legítimo, publicado pelo autor:
  #   obra: liu-sentiment-analysis-opinion-mining — Bing Liu, *Sentiment Analysis
  #     and Opinion Mining* (Morgan & Claypool, 2012). O autor publica o rascunho
  #     em PDF; custo 0 é o desse rascunho, não o do impresso.
  #   obra: liu-sentiment-analysis-2ed — Bing Liu, *Sentiment Analysis: Mining
  #     Opinions, Sentiments, and Emotions*, 2ª ed. (Cambridge, 2020). Impresso,
  #     importado; o custo é o do exemplar inteiro (ADR-0009) e é ESTIMATIVA —
  #     nenhuma loja cedeu preço ao `curl` deste ambiente. Os caps. 1 e 2 o autor
  #     publica em PDF, mas a fatia leva o custo do exemplar (validação 12).
  #   obra: bird-klein-loper-nltk — *Natural Language Processing with Python*, a
  #     edição on-line atualizada para Python 3 e NLTK 3, de graça em nltk.org.
  #   obra: jurafsky-martin-slp3 — as mesmas fatias de rascunho aberto que a trilha
  #     do Markov já usa. O rascunho de 06/01/2026 renumerou os capítulos: Naive
  #     Bayes virou o apêndice B e a regressão logística o cap. 4. Confira o
  #     título, não o número, ao abrir o PDF.
  #   obra: silge-robinson-text-mining-r — *Text Mining with R* (O'Reilly, 2017),
  #     de graça em tidytextmining.com.
  #
  # O fatiamento de todas é por número de capítulo, pelo sumário que o próprio
  # autor publica (docs/bibliografia.md, § IA e programação).
  # -------------------------------------------------------------------------

