  # =========================================================================
  # trilha:ia/modelo-de-markov-da-linguagem
  #
  # Duas obras fatiadas e uma de fatia única sustentam a trilha:
  #   obra: manning-schutze-fsnlp — Manning & Schütze, *Foundations of Statistical
  #     Natural Language Processing* (MIT Press, 1999). Impresso, importado; o custo
  #     declarado é o do exemplar inteiro (ADR-0009), aproximado na data de
  #     `verificado_em`. Esgotado no mercado brasileiro: a via comum é usado ou
  #     importação.
  #   Jurafsky & Martin, *Speech and Language Processing*, 3ª ed. — rascunho aberto
  #     em PDF, capítulo a capítulo, gratuito. Gratuito e fatiado não declara `obra`:
  #     não há o que somar uma vez só.
  #   obra: kernighan-pike-tpop — Kernighan & Pike, *The Practice of Programming*.
  #     A outra fatia (o livro fora do cap. 3) está em recursos/programacao.yaml,
  #     sustentando etapa:programacao/pratica-da-programacao.
  #
  # ATENÇÃO sobre defasagem: Manning & Schütze é de 1999 e Jurafsky & Martin
  # reescreve a cada rascunho. O que a trilha usa dos dois — suposição de Markov,
  # perplexidade, suavização, HMM — não envelheceu; o que envelheceu (estado da arte,
  # corpora citados, ferramentas) está fora do objetivo declarado. A numeração de
  # capítulo de Jurafsky & Martin muda entre rascunhos: confira o título, não o
  # número, ao abrir o PDF.
  # -------------------------------------------------------------------------

