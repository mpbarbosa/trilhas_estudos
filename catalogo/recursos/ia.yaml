  # ATENÇÃO sobre cobertura parcial: esta etapa desenvolve DUAS competências —
  # `comp:ia/engenharia-de-prompt` e `comp:ia/uso-de-llm-por-api`. O livro do Edney
  # Souza cobre bem a primeira (15 capítulos, 30+ técnicas, encadeamento de
  # instruções, biblioteca de prompts, critério de quando revisar a saída) e **não**
  # cobre a segunda: é declaradamente "sem escrever código", e não trata parâmetro de
  # decodificação, saída estruturada por API, custo nem latência por chamada. Entra
  # como alternativa pt-BR e gratuita; `rec:ia/prompt-engineering-for-llms` segue
  # sendo o único recurso que carrega a etapa inteira, e por isso não foi substituído
  # nem depreciado. Mesma convenção dos livros de D3 em recursos/web.yaml: quando o
  # recurso não carrega a etapa toda, o título diz o limite.
  - id: rec:ia/souza-engenharia-de-prompts
