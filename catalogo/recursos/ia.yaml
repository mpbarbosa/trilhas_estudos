  # ATENÇÃO, duas ressalvas, e as duas estão no registro:
  #
  # 1. `disponivel: false` de propósito. Em 2026-10-17 a loja brasileira diz "Não
  #    disponível. Não temos previsão de quando este produto estará disponível
  #    novamente", só em capa comum e sem edição Kindle. O motor filtra por
  #    `disponivel` (docs/motor-de-sugestao.md §2.2), então este recurso
  #    não gera candidato — e não pode gerar, porque não há como obtê-lo. A etapa
  #    continua servida por `rec:ia/biblia-claude-code-skills` e
  #    `rec:ia/claude-code-docs`, que é o que satisfaz a validação §5.5. Quando voltar
  #    ao estoque, virar `disponivel: true` é mudança substantiva: sobe a `rev` para 2
  #    (docs/catalogo.md §4), e é a hora de corrigir o `custo`.
  #
  # 2. `custo: 90` é **estimativa**, não preço conferido: produto esgotado não exibe
