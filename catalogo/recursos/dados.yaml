  # =========================================================================
  # trilha:dados/bancos-de-dados-relacionais
  #
  # Date, *An Introduction to Database Systems*, vol. I, 5ª ed. (Addison-Wesley),
  # aparece como uma entrada por etapa, uma por parte do livro — o caso de "recurso
  # composto" de docs/catalogo.md §8, o segundo no catálogo depois da Bíblia do
  # Claude AI. O `custo` repete por entrada embora o exemplar seja um só e já esteja
  # na estante, o que superestima o custo do caminho para o filtro de `custo_maximo`.
  # O valor é o de um exemplar usado: a 5ª edição está fora de catálogo.
  #
  # Sobre defasagem: a 5ª edição é de 1990. O modelo relacional, a álgebra, a
  # normalização e o log de recuperação envelheceram bem; o SQL do livro é o do DB2
  # da época (sem CTE, sem função de janela) e o capítulo de concorrência só conhece
  # bloqueio, não MVCC. Por isso as etapas de SQL e de transação levam um recurso
  # livre e atual ao lado do livro.
  # =========================================================================

