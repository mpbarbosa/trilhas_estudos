[project]
name = "trilhas-estudos"
version = "0.1.0"
description = "Controle e sugestão de trilhas de estudo"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["pyyaml>=6.0"]

[project.scripts]
trilhas = "trilhas.catalogo.cli:main"
trilhas-web = "trilhas.web.__main__:main"

[project.optional-dependencies]
# Camada de entrega (ADR-0007). O domínio continua com pyyaml e nada mais.
web = ["starlette>=0.40", "uvicorn>=0.30", "jinja2>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-pyyaml>=6.0", "httpx2>=2.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trilhas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["trilhas", "fabrica"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/trilhas"]
